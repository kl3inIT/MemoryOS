          format: int64
        oauthClientConfigured:
          type: boolean
        revision:
          type: integer
          format: int64
        syncIntervalMinutes:
          type: integer
          format: int32
          maximum: 2147483647
          minimum: 1
        scheduleRevision:
          type: integer
          format: int64
          minimum: 1
        scopeMode:
          type: string
          enum:
          - GENERAL
          - SPECIFIC
        counts:
          $ref: "#/components/schemas/GoogleDriveSelectionCountsResponse"
