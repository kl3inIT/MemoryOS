openapi: 3.1.0
info:
  title: MemoryOS browser API
  description: The same-origin contract consumed by the MemoryOS browser application.
  version: 1.0.0
servers:
- url: /
  description: Same-origin MemoryOS runtime
paths:
  /api/sources/{sourceId}/google-drive/schedule:
    put:
      tags:
      - Sources
      summary: Update the automatic Google Drive sync interval
      operationId: updateGoogleDriveSchedule
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoogleDriveScheduleRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoogleDriveConfigurationResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/google-drive/roots:
    put:
      tags:
      - Sources
      summary: Replace selected Google Drive roots without changing the creation-time
        scope mode
      operationId: replaceGoogleDriveRoots
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceGoogleDriveRootsRequest"
        required: true
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoogleDriveSelectionReceiptResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/chat/providers/{providerId}:
    put:
      tags:
      - Chat models
      summary: Replace provider settings at the expected revision; credential action
        is explicit
      operationId: updateChatProvider
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: providerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revision
        in: query
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
        required: true
      responses:
        "400":
          description: Invalid configuration
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: "Model management, Tenant membership or CSRF requirement not\
            \ met"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: Resource not accessible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Stale revision or duplicate model
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: "Provider, encryption key or client capacity unavailable"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "200":
          description: Successful result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderView"
      security:
      - bearerAuth: []
      - browserSession: []
    delete:
      tags:
      - Chat models
      summary: Delete a provider that is not the Chat default; transcript is preserved
      operationId: deleteChatProvider
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: providerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revision
        in: query
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "400":
          description: Invalid configuration
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: "Model management, Tenant membership or CSRF requirement not\
            \ met"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: Resource not accessible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Stale revision or duplicate model
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: "Provider, encryption key or client capacity unavailable"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "204":
          description: No Content
      security:
      - bearerAuth: []
      - browserSession: []
  /api/chat/personas/{personaId}/model:
    get:
      tags:
      - Chat models
      summary: Read the Persona model selection and revision; requires model management
      operationId: getPersonaModel
      parameters:
      - name: personaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "400":
          description: Invalid configuration
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: "Model management, Tenant membership or CSRF requirement not\
            \ met"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: Resource not accessible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Stale revision or duplicate model
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: "Provider, encryption key or client capacity unavailable"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "200":
          description: Successful result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaModel"
      security:
      - bearerAuth: []
      - browserSession: []
    put:
      tags:
      - Chat models
      summary: Set a Persona model or omit the model ID to inherit the Chat default
      operationId: setPersonaModel
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: personaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: modelConfigurationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: revision
        in: query
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "400":
          description: Invalid configuration
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: "Model management, Tenant membership or CSRF requirement not\
            \ met"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: Resource not accessible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Stale revision or duplicate model
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: "Provider, encryption key or client capacity unavailable"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "200":
          description: Successful result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaModel"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/chat/models/{modelId}:
    put:
      tags:
      - Chat models
      summary: Replace a model configuration at the expected revision
      operationId: updateChatModel
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: modelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revision
        in: query
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelInput"
        required: true
      responses:
        "400":
          description: Invalid configuration
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: "Model management, Tenant membership or CSRF requirement not\
            \ met"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: Resource not accessible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Stale revision or duplicate model
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: "Provider, encryption key or client capacity unavailable"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "200":
          description: Successful result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
      security:
      - bearerAuth: []
      - browserSession: []
    delete:
      tags:
      - Chat models
      summary: Delete a non-default model and clear its Persona defaults; transcript
        is preserved
      operationId: deleteChatModel
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: modelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revision
        in: query
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "400":
          description: Invalid configuration
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: "Model management, Tenant membership or CSRF requirement not\
            \ met"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: Resource not accessible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Stale revision or duplicate model
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: "Provider, encryption key or client capacity unavailable"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "204":
          description: No Content
      security:
      - bearerAuth: []
      - browserSession: []
  /api/chat/model-default:
    get:
      tags:
      - Chat models
      summary: Read the Tenant Chat default and its revision; requires model management
      operationId: getChatModelDefault
      responses:
        "400":
          description: Invalid configuration
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: "Model management, Tenant membership or CSRF requirement not\
