        required: true
        schema:
          type: string
          format: uuid
      - name: uploadId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceUploadReceipt"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/items/{itemId}/remove:
