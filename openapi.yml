  /api/chat/sessions/{sessionId}/messages/{assistantMessageId}/events:
    get:
      tags:
      - Chat
      summary: Read or resume reply events; reset requires persisted history
      description: "Events: text-delta, reasoning, tool, image, research-plan, top-level-branching,\
        \ research-agent-start, intermediate-report, intermediate-report-citations,\
        \ outcome, reset. Content event id is assistantMessageId:sequence. Only outcome\
        \ confirms a committed terminal state. Heartbeats are comments. A reset has\
        \ no event id."
      operationId: streamChatMessage
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
