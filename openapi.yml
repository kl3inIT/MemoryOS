openapi: 3.1.0
info:
  title: MemoryOS browser API
  description: The same-origin contract consumed by the MemoryOS browser application.
  version: 1.0.0
servers:
- url: /
  description: Same-origin MemoryOS runtime
paths:
  /api/sources/{sourceId}/sharepoint/scope:
    put:
      tags:
      - Sources
      summary: Replace what a SharePoint source synchronizes; the new scope is verified
        before it applies
      operationId: replaceSharePointScope
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceSharePointScopeRequest"
        required: true
      responses:
        "400":
          description: Invalid SharePoint scope
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "403":
          description: Management authority or CSRF required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: Source unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Source or credential changed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "202":
          description: Scope accepted for verification
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SharePointSelectionReceiptResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/sharepoint/schedule:
    put:
      tags:
      - Sources
      summary: Update the automatic synchronization and prune intervals
      operationId: updateSharePointSchedule
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSharePointScheduleRequest"
        required: true
      responses:
        "400":
          description: Invalid SharePoint scope
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "403":
          description: Management authority or CSRF required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: Source unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Source or credential changed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "200":
          description: Updated SharePoint configuration
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SharePointConfigurationResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/google-drive/schedule:
    put:
      tags:
      - Sources
      summary: Update the automatic Google Drive sync interval
      operationId: updateGoogleDriveSchedule
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoogleDriveScheduleRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoogleDriveConfigurationResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/google-drive/roots:
    put:
      tags:
      - Sources
      summary: Replace selected Google Drive roots without changing the creation-time
        scope mode
      operationId: replaceGoogleDriveRoots
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceGoogleDriveRootsRequest"
        required: true
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoogleDriveSelectionReceiptResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/mcp/servers/{serverId}:
    get:
      tags:
      - MCP
      summary: Read one MCP server with secrets redacted; requires MCP_MANAGE
      operationId: getMcpServer
      parameters:
      - name: serverId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "400":
          description: Invalid MCP configuration or tool snapshot
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "403":
          description: "MCP management, Tenant membership or CSRF requirement not\
            \ met"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: MCP server or tool not accessible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: "Stale revision, duplicate slug, missing credential or server\
            \ authorization required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: MCP server or credential encryption key unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "200":
          description: MCP server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServerView"
      security:
      - bearerAuth: []
      - browserSession: []
    put:
      tags:
      - MCP
      summary: "Replace server settings at the expected revision; changing URL, authentication\
        \ type or performer removes stored credentials"
      operationId: updateMcpServer
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: serverId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revision
        in: query
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpServerInput"
        required: true
      responses:
        "400":
          description: Invalid MCP configuration or tool snapshot
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "403":
          description: "MCP management, Tenant membership or CSRF requirement not\
            \ met"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: MCP server or tool not accessible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: "Stale revision, duplicate slug, missing credential or server\
            \ authorization required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: MCP server or credential encryption key unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "200":
          description: Saved MCP server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServerView"
      security:
      - bearerAuth: []
      - browserSession: []
    delete:
      tags:
      - MCP
      summary: Delete an MCP server with its tools and credentials at the expected
        revision
      operationId: deleteMcpServer
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: serverId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revision
        in: query
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "400":
          description: Invalid MCP configuration or tool snapshot
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "403":
          description: "MCP management, Tenant membership or CSRF requirement not\
            \ met"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: MCP server or tool not accessible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: "Stale revision, duplicate slug, missing credential or server\
            \ authorization required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: MCP server or credential encryption key unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "204":
          description: MCP server deleted with its tools and credentials
      security:
      - bearerAuth: []
      - browserSession: []
  /api/mcp/servers/{serverId}/tools/{toolId}/enabled:
    put:
      tags:
      - MCP
      summary: Enable or disable one tool at the expected revision
      operationId: setMcpServerToolEnabled
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: serverId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: toolId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revision
        in: query
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpToolEnablement"
        required: true
      responses:
        "400":
          description: Invalid MCP configuration or tool snapshot
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "403":
          description: "MCP management, Tenant membership or CSRF requirement not\
            \ met"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: MCP server or tool not accessible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: "Stale revision, duplicate slug, missing credential or server\
            \ authorization required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: MCP server or credential encryption key unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "200":
          description: Saved tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpToolView"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/mcp/servers/{serverId}/tools/enabled:
    put:
      tags:
      - MCP
      summary: Enable every exposable tool or disable every tool
      operationId: setAllMcpServerToolsEnabled
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: serverId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpToolEnablement"
        required: true
      responses:
        "400":
          description: Invalid MCP configuration or tool snapshot
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "403":
          description: "MCP management, Tenant membership or CSRF requirement not\
            \ met"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: MCP server or tool not accessible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: "Stale revision, duplicate slug, missing credential or server\
            \ authorization required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: MCP server or credential encryption key unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "200":
          description: Saved tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/McpToolView"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/mcp/servers/{serverId}/oauth/clients/{clientId}:
    put:
      tags:
      - MCP
      summary: Replace a pre-registered OAuth client at the expected revision
      operationId: updateMcpServerOAuthClient
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: serverId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: clientId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revision
        in: query
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpOAuthClientInput"
        required: true
      responses:
        "400":
          description: Invalid OAuth configuration or unusable authorization-server
            metadata
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "403":
          description: "MCP management, Tenant membership or CSRF requirement not\
            \ met"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: MCP server or OAuth client not accessible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Stale revision or duplicate label
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: "Authorization server, redirect URI or encryption key unavailable"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "200":
          description: Saved OAuth client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpOAuthClientView"
      security:
      - bearerAuth: []
      - browserSession: []
    delete:
      tags:
      - MCP
      summary: Delete an OAuth client and the connections made with it
      operationId: deleteMcpServerOAuthClient
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: serverId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: clientId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revision
        in: query
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "400":
          description: Invalid OAuth configuration or unusable authorization-server
            metadata
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "403":
          description: "MCP management, Tenant membership or CSRF requirement not\
            \ met"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: MCP server or OAuth client not accessible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Stale revision or duplicate label
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: "Authorization server, redirect URI or encryption key unavailable"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "204":
          description: OAuth client and its connections deleted
      security:
      - bearerAuth: []
      - browserSession: []
  /api/mcp/connections/{serverId}/api-key:
    put:
      tags:
      - MCP
      summary: Store the User's own API key after listing the server with it
      operationId: saveMcpConnectionApiKey
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: serverId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpConnectionApiKeyInput"
        required: true
      responses:
        "400":
          description: "Unusable API key, return address or server configuration"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "403":
          description: "Chat use, Tenant membership or CSRF requirement not met"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: MCP server not available to this User
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: "Server configuration changed, or the credential was rejected"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: MCP server or credential encryption key unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "200":
          description: Stored connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpConnection"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/identity/me/language:
    put:
      tags:
      - Identity
      summary: Set the authenticated account's interface language
      operationId: setCurrentIdentityLanguage
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LanguagePreference"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LanguagePreference"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/identity-providers/{alias}:
    put:
      tags:
      - Identity Providers
      summary: Update an upstream OIDC identity provider
      description: A null alias or issuerUrl keeps the stored value; a null clientSecret
        keeps the stored secret.
      operationId: updateIdentityProvider
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: alias
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIdentityProviderRequest"
        required: true
      responses:
        "200":
          description: The updated identity provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProviderResponse"
        "404":
          description: The identity provider was not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
    delete:
      tags:
      - Identity Providers
      summary: Delete an upstream identity provider and its JIT allowlist entry
      operationId: deleteIdentityProvider
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: alias
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
          minLength: 0
      responses:
        "204":
          description: The identity provider was deleted
        "404":
          description: The identity provider was not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/credentials/sharepoint/{credentialId}:
    put:
      tags:
      - Credentials
      summary: Rename a SharePoint credential with a revision precondition
      operationId: renameSharePointCredential
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: credentialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameSharePointCredentialRequest"
        required: true
      responses:
        "400":
          description: Invalid SharePoint credential
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "403":
          description: Management authority or CSRF required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: SharePoint credential unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: SharePoint credential changed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: Microsoft did not answer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "204":
          description: SharePoint credential renamed
      security:
      - bearerAuth: []
      - browserSession: []
    delete:
      tags:
      - Credentials
      summary: Delete an unused SharePoint credential with a revision precondition
      operationId: deleteSharePointCredential
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: credentialId
        in: path
        required: true
        schema:
          type: string
