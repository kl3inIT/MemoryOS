          format: int64
        oauthClientConfigured:
          type: boolean
        revision:
          type: integer
          format: int64
        syncIntervalMinutes:
          type: integer
          format: int32
          maximum: 2147483647
          minimum: 1
        scheduleRevision:
          type: integer
          format: int64
          minimum: 1
        scopeMode:
          type: string
          enum:
          - GENERAL
          - SPECIFIC
        counts:
          $ref: "#/components/schemas/GoogleDriveSelectionCountsResponse"
        discoveryRevision:
          type: integer
          format: int64
          minimum: 0
        discoveredAt:
          type:
          - string
          - "null"
          format: date-time
        discoveryErrors:
          type: array
          items:
            $ref: "#/components/schemas/GoogleDriveDiscoveryErrorResponse"
        lastSyncedAt:
          type:
          - string
          - "null"
          format: date-time
        pendingWork:
          type: boolean
        errorCode:
          type:
          - string
          - "null"
        pendingSelectionOperation:
          oneOf:
          - $ref: "#/components/schemas/SourceOperation"
          - type: "null"
      required:
      - accountEmail
      - counts
      - credentialId
      - credentialRevision
      - credentialStatus
      - discoveredAt
      - discoveryErrors
      - discoveryRevision
      - errorCode
      - lastSyncedAt
      - oauthClientConfigured
      - pendingSelectionOperation
      - pendingWork
      - revision
      - scheduleRevision
      - scopeMode
      - sourceId
      - syncIntervalMinutes
    GoogleDriveDiscoveryErrorResponse:
      type: object
      additionalProperties: false
