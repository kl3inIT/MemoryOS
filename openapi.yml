        "503":
          description: MCP server or credential encryption key unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "204":
          description: Connection removed
      security:
      - bearerAuth: []
      - browserSession: []
