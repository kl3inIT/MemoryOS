openapi: 3.1.0
info:
  title: MemoryOS browser API
  description: The same-origin contract consumed by the MemoryOS browser application.
  version: 1.0.0
servers:
- url: /
  description: Same-origin MemoryOS runtime
paths:
  /api/sources/{sourceId}/items:
    get:
      tags:
      - Sources
      summary: List current source items
      operationId: listSourceItems
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceItemResponse"
    post:
      tags:
      - Sources
      summary: Upload one bounded FILE source item
      operationId: uploadSourceItem
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
        required: true
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceUploadResponse"
  /api/sources/{sourceId}/items/{itemId}/remove:
    post:
      tags:
      - Sources
      summary: Start durable source item removal
      operationId: removeSourceItem
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceOperationResponse"
  /api/sources/{sourceId}/items/{itemId}/index-attempts:
    post:
      tags:
      - Sources
      summary: Reindex one source item
      operationId: reindexSourceItem
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceOperationResponse"
  /api/sources/{sourceId}/delete:
    post:
      tags:
      - Sources
      summary: Start durable source deletion
      operationId: deleteSource
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceOperationResponse"
  /api/sources/file:
    post:
      tags:
      - Sources
      summary: Create an Organization-owned FILE source
      operationId: createFileSource
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFileSourceRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceDetailResponse"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/invitations:
    get:
      tags:
      - Invitations
      summary: List the current owner's Organization invitations
      operationId: listInvitations
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - EXPIRED
          - REVOKED
      - name: email
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: CREATED_AT_DESC
          enum:
          - CREATED_AT_DESC
          - CREATED_AT_ASC
          - EMAIL_ASC
          - EMAIL_DESC
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: A bounded page of invitation lifecycle records without plaintext
            secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPage"
        "400":
          description: Invalid invitation list query
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor is not an active Organization owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
    post:
      tags:
      - Invitations
      summary: Create one Organization member invitation
      operationId: createInvitation
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
        required: true
      responses:
        "201":
          description: Invitation created; the invitation URL is returned only in
            this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedInvitation"
        "400":
          description: Invalid email
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor is not an active Organization owner or the same-origin
            header is missing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: A conflicting pending invitation already exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: Keycloak recipient activation is temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/invitations/{invitationId}/rotate:
    post:
      tags:
      - Invitations
      summary: Replace the secret of a pending invitation
      operationId: rotateInvitation
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: invitationId
        in: path
        description: Invitation identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Invitation rotated; the replacement URL is returned only in
            this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedInvitation"
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor is not an active Organization owner or the same-origin
            header is missing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "410":
          description: Invitation is no longer pending and available
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/invitations/{invitationId}/revoke:
    post:
      tags:
      - Invitations
      summary: Revoke a pending invitation
      operationId: revokeInvitation
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: invitationId
        in: path
        description: Invitation identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Invitation revoked
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor is not an active Organization owner or the same-origin
            header is missing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "410":
          description: Invitation is no longer pending and available
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/sources:
    get:
      tags:
      - Sources
      summary: List Organization sources
      operationId: listSources
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceSummaryResponse"
  /api/sources/{sourceId}:
    get:
      tags:
      - Sources
      summary: Get one source with current items
      operationId: getSource
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceDetailResponse"
  /api/sources/{sourceId}/index-attempts:
    get:
      tags:
      - Sources
      summary: List source indexing attempts
      operationId: listSourceIndexAttempts
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceOperationResponse"
  /api/source-operations/{operationId}:
    get:
      tags:
      - Sources
      summary: Get a durable source operation
      operationId: getSourceOperation
      parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceOperationResponse"
  /api/invitations/current:
    get:
      tags:
      - Invitations
      summary: Return the redacted invitation landing context from the browser session
      operationId: getCurrentInvitation
      responses:
        "200":
          description: Active invitation continuation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentInvitation"
        "410":
          description: No available invitation continuation exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /api/identity/me:
    get:
      tags:
      - Identity
      summary: Return the authenticated MemoryOS actor
      description: Accepts either an existing MemoryOS browser session or a valid
        bound bearer identity and returns the stable internal ActorId plus its durable
        Organization authority projection.
      operationId: getCurrentIdentity
      responses:
        "200":
          description: The authenticated actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentIdentity"
        "401":
          description: No accepted authentication is present
      security:
      - browserSession: []
      - bearerAuth: []
components:
  schemas:
    SourceItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        sha256:
          type: string
        sizeBytes:
          type: integer
          format: int64
        status:
          type: string
        uploadedAt:
          type: string
          format: date-time
        latestOperationId:
          type: string
          format: uuid
        errorCode:
          type: string
    SourceOperationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        errorCode:
          type: string
    SourceUploadResponse:
      type: object
      properties:
        item:
          $ref: "#/components/schemas/SourceItemResponse"
        operation:
          $ref: "#/components/schemas/SourceOperationResponse"
    CreateFileSourceRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
      required:
      - name
    SourceDetailResponse:
      type: object
      properties:
        source:
          $ref: "#/components/schemas/SourceSummaryResponse"
        items:
          type: array
          items:
            $ref: "#/components/schemas/SourceItemResponse"
    SourceSummaryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        access:
          type: string
        status:
          type: string
        pendingWork:
          type: boolean
        documentCount:
          type: integer
          format: int64
        lastSucceededAt:
          type: string
          format: date-time
        errorCode:
          type: string
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
    Invitation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - EXPIRED
          - REVOKED
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        acceptedActorId:
          type:
          - string
          - "null"
          format: uuid
        acceptedAt:
          type:
          - string
          - "null"
          format: date-time
        revokedAt:
          type:
          - string
          - "null"
          format: date-time
      required:
      - createdAt
      - email
      - expiresAt
      - id
      - status
    IssuedInvitation:
      type: object
      additionalProperties: false
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        invitationUrl:
          type: string
          description: Relative same-origin capability URL returned only from create
            or rotate.
          pattern: ^/invite/
        delivery:
          type: string
          description: Observable delivery result for this issue or rotation operation.
          enum:
          - ACTIVATION_EMAIL_SENT
          - EXISTING_ACCOUNT
          - RECOVERY_LINK_ONLY
      required:
      - delivery
      - invitation
      - invitationUrl
    InvitationPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          maximum: 100
          minimum: 1
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
    CurrentInvitation:
      type: object
      additionalProperties: false
      properties:
        organizationDisplayName:
          type: string
        expiresAt:
          type: string
          format: date-time
        continueUrl:
          type: string
          pattern: ^/invite/continue
      required:
      - continueUrl
      - expiresAt
      - organizationDisplayName
    CurrentIdentity:
      type: object
      additionalProperties: false
      properties:
        actorId:
          type: string
          format: uuid
          description: Stable internal MemoryOS actor identifier.
        organization:
          description: "Active Organization context, or null when the actor has no\
            \ active Organization membership."
          oneOf:
          - $ref: "#/components/schemas/CurrentOrganization"
          - type: "null"
        capabilities:
          type: array
          description: Canonical capabilities backed by current server enforcement.
          items:
            type: string
            enum:
            - INVITATIONS_MANAGE
            - SOURCES_MANAGE
      required:
      - actorId
      - capabilities
      - organization
    CurrentOrganization:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          description: Display name of the actor's active Organization.
        role:
          type: string
          description: Stable Organization membership role used for presentation.
          enum:
          - OWNER
          - MEMBER
      required:
      - displayName
      - role
    ApiProblem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
          description: Stable problem type for capability failures; omitted means
            RFC 9457 `about:blank`.
        title:
          type: string
          description: Short human-readable problem category.
        status:
          type: integer
          format: int32
          description: HTTP status code.
        detail:
          type: string
          description: Safe human-readable fallback detail.
        instance:
          type: string
          format: uri-reference
          description: Request path that produced the problem.
        code:
          type: string
          description: Stable capability-prefixed code; present only for expected
            capability failures.
          pattern: "^[A-Z][A-Z0-9_]*$"
      required:
      - detail
      - instance
      - status
      - title
  securitySchemes:
    browserSession:
      type: apiKey
      description: HttpOnly JDBC-backed Spring Security session cookie.
      name: SESSION
      in: cookie
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
