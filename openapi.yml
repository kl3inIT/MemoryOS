        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          maximum: 100
          minimum: 1
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
    CurrentInvitation:
      type: object
      additionalProperties: false
      properties:
        tenantDisplayName:
          type: string
        expiresAt:
          type: string
          format: date-time
        continueUrl:
          type: string
          pattern: ^/invite/continue
      required:
      - continueUrl
      - expiresAt
      - tenantDisplayName
    CurrentIdentity:
      type: object
      additionalProperties: false
      properties:
        actorId:
          type: string
          format: uuid
          description: Stable internal MemoryOS actor identifier.
        tenant:
          description: "Active Tenant context, or null when the actor has no active\
            \ Tenant membership."
          oneOf:
          - $ref: "#/components/schemas/CurrentTenant"
          - type: "null"
        capabilities:
          type: array
          description: Canonical capabilities backed by current server enforcement.
          items:
            type: string
            enum:
            - INVITATIONS_MANAGE
            - SOURCES_MANAGE
      required:
      - actorId
      - capabilities
      - tenant
    CurrentTenant:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          description: Display name of the actor's active Tenant.
        role:
          type: string
          description: Stable Tenant membership role used for presentation.
          enum:
          - OWNER
          - MEMBER
      required:
      - displayName
      - role
    GoogleDriveCredentialResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        accountEmail:
          type: string
        status:
          type: string
        credentialRevision:
          type: integer
          format: int64
        oauthClientConfigured:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sourceCount:
          type: integer
          format: int64
      required:
      - accountEmail
      - createdAt
      - credentialRevision
      - id
      - name
      - oauthClientConfigured
      - sourceCount
      - status
      - updatedAt
    ApiProblem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
          description: Stable problem type for capability failures; omitted means
            RFC 9457 `about:blank`.
        title:
          type: string
          description: Short human-readable problem category.
        status:
          type: integer
          format: int32
          description: HTTP status code.
        detail:
          type: string
          description: Safe human-readable fallback detail.
        instance:
          type: string
          format: uri-reference
          description: Request path that produced the problem.
        code:
          type: string
          description: Stable capability-prefixed code; present only for expected
            capability failures.
          pattern: "^[A-Z][A-Z0-9_]*$"
      required:
      - detail
      - instance
      - status
      - title
  securitySchemes:
    browserSession:
      type: apiKey
      description: HttpOnly JDBC-backed Spring Security session cookie.
      name: SESSION
      in: cookie
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
