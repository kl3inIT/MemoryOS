        required: false
        schema:
          type: string
          maxLength: 200
          minLength: 0
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceGroupPage"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/source-operations/{operationId}:
    get:
      tags:
      - Sources
      summary: Get a durable source operation
      operationId: getSourceOperation
      parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceOperation"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/invitations/current:
    get:
      tags:
      - Invitations
      summary: Return the redacted invitation landing context from the browser session
      operationId: getCurrentInvitation
      responses:
        "200":
          description: Active invitation continuation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentInvitation"
        "410":
          description: No available invitation continuation exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /api/identity/me:
    get:
      tags:
      - Identity
      summary: Return the authenticated MemoryOS actor
      description: Accepts either an existing MemoryOS browser session or a valid
        bound bearer identity and returns the stable internal ActorId plus its durable
        Tenant authority projection.
      operationId: getCurrentIdentity
      responses:
        "200":
          description: The authenticated actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentIdentity"
        "401":
          description: No accepted authentication is present
      security:
      - browserSession: []
      - bearerAuth: []
  /api/groups/{groupId}:
    get:
      tags:
      - Groups
      summary: Get one visible Group
      operationId: getGroup
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The server-authorized Group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupSummary"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/groups/{groupId}/sources:
    get:
      tags:
      - Groups
      summary: List sources associated with one group
      operationId: listGroupSources
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GroupSources"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/groups/{groupId}/candidates:
    get:
      tags:
      - Groups
      summary: List Tenant members eligible to join a Group
      operationId: listGroupCandidates
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
          minLength: 0
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: A bounded candidate page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMemberPage"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/groups/capabilities:
    get:
      tags:
      - Groups
      summary: List the server-owned Group capability registry
      operationId: listGroupCapabilities
      responses:
        "200":
          description: Capability metadata for implemented consumers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupCapabilities"
      security:
      - bearerAuth: []
      - browserSession: []
components:
  schemas:
    ReplaceUserGroupsRequest:
      type: object
      additionalProperties: false
      properties:
        groupIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
          maxLength: 100
          minItems: 0
      required:
      - groupIds
    InitiateSourceUploadRequest:
      type: object
      additionalProperties: false
      properties:
        filename:
          type: string
          maxLength: 255
          minLength: 0
        mediaType:
          type: string
          maxLength: 160
          minLength: 0
        sizeBytes:
          type: integer
          format: int64
          maximum: 10485760
          minimum: 1
        sha256:
          type: string
          minLength: 1
          pattern: "^[0-9a-f]{64}$"
      required:
      - filename
      - mediaType
      - sha256
      - sizeBytes
    SourceUploadAuthorization:
      type: object
      additionalProperties: false
      properties:
        uploadId:
          type: string
          format: uuid
        method:
          type: string
        uploadUrl:
          type: string
          format: uri
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - expiresAt
      - method
      - requiredHeaders
      - uploadId
      - uploadUrl
    SourceItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        sha256:
          type: string
        sizeBytes:
          type: integer
          format: int64
        status:
          type: string
        uploadedAt:
          type: string
          format: date-time
        latestOperationId:
          type:
          - string
          - "null"
          format: uuid
        errorCode:
          type:
          - string
          - "null"
      required:
      - errorCode
      - filename
      - id
      - latestOperationId
      - sha256
      - sizeBytes
      - status
      - uploadedAt
    SourceOperation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type:
          - string
          - "null"
          format: date-time
        errorCode:
          type:
          - string
          - "null"
      required:
      - completedAt
      - createdAt
      - errorCode
      - id
      - status
      - type
    SourceUploadReceipt:
      type: object
      additionalProperties: false
      properties:
        item:
          $ref: "#/components/schemas/SourceItem"
        operation:
          $ref: "#/components/schemas/SourceOperation"
      required:
      - item
      - operation
    UpdateSourceGroupsRequest:
      type: object
      additionalProperties: false
      properties:
        groupIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
          maxLength: 100
          minItems: 0
          minLength: 1
      required:
      - groupIds
    CreateFileSourceRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
        groupIds:
          type:
          - array
          - "null"
          items:
            type: string
            format: uuid
          maxItems: 100
          minItems: 0
      required:
      - name
    SourceDetail:
      type: object
      additionalProperties: false
      properties:
        source:
          $ref: "#/components/schemas/SourceSummary"
        items:
          type: array
          items:
            $ref: "#/components/schemas/SourceItem"
      required:
      - items
      - source
    SourceSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        access:
          type: string
        status:
          type: string
        pendingWork:
          type: boolean
        documentCount:
          type: integer
          format: int64
        lastSucceededAt:
          type:
          - string
          - "null"
          format: date-time
        errorCode:
          type:
          - string
          - "null"
        actions:
          type: array
          items:
            type: string
      required:
      - access
      - actions
      - documentCount
      - errorCode
      - id
      - lastSucceededAt
      - name
      - pendingWork
      - status
      - type
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
    Invitation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - EXPIRED
          - REVOKED
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        acceptedActorId:
          type:
          - string
          - "null"
          format: uuid
        acceptedAt:
          type:
          - string
          - "null"
          format: date-time
        revokedAt:
          type:
          - string
          - "null"
          format: date-time
      required:
      - createdAt
      - email
      - expiresAt
      - id
      - status
    IssuedInvitation:
      type: object
      additionalProperties: false
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        invitationUrl:
          type: string
          description: Relative same-origin capability URL returned only from create
            or rotate.
          pattern: ^/invite/
        delivery:
          type: string
          description: Observable delivery result for this issue or rotation operation.
          enum:
          - ACTIVATION_EMAIL_SENT
          - EXISTING_ACCOUNT
          - RECOVERY_LINK_ONLY
      required:
      - delivery
      - invitation
      - invitationUrl
    CreateGroupRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - name
    GroupSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        systemKey:
          oneOf:
          - $ref: "#/components/schemas/GroupSystemKey"
          - type: "null"
        memberCount:
          type: integer
          format: int64
          minimum: 0
        managerCount:
          type: integer
          format: int64
          minimum: 0
        capabilities:
          type: array
          items:
            type: string
            enum:
            - IAM_ADMIN
            - USERS_MANAGE
            - GROUPS_READ
            - GROUPS_MANAGE
            - SOURCES_READ
            - SOURCES_MANAGE
            - SOURCES_DELETE
        actions:
          type: array
          items:
            type: string
      required:
      - actions
      - capabilities
      - id
      - managerCount
      - memberCount
      - name
      - systemKey
    GroupSystemKey:
      type: string
      enum:
      - ADMIN
      - BASIC
    RenameGroupRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - name
    AddGroupMembersRequest:
      type: object
      additionalProperties: false
      properties:
        actorIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
          maxLength: 100
          minItems: 0
          minLength: 1
      required:
      - actorIds
    ReplaceGroupCapabilitiesRequest:
      type: object
      additionalProperties: false
      properties:
        capabilities:
          type: array
          items:
            type: string
            enum:
            - IAM_ADMIN
            - USERS_MANAGE
            - GROUPS_READ
            - GROUPS_MANAGE
            - SOURCES_READ
            - SOURCES_MANAGE
            - SOURCES_DELETE
          maxItems: 7
          maxLength: 7
          minItems: 0
      required:
      - capabilities
    AccountType:
      type: string
      enum:
      - STANDARD
    TenantMembershipRole:
      type: string
      enum:
      - OWNER
      - MEMBER
    UserCounts:
      type: object
      additionalProperties: false
      properties:
        active:
          type: integer
          format: int64
          minimum: 0
        inactive:
          type: integer
          format: int64
          minimum: 0
        invited:
          type: integer
          format: int64
          minimum: 0
      required:
      - active
      - inactive
      - invited
    UserGroup:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        systemKey:
          oneOf:
          - $ref: "#/components/schemas/GroupSystemKey"
          - type: "null"
      required:
      - id
      - name
      - systemKey
    UserListItem:
      type: object
      additionalProperties: false
      properties:
        actorId:
          type:
          - string
          - "null"
          format: uuid
          description: Stable Actor identifier for a membership row; null for an invitation
            row.
        invitationId:
          type:
          - string
          - "null"
          format: uuid
          description: Invitation identifier for an invited row; null for a membership
            row.
        displayName:
          type:
          - string
          - "null"
        email:
          type:
          - string
          - "null"
        emailVerified:
          type:
          - boolean
          - "null"
        profileIssuer:
          type:
          - string
          - "null"
        role:
          oneOf:
          - $ref: "#/components/schemas/TenantMembershipRole"
          - type: "null"
        accountType:
          oneOf:
          - $ref: "#/components/schemas/AccountType"
          - type: "null"
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - INVITED
        groups:
          type: array
          items:
            $ref: "#/components/schemas/UserGroup"
        invitationExpiresAt:
          type:
          - string
          - "null"
          format: date-time
          description: Invitation expiry for an invited row; null for a membership
            row.
      required:
      - accountType
      - actorId
      - displayName
      - email
      - emailVerified
      - groups
      - invitationExpiresAt
      - invitationId
      - profileIssuer
      - role
      - status
    UserPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserListItem"
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          maximum: 100
          minimum: 1
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int64
          minimum: 0
        counts:
          $ref: "#/components/schemas/UserCounts"
      required:
      - counts
      - items
      - page
      - size
      - totalItems
      - totalPages
    SourceGroup:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        systemKey:
          oneOf:
          - $ref: "#/components/schemas/GroupSystemKey"
          - type: "null"
      required:
      - id
      - name
      - systemKey
    SourceGroupList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SourceGroup"
      required:
      - items
    SourceGroupPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SourceGroup"
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          maximum: 100
          minimum: 1
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
    InvitationPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          maximum: 100
          minimum: 1
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
    CurrentInvitation:
      type: object
      additionalProperties: false
      properties:
        tenantDisplayName:
          type: string
        expiresAt:
          type: string
          format: date-time
        continueUrl:
          type: string
          pattern: ^/invite/continue
      required:
      - continueUrl
      - expiresAt
      - tenantDisplayName
    CurrentIdentity:
      type: object
      additionalProperties: false
      properties:
        actorId:
          type: string
          format: uuid
          description: Stable internal MemoryOS actor identifier.
        tenant:
          description: "Active Tenant context, or null when the actor has no active\
            \ Tenant membership."
          oneOf:
          - $ref: "#/components/schemas/CurrentTenant"
          - type: "null"
        capabilities:
          type: array
          description: Expanded global capabilities backed by current server enforcement.
          items:
            type: string
            enum:
            - IAM_ADMIN
            - USERS_MANAGE
            - GROUPS_READ
            - GROUPS_MANAGE
            - SOURCES_READ
            - SOURCES_MANAGE
            - SOURCES_DELETE
        scopedCapabilities:
          type: array
          description: Eligible capabilities available only within resources managed
            by this actor.
          items:
            type: string
            enum:
            - IAM_ADMIN
            - USERS_MANAGE
            - GROUPS_READ
            - GROUPS_MANAGE
            - SOURCES_READ
            - SOURCES_MANAGE
            - SOURCES_DELETE
        authorizationVersion:
          type: integer
          format: int64
          description: Monotonic Tenant IAM revision used only to invalidate private
            client data.
          minimum: 0
      required:
      - actorId
      - authorizationVersion
      - capabilities
      - scopedCapabilities
      - tenant
    CurrentTenant:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          description: Display name of the actor's active Tenant.
        role:
          type: string
          description: Stable Tenant membership role used for presentation.
          enum:
          - OWNER
          - MEMBER
      required:
      - displayName
      - role
    GroupPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupSummary"
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          maximum: 100
          minimum: 1
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
    GroupSources:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SourceSummary"
      required:
      - items
    GroupMember:
      type: object
      additionalProperties: false
      properties:
        actorId:
          type: string
          format: uuid
        displayName:
          type:
          - string
          - "null"
        email:
          type:
          - string
          - "null"
        accountType:
          type: string
          enum:
          - STANDARD
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        isManager:
          type: boolean
        protectedOwner:
          type: boolean
      required:
      - accountType
      - actorId
      - displayName
      - email
      - isManager
      - protectedOwner
      - status
    GroupMemberPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupMember"
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          maximum: 100
          minimum: 1
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
    GroupCapabilities:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupCapability"
      required:
      - items
    GroupCapability:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          enum:
          - IAM_ADMIN
          - USERS_MANAGE
          - GROUPS_READ
          - GROUPS_MANAGE
          - SOURCES_READ
          - SOURCES_MANAGE
          - SOURCES_DELETE
        label:
          type: string
        description:
          type: string
        editable:
          type: boolean
        implies:
          type: array
          items:
            type: string
            enum:
            - IAM_ADMIN
            - USERS_MANAGE
            - GROUPS_READ
            - GROUPS_MANAGE
            - SOURCES_READ
            - SOURCES_MANAGE
            - SOURCES_DELETE
      required:
      - description
      - editable
      - id
      - implies
      - label
    ApiProblem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
          description: Stable problem type for capability failures; omitted means
            RFC 9457 `about:blank`.
        title:
          type: string
          description: Short human-readable problem category.
        status:
          type: integer
          format: int32
          description: HTTP status code.
        detail:
          type: string
          description: Safe human-readable fallback detail.
        instance:
          type: string
          format: uri-reference
          description: Request path that produced the problem.
        code:
          type: string
          description: Stable capability-prefixed code; present only for expected
            capability failures.
          pattern: "^[A-Z][A-Z0-9_]*$"
      required:
      - detail
      - instance
      - status
      - title
  securitySchemes:
    browserSession:
      type: apiKey
      description: HttpOnly JDBC-backed Spring Security session cookie.
      name: SESSION
      in: cookie
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
