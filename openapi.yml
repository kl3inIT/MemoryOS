        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
      - name: after
        in: query
        required: false
        schema:
          type: string
      responses:
        "400":
          description: Invalid request or cursor
          content:
            application/problem+json:
              schema:
