          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: The member does not exist in the current Tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/sources/{sourceId}/uploads:
