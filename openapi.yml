openapi: 3.1.0
info:
  title: MemoryOS browser API
  description: The same-origin contract consumed by the MemoryOS browser application.
  version: 1.0.0
servers:
- url: /
  description: Same-origin MemoryOS runtime
paths:
  /api/invitations:
    get:
      tags:
      - invitation-controller
      summary: List the current owner's Organization invitations
      operationId: listInvitations
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - EXPIRED
          - REVOKED
      - name: email
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: CREATED_AT_DESC
          enum:
          - CREATED_AT_DESC
          - CREATED_AT_ASC
          - EMAIL_ASC
          - EMAIL_DESC
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: A bounded page of invitation lifecycle records without plaintext
            secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPage"
        "400":
          description: Invalid invitation list query
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor is not an active Organization owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
    post:
      tags:
      - invitation-controller
      summary: Create one Organization member invitation
      operationId: createInvitation
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
        required: true
      responses:
        "201":
          description: Invitation created; the invitation URL is returned only in
            this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedInvitation"
        "400":
          description: Invalid email
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor is not an active Organization owner or the same-origin
            header is missing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: A conflicting pending invitation already exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/invitations/{invitationId}/rotate:
    post:
      tags:
      - invitation-controller
      summary: Replace the secret of a pending invitation
      operationId: rotateInvitation
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: invitationId
        in: path
        description: Invitation identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Invitation rotated; the replacement URL is returned only in
            this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedInvitation"
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor is not an active Organization owner or the same-origin
            header is missing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "410":
          description: Invitation is no longer pending and available
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/invitations/current:
    get:
      tags:
      - invitation-controller
      summary: Return the redacted invitation landing context from the browser session
      operationId: getCurrentInvitation
      responses:
        "200":
          description: Active invitation continuation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentInvitation"
        "410":
          description: No available invitation continuation exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /api/identity/me:
    get:
      tags:
      - identity-controller
      summary: Return the authenticated MemoryOS actor
      description: Accepts either an existing MemoryOS browser session or a valid
        bound bearer identity and returns only the stable internal ActorId.
      operationId: getCurrentIdentity
      responses:
        "200":
          description: The authenticated actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentIdentity"
        "401":
          description: No accepted authentication is present
      security:
      - browserSession: []
      - bearerAuth: []
  /api/invitations/{invitationId}:
    delete:
      tags:
      - invitation-controller
      summary: Revoke a pending invitation
      operationId: revokeInvitation
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: invitationId
        in: path
        description: Invitation identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Invitation revoked
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor is not an active Organization owner or the same-origin
            header is missing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "410":
          description: Invitation is no longer pending and available
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
components:
  schemas:
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
    Invitation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - EXPIRED
          - REVOKED
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        acceptedActorId:
          type:
          - string
          - "null"
          format: uuid
        acceptedAt:
          type:
          - string
          - "null"
          format: date-time
        revokedAt:
          type:
          - string
          - "null"
          format: date-time
      required:
      - createdAt
      - email
      - expiresAt
      - id
      - status
    IssuedInvitation:
      type: object
      additionalProperties: false
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        invitationUrl:
          type: string
          description: Relative same-origin capability URL returned only from create
            or rotate.
          pattern: ^/invite/
      required:
      - invitation
      - invitationUrl
    InvitationPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          maximum: 100
          minimum: 1
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
    CurrentInvitation:
      type: object
      additionalProperties: false
      properties:
        organizationDisplayName:
          type: string
        expiresAt:
          type: string
          format: date-time
        continueUrl:
          type: string
          pattern: ^/invite/continue
      required:
      - continueUrl
      - expiresAt
      - organizationDisplayName
    CurrentIdentity:
      type: object
      additionalProperties: false
      properties:
        actorId:
          type: string
          format: uuid
          description: Stable internal MemoryOS actor identifier.
      required:
      - actorId
    ApiProblem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
          description: Stable problem type for capability failures; omitted means
            RFC 9457 `about:blank`.
        title:
          type: string
          description: Short human-readable problem category.
        status:
          type: integer
          format: int32
          description: HTTP status code.
        detail:
          type: string
          description: Safe human-readable fallback detail.
        instance:
          type: string
          format: uri-reference
          description: Request path that produced the problem.
        code:
          type: string
          description: Stable capability-prefixed code; present only for expected
            capability failures.
          pattern: "^[A-Z][A-Z0-9_]*$"
      required:
      - detail
      - instance
      - status
      - title
  securitySchemes:
    browserSession:
      type: apiKey
      description: HttpOnly JDBC-backed Spring Security session cookie.
      name: SESSION
      in: cookie
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
