          format: uuid
        sessionId:
          type: string
          format: uuid
        parentMessageId:
          type:
          - string
          - "null"
          format: uuid
        latestChildMessageId:
          type:
          - string
          - "null"
          format: uuid
        role:
          type: string
          enum:
          - USER
          - ASSISTANT
        content:
          type: string
        status:
          type: string
          enum:
          - COMPLETED
          - RUNNING
          - CANCELED
          - FAILED
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type:
          - string
          - "null"
          format: date-time
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ChatSource"
      required:
      - content
      - createdAt
      - finishedAt
      - id
      - latestChildMessageId
      - parentMessageId
      - role
      - sessionId
      - sources
      - status
    ChatSource:
      type: object
      properties:
        citationId:
          type: integer
          format: int32
        documentId:
          type: string
          format: uuid
        generation:
          type: string
          format: uuid
        title:
          type: string
        startOrdinal:
          type: integer
          format: int32
        endOrdinal:
          type: integer
          format: int32
        provenance:
          type: array
          items:
            $ref: "#/components/schemas/Provenance"
      required:
      - citationId
      - documentId
      - endOrdinal
      - generation
      - provenance
      - startOrdinal
      - title
    Provenance:
      type: object
      properties:
        ordinal:
          type: integer
          format: int32
        provenanceJson:
          type: string
      required:
      - ordinal
      - provenanceJson
    TextDeltaEvent:
      type: object
      properties:
        assistantMessageId:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
        text:
          type: string
      required:
      - assistantMessageId
      - sequence
      - text
    OutcomeEvent:
      type: object
      properties:
        assistantMessageId:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - COMPLETED
          - CANCELED
          - FAILED
        failureCode:
          type:
          - string
          - "null"
      required:
      - assistantMessageId
      - failureCode
      - sequence
      - status
    ResetEvent:
      type: object
      properties:
        assistantMessageId:
          type: string
          format: uuid
        reason:
          type: string
          enum:
          - BUFFER_MISSING
          - BUFFER_GAP
          - BUFFER_EXPIRED
      required:
      - assistantMessageId
      - reason
    SearchEvent:
      type: object
      properties:
        assistantMessageId:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
        toolCallId:
          type: string
        stage:
          type: string
          enum:
          - STARTED
          - SELECTING
          - EXPANDING
          - SOURCE
          - COMPLETED
          - FAILED
        source:
          oneOf:
          - $ref: "#/components/schemas/ChatSource"
          - type: "null"
      required:
      - assistantMessageId
      - sequence
      - source
      - stage
      - toolCallId
    Descriptor:
      type: object
      properties:
        type:
          type: string
        credentialRequirement:
          type: string
          enum:
          - REQUIRED
          - OPTIONAL
          - NONE
    AvailableModel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        providerName:
          type: string
        modelName:
          type: string
        displayName:
          type: string
        capabilities:
          $ref: "#/components/schemas/Capabilities"
        contextWindow:
          type: integer
          format: int32
        maxOutputTokens:
          type: integer
          format: int32
        pricing:
          $ref: "#/components/schemas/Pricing"
        isDefault:
          type: boolean
    ApiProblem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
          description: Stable problem type for capability failures; omitted means
            RFC 9457 `about:blank`.
        title:
          type: string
          description: Short human-readable problem category.
        status:
          type: integer
          format: int32
          description: HTTP status code.
        detail:
          type: string
          description: Safe human-readable fallback detail.
        instance:
          type: string
          format: uri-reference
          description: Request path that produced the problem.
        code:
          type: string
          description: Stable capability-prefixed code; present only for expected
            capability failures.
          pattern: "^[A-Z][A-Z0-9_]*$"
      required:
      - detail
      - instance
      - status
      - title
  securitySchemes:
    browserSession:
      type: apiKey
      description: HttpOnly JDBC-backed Spring Security session cookie.
      name: SESSION
      in: cookie
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
