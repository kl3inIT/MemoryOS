    ApiProblem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
          description: Stable problem type for capability failures; omitted means
            RFC 9457 `about:blank`.
        title:
          type: string
          description: Short human-readable problem category.
        status:
          type: integer
          format: int32
          description: HTTP status code.
        detail:
          type: string
          description: Safe human-readable fallback detail.
        instance:
          type: string
          format: uri-reference
          description: Request path that produced the problem.
        code:
          type: string
          description: Stable capability-prefixed code; present only for expected
            capability failures.
          pattern: "^[A-Z][A-Z0-9_]*$"
        errors:
          type: array
          description: Field validation failures with safe allowlisted parameters;
            no rejected values.
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              message:
                type: string
                description: Compatible fallback message; clients localize by code.
              code:
                type: string
                enum:
                - REQUIRED
                - INVALID
                - EMAIL
                - SIZE
                - MIN
                - MAX
              params:
                type: object
                additionalProperties: false
                properties:
                  min:
                    type: number
                  max:
                    type: number
            required:
            - code
            - field
            - message
            - params
      required:
      - detail
      - instance
      - status
      - title
