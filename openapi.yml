        "401":
          description: Authentication required
        "403":
          description: "MCP management, Tenant membership or CSRF requirement not\
            \ met"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: MCP server or OAuth client not accessible
          content:
            application/problem+json:
