          description: Tenant membership or CSRF requirement not met
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: Conversation or message not accessible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "200":
          description: Owned session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/chat/sessions/{sessionId}/messages/{assistantMessageId}/events:
    get:
      tags:
      - Chat
      summary: Read or resume reply events; reset requires persisted history
      description: "Events: text-delta, search, outcome, reset. Content event id is\
        \ assistantMessageId:sequence. Only outcome confirms a committed terminal\
        \ state. Heartbeats are comments. A reset has no event id."
      operationId: streamChatMessage
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: assistantMessageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
      - name: after
        in: query
        required: false
        schema:
          type: string
      responses:
        "400":
          description: Invalid request or cursor
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Tenant membership or CSRF requirement not met
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: Conversation or message not accessible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: Chat capacity exhausted or provider unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "200":
          description: SSE frames; the schema describes each data payload
          content:
            text/event-stream:
              schema:
                oneOf:
                - $ref: "#/components/schemas/TextDeltaEvent"
                - $ref: "#/components/schemas/OutcomeEvent"
                - $ref: "#/components/schemas/ResetEvent"
                - $ref: "#/components/schemas/SearchEvent"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/chat/provider-adapters:
    get:
      tags:
      - Chat models
      summary: List installed adapter types and credential requirements; requires
        model management
      operationId: listChatProviderAdapters
      responses:
        "400":
          description: Invalid configuration
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: "Model management, Tenant membership or CSRF requirement not\
            \ met"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: Resource not accessible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Stale revision or duplicate model
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: "Provider, encryption key or client capacity unavailable"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "200":
          description: Successful result
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Descriptor"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/chat/models:
    get:
      tags:
      - Chat models
      summary: List visible models authorized for this session or the builtin Persona
      operationId: listAvailableChatModels
      parameters:
      - name: sessionId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "400":
          description: Invalid configuration
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: "Model management, Tenant membership or CSRF requirement not\
            \ met"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: Resource not accessible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Stale revision or duplicate model
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: "Provider, encryption key or client capacity unavailable"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "200":
          description: Successful result
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailableModel"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/credentials/google-drive/{credentialId}:
    delete:
      tags:
      - Credentials
      summary: Delete an unused Google Drive credential with a revision precondition
      operationId: deleteGoogleDriveCredential
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: credentialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
      security:
      - bearerAuth: []
      - browserSession: []
components:
  schemas:
    UpdateGoogleDriveScheduleRequest:
