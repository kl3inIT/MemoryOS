                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Stale revision or duplicate label
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: "Authorization server, redirect URI or encryption key unavailable"
          content:
            application/problem+json:
