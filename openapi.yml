        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceDetail"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/items:
    get:
      tags:
      - Sources
      summary: List current source items
      operationId: listSourceItems
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceItem"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/index-attempts:
    get:
      tags:
      - Sources
      summary: List source indexing attempts
      operationId: listSourceIndexAttempts
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceOperation"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/group-options:
    get:
      tags:
      - Sources
      summary: List groups available for source association
      operationId: listSourceGroupOptions
      parameters:
      - name: search
