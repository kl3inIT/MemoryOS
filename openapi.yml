components:
  schemas:
    ReplaceSharePointScopeRequest:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
          format: uuid
        expectedCredentialRevision:
          type: integer
          format: int64
          description: Credential revision the scope was reviewed against
          exclusiveMinimum: 0
        scope:
          $ref: "#/components/schemas/SharePointScopeRequest"
      required:
      - expectedCredentialRevision
      - requestId
      - scope
    SharePointScopeRequest:
      type: object
      additionalProperties: false
      properties:
        scopeMode:
          type: string
          enum:
          - ALL_SITES
          - SPECIFIC
        siteUrls:
          type: array
          description: "Site, library or folder addresses; sharing links are accepted"
          items:
            type: string
            maxLength: 2048
            minLength: 0
          maxItems: 1000
          minItems: 0
        excludedSites:
          type: array
          items:
            type: string
            maxLength: 512
            minLength: 0
          maxItems: 100
          minItems: 0
        excludedPaths:
          type: array
          items:
            type: string
            maxLength: 512
            minLength: 0
          maxItems: 100
          minItems: 0
        includeDocuments:
          type: boolean
        includePages:
          type: boolean
        syncIntervalMinutes:
          type: integer
          format: int32
          minimum: 1
        pruneIntervalHours:
          type: integer
          format: int32
          description: Hours between prune runs; 0 disables pruning
          maximum: 8760
          minimum: 0
      required:
      - includeDocuments
      - includePages
      - scopeMode
      - syncIntervalMinutes
    SharePointSelectionReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        sourceId:
          type: string
          format: uuid
        operation:
          $ref: "#/components/schemas/SourceOperation"
      required:
      - operation
      - sourceId
    SourceOperation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type:
          - string
          - "null"
          format: date-time
        errorCode:
          type:
          - string
          - "null"
      required:
      - completedAt
      - createdAt
      - errorCode
      - id
      - status
      - type
    UpdateSharePointScheduleRequest:
      type: object
      additionalProperties: false
      properties:
        syncIntervalMinutes:
          type: integer
          format: int32
          minimum: 1
        pruneIntervalHours:
          type: integer
          format: int32
          description: 0 disables pruning
          maximum: 8760
          minimum: 0
      required:
      - pruneIntervalHours
      - syncIntervalMinutes
    SharePointConfigurationResponse:
      type: object
      additionalProperties: false
      properties:
        sourceId:
          type: string
          format: uuid
        credentialId:
          type: string
          format: uuid
        credentialName:
          type: string
        credentialStatus:
          type: string
        credentialRevision:
          type: integer
          format: int64
        scopeRevision:
          type: integer
          format: int64
        scopeMode:
          type: string
          enum:
          - ALL_SITES
          - SPECIFIC
        rootCount:
          type: integer
          format: int64
        excludedSites:
          type: array
          items:
            type: string
        excludedPaths:
          type: array
          items:
            type: string
        includeDocuments:
          type: boolean
        includePages:
          type: boolean
        syncIntervalMinutes:
          type: integer
          format: int32
        pruneIntervalHours:
          type: integer
          format: int32
        scheduleRevision:
          type: integer
          format: int64
        syncPaused:
          type: boolean
        tenantHost:
          type: string
        lastSyncedAt:
          type: string
          format: date-time
        lastPrunedAt:
          type: string
          format: date-time
        pendingWork:
          type: boolean
        errorCode:
          type: string
        pendingSelectionOperation:
          $ref: "#/components/schemas/SourceOperation"
      required:
      - credentialId
      - credentialName
      - credentialRevision
      - credentialStatus
      - excludedPaths
      - excludedSites
      - includeDocuments
      - includePages
      - pendingWork
      - pruneIntervalHours
      - rootCount
      - scheduleRevision
      - scopeMode
      - scopeRevision
      - sourceId
      - syncIntervalMinutes
      - syncPaused
    UpdateGoogleDriveScheduleRequest:
      type: object
      additionalProperties: false
      properties:
        syncIntervalMinutes:
          type: integer
          format: int32
          maximum: 2147483647
          minimum: 1
      required:
      - syncIntervalMinutes
    GoogleDriveConfigurationResponse:
      type: object
      additionalProperties: false
      properties:
        sourceId:
          type: string
          format: uuid
        credentialId:
          type: string
          format: uuid
        accountEmail:
          type: string
        credentialStatus:
          type: string
        credentialRevision:
          type: integer
          format: int64
        oauthClientConfigured:
          type: boolean
        credentialAuthMethod:
          type: string
          enum:
          - OAUTH
          - SERVICE_ACCOUNT
        revision:
          type: integer
          format: int64
        syncIntervalMinutes:
          type: integer
          format: int32
          maximum: 2147483647
          minimum: 1
        scheduleRevision:
          type: integer
          format: int64
          minimum: 1
        syncPaused:
          type: boolean
        scopeMode:
          type: string
          enum:
          - GENERAL
          - SPECIFIC
        counts:
          $ref: "#/components/schemas/GoogleDriveSelectionCountsResponse"
        discoveryRevision:
          type: integer
          format: int64
          minimum: 0
        discoveredAt:
          type:
          - string
          - "null"
          format: date-time
        discoveryErrors:
          type: array
          items:
            $ref: "#/components/schemas/GoogleDriveDiscoveryErrorResponse"
        lastSyncedAt:
          type:
          - string
          - "null"
          format: date-time
        pendingWork:
          type: boolean
        errorCode:
          type:
          - string
          - "null"
        pendingSelectionOperation:
          oneOf:
          - $ref: "#/components/schemas/SourceOperation"
          - type: "null"
      required:
      - accountEmail
      - counts
      - credentialAuthMethod
      - credentialId
      - credentialRevision
      - credentialStatus
      - discoveredAt
      - discoveryErrors
      - discoveryRevision
      - errorCode
      - lastSyncedAt
      - oauthClientConfigured
      - pendingSelectionOperation
      - pendingWork
      - revision
      - scheduleRevision
      - scopeMode
      - sourceId
      - syncIntervalMinutes
      - syncPaused
    GoogleDriveDiscoveryErrorResponse:
      type: object
      additionalProperties: false
      properties:
        fileId:
          type: string
        fileName:
          type: string
        code:
          type: string
      required:
      - code
      - fileId
      - fileName
    GoogleDriveSelectionCountsResponse:
      type: object
      additionalProperties: false
      properties:
        folders:
          type: integer
          format: int64
        files:
          type: integer
          format: int64
        linkedDocuments:
          type: integer
          format: int64
        approvedLinkedDocuments:
          type: integer
          format: int64
      required:
      - approvedLinkedDocuments
      - files
      - folders
      - linkedDocuments
    ReplaceGoogleDriveRootsRequest:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
          format: uuid
        discoveryRevision:
          type: integer
          format: int64
          minimum: 0
        credentialRevision:
          type: integer
          format: int64
          exclusiveMinimum: 0
        scopeMode:
          type: string
          description: GENERAL includes the connected account's My Drive tree; SPECIFIC
            includes selected links.
          enum:
          - GENERAL
          - SPECIFIC
        links:
          type: array
          description: Empty for GENERAL; distinct non-overlapping links bounded by
            the selection policy for SPECIFIC.
          items:
            type: string
            maxLength: 2048
            minLength: 0
        linkedDocumentIds:
          type: array
          description: Distinct discovered document IDs explicitly approved for ingestion.
            Empty for GENERAL.
          items:
            type: string
            minLength: 1
            pattern: "[A-Za-z0-9_-]{1,256}"
          maxItems: 500
          minItems: 0
          uniqueItems: true
      required:
      - credentialRevision
      - discoveryRevision
      - linkedDocumentIds
      - links
      - requestId
      - scopeMode
    GoogleDriveSelectionReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        sourceId:
          type: string
          format: uuid
        operation:
          $ref: "#/components/schemas/SourceOperation"
      required:
      - operation
      - sourceId
    McpHeaderTemplateChange:
      type: object
      description: "Header values may contain secrets and are never returned; API-key\
        \ servers place {api_key}"
      properties:
        action:
          type: string
          enum:
          - KEEP
          - REPLACE
          - REMOVE
        values:
          type:
          - object
          - "null"
          additionalProperties:
            type: string
      required:
      - action
    McpSecretChange:
      type: object
      properties:
        action:
          type: string
          enum:
          - KEEP
          - REPLACE
          - REMOVE
        value:
          type:
          - string
          - "null"
          maxLength: 8192
      required:
      - action
