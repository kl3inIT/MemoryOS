openapi: 3.1.0
info:
  title: MemoryOS browser API
  description: The same-origin contract consumed by the MemoryOS browser application.
  version: 1.0.0
servers:
- url: /
  description: Same-origin MemoryOS runtime
paths:
  /api/sources/{sourceId}/google-drive/schedule:
    put:
      tags:
      - Sources
      summary: Update the automatic Google Drive sync interval
      operationId: updateGoogleDriveSchedule
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoogleDriveScheduleRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoogleDriveConfigurationResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/google-drive/roots:
    put:
      tags:
      - Sources
      summary: Replace selected Google Drive roots without changing the creation-time
        scope mode
      operationId: replaceGoogleDriveRoots
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceGoogleDriveRootsRequest"
        required: true
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoogleDriveSelectionReceiptResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/uploads:
    post:
      tags:
      - Sources
      summary: Authorize one direct FILE source upload
      operationId: initiateSourceUpload
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiateSourceUploadRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceUploadAuthorization"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/uploads/{uploadId}/finalize:
    post:
      tags:
      - Sources
      summary: Verify and adopt one direct FILE source upload
      operationId: finalizeSourceUpload
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: uploadId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceUploadReceipt"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/items/{itemId}/remove:
    post:
      tags:
      - Sources
      summary: Start durable source item removal
      operationId: removeSourceItem
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceOperation"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/items/{itemId}/index-attempts:
    post:
      tags:
      - Sources
      summary: Reindex one source item
      operationId: reindexSourceItem
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceOperation"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/google-drive/sync:
    post:
      tags:
      - Sources
      summary: Schedule durable Google Drive synchronization
      operationId: synchronizeGoogleDriveSource
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceOperation"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/google-drive/linked-documents/discover:
    post:
      tags:
      - Sources
      summary: Discover linked documents without approving or synchronizing them
      operationId: discoverGoogleDriveLinkedDocuments
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoogleDriveConfigurationResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/delete:
    post:
      tags:
      - Sources
      summary: Start durable source deletion
      operationId: deleteSource
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceOperation"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/google-drive:
    post:
      tags:
      - Sources
      summary: Create a Google Drive source using a reusable credential
      operationId: createGoogleDriveSource
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoogleDriveSourceRequest"
        required: true
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoogleDriveSelectionReceiptResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/file:
    post:
      tags:
      - Sources
      summary: Create a Tenant-owned FILE source
      operationId: createFileSource
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFileSourceRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceSummary"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/invitations:
    get:
      tags:
      - Invitations
      summary: List the current owner's Tenant invitations
      operationId: listInvitations
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - EXPIRED
          - REVOKED
      - name: email
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: CREATED_AT_DESC
          enum:
          - CREATED_AT_DESC
          - CREATED_AT_ASC
          - EMAIL_ASC
          - EMAIL_DESC
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: A bounded page of invitation lifecycle records without plaintext
            secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPage"
        "400":
          description: Invalid invitation list query
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor is not an active Tenant owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
    post:
      tags:
      - Invitations
      summary: Create one Tenant member invitation
      operationId: createInvitation
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
        required: true
      responses:
        "201":
          description: Invitation created; the invitation URL is returned only in
            this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedInvitation"
        "400":
          description: Invalid email
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor is not an active Tenant owner or the same-origin
            header is missing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: A conflicting pending invitation already exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: Keycloak recipient activation is temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/invitations/{invitationId}/rotate:
    post:
      tags:
      - Invitations
      summary: Replace the secret of a pending invitation
      operationId: rotateInvitation
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: invitationId
        in: path
        description: Invitation identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Invitation rotated; the replacement URL is returned only in
            this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedInvitation"
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor is not an active Tenant owner or the same-origin
            header is missing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "410":
          description: Invitation is no longer pending and available
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/invitations/{invitationId}/revoke:
    post:
      tags:
      - Invitations
      summary: Revoke a pending invitation
      operationId: revokeInvitation
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: invitationId
        in: path
        description: Invitation identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Invitation revoked
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor is not an active Tenant owner or the same-origin
            header is missing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "410":
          description: Invitation is no longer pending and available
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/credentials/google-drive/{credentialId}/revoke:
    post:
      tags:
      - Credentials
      summary: Revoke a shared Google Drive credential and disconnect all attached
        Sources
      operationId: revokeGoogleDriveCredential
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: credentialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeGoogleDriveCredentialRequest"
        required: true
      responses:
        "204":
          description: No Content
      security:
      - bearerAuth: []
      - browserSession: []
  /api/credentials/google-drive/authorization:
    post:
      tags:
      - Credentials
      summary: Authorize a reusable Google Drive credential
      operationId: startGoogleDriveAuthorization
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartGoogleDriveAuthorizationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoogleDriveAuthorizationResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources:
    get:
      tags:
      - Sources
      summary: List Tenant sources
      operationId: listSources
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceSummary"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}:
    get:
      tags:
      - Sources
      summary: Get one source summary
      operationId: getSource
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceSummary"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/runs:
    get:
      tags:
      - Sources
      summary: List source synchronization runs and independent activity summaries
      operationId: listSourceRuns
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
          maximum: 100
          minimum: 1
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - QUEUED
          - ACQUIRING
          - RETRY_SCHEDULED
          - RECOVERY_PENDING
          - INDEXING
          - SUCCEEDED
          - COMPLETED_WITH_ERRORS
          - FAILED
          - SUPERSEDED
          - CANCELLED
          - UNKNOWN
      - name: trigger
        in: query
        required: false
        schema:
          type: string
          enum:
          - SCHEDULED
          - MANUAL
          - INITIAL
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceRunPage"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/runs/{runId}:
    get:
      tags:
      - Sources
      summary: Get acquisition and owned indexing outcomes for one source run
      operationId: getSourceRun
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceRun"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/runs/{runId}/errors:
    get:
      tags:
      - Sources
      summary: List retained safe run and file errors
      operationId: listSourceRunErrors
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceRunErrorPage"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/items:
    get:
      tags:
      - Sources
      summary: List a page of current source items
      operationId: listSourceItems
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceItemPage"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/index-attempts:
    get:
      tags:
      - Sources
      summary: List source indexing attempts
      operationId: listSourceIndexAttempts
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceOperationPage"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/google-drive:
    get:
      tags:
      - Sources
      summary: Get Google Drive source configuration
      operationId: getGoogleDriveConfiguration
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoogleDriveConfigurationResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/google-drive/selection:
    get:
      tags:
      - Sources
      summary: Page selected roots and verified linked documents within a pinned Source
        snapshot
      operationId: getGoogleDriveSelection
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - FOLDER
          - FILE
          - LINKED
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoogleDriveSelectionResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/google-drive/selection-tree:
    get:
      tags:
      - Sources
      summary: "Expand selected Google Drive folders, files, and discovered links\
        \ within the Source scope"
      operationId: getGoogleDriveSelectionTree
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: parentId
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoogleDriveSelectionTreeResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/google-drive/selection-draft:
    get:
      tags:
      - Sources
      summary: Get the complete bounded active selection for editing
      operationId: getGoogleDriveSelectionDraft
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoogleDriveSelectionDraftResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/google-drive/selection-requests/{requestId}:
    get:
      tags:
      - Sources
      summary: Recover an accepted selection receipt for the initiating owner
      operationId: getGoogleDriveSelectionRequest
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoogleDriveSelectionReceiptResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/google-drive/selection-policy:
    get:
      tags:
      - Sources
      summary: Get the configured selection admission limits
      operationId: getGoogleDriveSelectionPolicy
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoogleDriveSelectionPolicyResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/source-operations/{operationId}:
    get:
      tags:
      - Sources
      summary: Get a durable source operation
      operationId: getSourceOperation
      parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceOperation"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/invitations/current:
    get:
      tags:
      - Invitations
      summary: Return the redacted invitation landing context from the browser session
      operationId: getCurrentInvitation
      responses:
        "200":
          description: Active invitation continuation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentInvitation"
        "410":
          description: No available invitation continuation exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /api/identity/me:
    get:
      tags:
      - Identity
      summary: Return the authenticated MemoryOS actor
      description: Accepts either an existing MemoryOS browser session or a valid
        bound bearer identity and returns the stable internal ActorId plus its durable
        Tenant authority projection.
      operationId: getCurrentIdentity
      responses:
        "200":
          description: The authenticated actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentIdentity"
        "401":
          description: No accepted authentication is present
      security:
      - browserSession: []
      - bearerAuth: []
  /api/credentials/google-drive:
    get:
      tags:
      - Credentials
      summary: List reusable Tenant-owned Google Drive credentials
      operationId: listGoogleDriveCredentials
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoogleDriveCredentialResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/credentials/google-drive/{credentialId}:
    delete:
      tags:
      - Credentials
      summary: Delete an unused Google Drive credential with a revision precondition
      operationId: deleteGoogleDriveCredential
      parameters:
      - name: credentialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
      security:
      - bearerAuth: []
      - browserSession: []
components:
  schemas:
    UpdateGoogleDriveScheduleRequest:
