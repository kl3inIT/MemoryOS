openapi: 3.1.0
info:
  title: MemoryOS browser API
  description: The same-origin contract consumed by the MemoryOS browser application.
  version: 1.0.0
servers:
- url: /
  description: Same-origin MemoryOS runtime
paths:
  /api/users/{actorId}/groups:
    post:
      tags:
      - Users
      summary: Replace a user's ordinary Group memberships
      operationId: replaceUserGroups
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: actorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceUserGroupsRequest"
        required: true
      responses:
        "204":
          description: The user's ordinary Group memberships were replaced
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor lacks IAM_ADMIN authority or the same-origin header
            is missing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: The user or a requested Group does not exist in the current
            Tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/users/{actorId}/deactivate:
    post:
      tags:
      - Users
      summary: Deactivate an existing Tenant member
      operationId: deactivateUser
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: actorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The member is inactive
        "401":
          description: No accepted authentication is present
        "403":
          description: "The actor lacks USERS_MANAGE authority, the target is protected,\
            \ or the same-origin header is missing"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: The member does not exist in the current Tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/users/{actorId}/activate:
    post:
      tags:
      - Users
      summary: Activate an existing Tenant member
      operationId: activateUser
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: actorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The member is active
        "401":
          description: No accepted authentication is present
        "403":
          description: "The actor lacks USERS_MANAGE authority, the target is protected,\
            \ or the same-origin header is missing"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: The member does not exist in the current Tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/sources/{sourceId}/uploads:
    post:
      tags:
      - Sources
      summary: Authorize one direct FILE source upload
      operationId: initiateSourceUpload
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiateSourceUploadRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceUploadAuthorization"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/uploads/{uploadId}/finalize:
    post:
      tags:
      - Sources
      summary: Verify and adopt one direct FILE source upload
      operationId: finalizeSourceUpload
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: uploadId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceUploadReceipt"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/items/{itemId}/remove:
    post:
      tags:
      - Sources
      summary: Start durable source item removal
      operationId: removeSourceItem
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceOperation"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/items/{itemId}/index-attempts:
    post:
      tags:
      - Sources
      summary: Reindex one source item
      operationId: reindexSourceItem
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceOperation"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/groups:
    get:
      tags:
      - Sources
      summary: List groups associated with one source
      operationId: listSourceGroups
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceGroupList"
      security:
      - bearerAuth: []
      - browserSession: []
    post:
      tags:
      - Sources
      summary: Replace groups associated with one source
      operationId: updateSourceGroups
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSourceGroupsRequest"
        required: true
      responses:
        "204":
          description: No Content
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/delete:
    post:
      tags:
      - Sources
      summary: Start durable source deletion
      operationId: deleteSource
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceOperation"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/file:
    post:
      tags:
      - Sources
      summary: Create a Tenant-owned FILE source
      operationId: createFileSource
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFileSourceRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceDetail"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/invitations:
    get:
      tags:
      - Invitations
      summary: List Tenant invitations manageable by the current IAM administrator
      operationId: listInvitations
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - EXPIRED
          - REVOKED
      - name: email
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: CREATED_AT_DESC
          enum:
          - CREATED_AT_DESC
          - CREATED_AT_ASC
          - EMAIL_ASC
          - EMAIL_DESC
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: A bounded page of invitation lifecycle records without plaintext
            secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPage"
        "400":
          description: Invalid invitation list query
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor lacks USERS_MANAGE authority
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
    post:
      tags:
      - Invitations
      summary: Create one Tenant member invitation
      operationId: createInvitation
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
        required: true
      responses:
        "201":
          description: Invitation created; the invitation URL is returned only in
            this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedInvitation"
        "400":
          description: Invalid email
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor lacks USERS_MANAGE authority or the same-origin header
            is missing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: A conflicting pending invitation already exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: Keycloak recipient activation is temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/invitations/{invitationId}/rotate:
    post:
      tags:
      - Invitations
      summary: Replace the secret of a pending invitation
      operationId: rotateInvitation
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: invitationId
        in: path
        description: Invitation identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Invitation rotated; the replacement URL is returned only in
            this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedInvitation"
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor lacks USERS_MANAGE authority or the same-origin header
            is missing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "410":
          description: Invitation is no longer pending and available
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/invitations/{invitationId}/revoke:
    post:
      tags:
      - Invitations
      summary: Revoke a pending invitation
      operationId: revokeInvitation
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: invitationId
        in: path
        description: Invitation identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Invitation revoked
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor lacks USERS_MANAGE authority or the same-origin header
            is missing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "410":
          description: Invitation is no longer pending and available
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/groups:
    get:
      tags:
      - Groups
      summary: List Groups visible to the current actor
      operationId: listGroups
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
          minLength: 0
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: "A bounded, server-authorized Group page"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupPage"
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor has no global or managed-Group read authority
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - bearerAuth: []
      - browserSession: []
    post:
      tags:
      - Groups
      summary: Create an ordinary Group
      operationId: createGroup
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
        required: true
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupSummary"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/groups/{groupId}/rename:
    post:
      tags:
      - Groups
      summary: Rename an ordinary Group
      operationId: renameGroup
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameGroupRequest"
        required: true
      responses:
        "200":
          description: Group renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupSummary"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/groups/{groupId}/members:
    get:
      tags:
      - Groups
      summary: List members of one visible Group
      operationId: listGroupMembers
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
          minLength: 0
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: A bounded Group member page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMemberPage"
      security:
      - bearerAuth: []
      - browserSession: []
    post:
      tags:
      - Groups
      summary: Add Tenant members to a Group
      operationId: addGroupMembers
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGroupMembersRequest"
        required: true
      responses:
        "204":
          description: Members added idempotently
      security:
      - bearerAuth: []
      - browserSession: []
  /api/groups/{groupId}/members/{actorId}/remove:
    post:
      tags:
      - Groups
      summary: Remove one member from a Group
      operationId: removeGroupMember
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: actorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Member removed
      security:
      - bearerAuth: []
      - browserSession: []
  /api/groups/{groupId}/members/{actorId}/remove-manager:
    post:
      tags:
      - Groups
      summary: Remove a manager from an ordinary Group
      operationId: removeGroupManager
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: actorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Manager flag removed
      security:
      - bearerAuth: []
      - browserSession: []
  /api/groups/{groupId}/members/{actorId}/assign-manager:
    post:
      tags:
      - Groups
      summary: Assign a manager to an ordinary Group
      operationId: assignGroupManager
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: actorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Manager assigned
      security:
      - bearerAuth: []
      - browserSession: []
  /api/groups/{groupId}/delete:
    post:
      tags:
      - Groups
      summary: Delete an ordinary Group
      operationId: deleteGroup
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Group links and grants deleted
      security:
      - bearerAuth: []
      - browserSession: []
  /api/groups/{groupId}/capabilities:
    post:
      tags:
      - Groups
      summary: Replace an ordinary Group's explicit capability grants
      operationId: replaceGroupCapabilities
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceGroupCapabilitiesRequest"
        required: true
      responses:
        "204":
          description: Explicit grants replaced
      security:
      - bearerAuth: []
      - browserSession: []
  /api/users:
    get:
      tags:
      - Users
      summary: List users manageable by the current IAM administrator
      operationId: listUsers
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
          minLength: 0
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - INVITED
      - name: role
        in: query
        required: false
        schema:
          type: string
          enum:
          - OWNER
          - MEMBER
      - name: groupId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: NAME_ASC
          enum:
          - NAME_ASC
          - NAME_DESC
          - EMAIL_ASC
          - EMAIL_DESC
          - STATUS_ASC
          - STATUS_DESC
          - ROLE_ASC
          - ROLE_DESC
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: A bounded page of current memberships and eligible pending
            invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          description: Invalid user directory query
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor lacks USERS_MANAGE authority
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/sources:
    get:
      tags:
      - Sources
      summary: List Tenant sources
      operationId: listSources
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceSummary"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}:
    get:
      tags:
      - Sources
