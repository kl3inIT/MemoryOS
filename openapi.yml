      - createdAt
      - errorCode
      - id
      - status
      - type
    ReplaceGoogleDriveRootsRequest:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
          format: uuid
        discoveryRevision:
          type: integer
          format: int64
        credentialRevision:
          type: integer
          format: int64
        scopeMode:
          type: string
          description: GENERAL includes the connected account's My Drive tree; SPECIFIC
            includes selected links.
          enum:
          - GENERAL
          - SPECIFIC
        links:
          type: array
          description: Empty for GENERAL; distinct non-overlapping links bounded by
            the selection policy for SPECIFIC.
          items:
            type: string
            maxLength: 2048
            minLength: 0
