openapi: 3.1.1
info:
  title: MemoryOS browser API
  version: 1.0.0
  description: The same-origin contract consumed by the MemoryOS browser application.
servers:
  - url: /
    description: Same-origin MemoryOS runtime
paths:
  /api/identity/me:
    get:
      operationId: getCurrentIdentity
      summary: Return the authenticated MemoryOS actor
      description: >-
        Accepts either an existing MemoryOS browser session or a valid bound bearer identity
        and returns only the stable internal ActorId.
      security:
        - browserSession: []
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentIdentity'
        '401':
          description: No accepted authentication is present
  /api/invitations:
    get:
      operationId: listInvitations
      summary: List the current owner's Organization invitations
      security:
        - browserSession: []
        - bearerAuth: []
      responses:
        '200':
          description: Invitation lifecycle records without plaintext secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '401':
          description: No accepted authentication is present
        '403':
          description: The actor is not an active Organization owner
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
    post:
      operationId: createInvitation
      summary: Create one Organization member invitation
      security:
        - browserSession: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BrowserMutationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created; the invitation URL is returned only in this response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedInvitation'
        '400':
          description: Invalid email
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '401':
          description: No accepted authentication is present
        '403':
          description: The actor is not an active Organization owner or the same-origin header is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '409':
          description: A conflicting pending invitation already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
  /api/invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      summary: Revoke a pending invitation
      security:
        - browserSession: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InvitationId'
        - $ref: '#/components/parameters/BrowserMutationHeader'
      responses:
        '204':
          description: Invitation revoked
        '401':
          description: No accepted authentication is present
        '403':
          description: The actor is not an active Organization owner or the same-origin header is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '410':
          description: Invitation is no longer pending and available
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
  /api/invitations/{invitationId}/rotate:
    post:
      operationId: rotateInvitation
      summary: Replace the secret of a pending invitation
      security:
        - browserSession: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InvitationId'
        - $ref: '#/components/parameters/BrowserMutationHeader'
      responses:
        '200':
          description: Invitation rotated; the replacement URL is returned only in this response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedInvitation'
        '401':
          description: No accepted authentication is present
        '403':
          description: The actor is not an active Organization owner or the same-origin header is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '410':
          description: Invitation is no longer pending and available
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
  /api/invitations/current:
    get:
      operationId: getCurrentInvitation
      summary: Return the redacted invitation landing context from the browser session
      security: []
      responses:
        '200':
          description: Active invitation continuation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentInvitation'
        '410':
          description: No available invitation continuation exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: SESSION
      description: HttpOnly JDBC-backed Spring Security session cookie.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BrowserMutationHeader:
      name: X-MemoryOS-CSRF
      in: header
      required: true
      description: Same-origin non-simple request guard for browser-session mutations.
      schema:
        type: string
        const: '1'
  schemas:
    CurrentIdentity:
      type: object
      additionalProperties: false
      required:
        - actorId
      properties:
        actorId:
          type: string
          format: uuid
          description: Stable internal MemoryOS actor identifier.
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    InvitationStatus:
      type: string
      enum:
        - PENDING
        - ACCEPTED
        - EXPIRED
        - REVOKED
    Invitation:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - status
        - createdAt
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/InvitationStatus'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        acceptedActorId:
          type:
            - string
            - 'null'
          format: uuid
        acceptedAt:
          type:
            - string
            - 'null'
          format: date-time
        revokedAt:
          type:
            - string
            - 'null'
          format: date-time
    IssuedInvitation:
      type: object
      additionalProperties: false
      required:
        - invitation
        - invitationUrl
      properties:
        invitation:
          $ref: '#/components/schemas/Invitation'
        invitationUrl:
          type: string
          pattern: '^/invite/'
          description: Relative same-origin capability URL returned only from create or rotate.
    CurrentInvitation:
      type: object
      additionalProperties: false
      required:
        - organizationDisplayName
        - expiresAt
        - continueUrl
      properties:
        organizationDisplayName:
          type: string
        expiresAt:
          type: string
          format: date-time
        continueUrl:
          type: string
          pattern: '^/invite/continue'
    ApiProblem:
      type: object
      additionalProperties: false
      required:
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri
          description: Stable problem type for capability failures; omitted means RFC 9457 `about:blank`.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: Stable capability-prefixed code; present only for expected capability failures.
