openapi: 3.1.0
info:
  title: MemoryOS browser API
  description: The same-origin contract consumed by the MemoryOS browser application.
  version: 1.0.0
servers:
- url: /
  description: Same-origin MemoryOS runtime
paths:
  /api/sources/{sourceId}/google-drive/schedule:
    put:
      tags:
      - Sources
      summary: Update the automatic Google Drive sync interval
      operationId: updateGoogleDriveSchedule
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoogleDriveScheduleRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoogleDriveConfigurationResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/google-drive/roots:
    put:
      tags:
      - Sources
      summary: Replace Google Drive scope mode and selected roots atomically
      operationId: replaceGoogleDriveRoots
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceGoogleDriveRootsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoogleDriveConfigurationResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/uploads:
    post:
      tags:
      - Sources
      summary: Authorize one direct FILE source upload
      operationId: initiateSourceUpload
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiateSourceUploadRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceUploadAuthorization"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/uploads/{uploadId}/finalize:
    post:
      tags:
      - Sources
      summary: Verify and adopt one direct FILE source upload
      operationId: finalizeSourceUpload
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: uploadId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceUploadReceipt"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/items/{itemId}/remove:
    post:
      tags:
      - Sources
      summary: Start durable source item removal
      operationId: removeSourceItem
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceOperation"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/items/{itemId}/index-attempts:
    post:
      tags:
      - Sources
      summary: Reindex one source item
      operationId: reindexSourceItem
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceOperation"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/google-drive/sync:
    post:
      tags:
      - Sources
      summary: Schedule durable Google Drive synchronization
      operationId: synchronizeGoogleDriveSource
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceOperation"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/delete:
    post:
      tags:
      - Sources
      summary: Start durable source deletion
      operationId: deleteSource
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceOperation"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/google-drive:
    post:
      tags:
      - Sources
      summary: Create a Google Drive source using a reusable credential
      operationId: createGoogleDriveSource
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoogleDriveSourceRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceDetail"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/file:
    post:
      tags:
      - Sources
      summary: Create a Tenant-owned FILE source
      operationId: createFileSource
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFileSourceRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceDetail"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/invitations:
    get:
      tags:
      - Invitations
      summary: List the current owner's Tenant invitations
      operationId: listInvitations
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - EXPIRED
          - REVOKED
      - name: email
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: CREATED_AT_DESC
          enum:
          - CREATED_AT_DESC
          - CREATED_AT_ASC
          - EMAIL_ASC
          - EMAIL_DESC
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: A bounded page of invitation lifecycle records without plaintext
            secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPage"
        "400":
          description: Invalid invitation list query
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor is not an active Tenant owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
    post:
      tags:
      - Invitations
      summary: Create one Tenant member invitation
      operationId: createInvitation
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
        required: true
      responses:
        "201":
          description: Invitation created; the invitation URL is returned only in
            this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedInvitation"
        "400":
          description: Invalid email
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor is not an active Tenant owner or the same-origin
            header is missing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: A conflicting pending invitation already exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: Keycloak recipient activation is temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/invitations/{invitationId}/rotate:
    post:
      tags:
      - Invitations
      summary: Replace the secret of a pending invitation
      operationId: rotateInvitation
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: invitationId
        in: path
        description: Invitation identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Invitation rotated; the replacement URL is returned only in
            this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedInvitation"
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor is not an active Tenant owner or the same-origin
            header is missing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "410":
          description: Invitation is no longer pending and available
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/invitations/{invitationId}/revoke:
    post:
      tags:
      - Invitations
      summary: Revoke a pending invitation
      operationId: revokeInvitation
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: invitationId
        in: path
        description: Invitation identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Invitation revoked
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor is not an active Tenant owner or the same-origin
            header is missing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "410":
          description: Invitation is no longer pending and available
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/credentials/google-drive/{credentialId}/revoke:
    post:
      tags:
      - Credentials
      summary: Revoke a shared Google Drive credential and disconnect all attached
        Sources
      operationId: revokeGoogleDriveCredential
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: credentialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeGoogleDriveCredentialRequest"
        required: true
      responses:
        "204":
          description: No Content
      security:
      - bearerAuth: []
      - browserSession: []
  /api/credentials/google-drive/authorization:
    post:
      tags:
      - Credentials
      summary: Authorize a reusable Google Drive credential
      operationId: startGoogleDriveAuthorization
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartGoogleDriveAuthorizationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoogleDriveAuthorizationResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources:
    get:
      tags:
      - Sources
      summary: List Tenant sources
      operationId: listSources
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceSummary"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}:
    get:
      tags:
      - Sources
      summary: Get one source with current items
      operationId: getSource
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceDetail"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/items:
    get:
      tags:
      - Sources
      summary: List current source items
      operationId: listSourceItems
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceItem"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/index-attempts:
    get:
      tags:
      - Sources
      summary: List source indexing attempts
      operationId: listSourceIndexAttempts
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceOperation"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/sources/{sourceId}/google-drive:
    get:
      tags:
      - Sources
      summary: Get Google Drive source configuration
      operationId: getGoogleDriveConfiguration
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoogleDriveConfigurationResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/source-operations/{operationId}:
    get:
      tags:
      - Sources
      summary: Get a durable source operation
      operationId: getSourceOperation
      parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceOperation"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/invitations/current:
    get:
      tags:
      - Invitations
      summary: Return the redacted invitation landing context from the browser session
      operationId: getCurrentInvitation
      responses:
        "200":
          description: Active invitation continuation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentInvitation"
        "410":
          description: No available invitation continuation exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /api/identity/me:
    get:
      tags:
      - Identity
      summary: Return the authenticated MemoryOS actor
      description: Accepts either an existing MemoryOS browser session or a valid
        bound bearer identity and returns the stable internal ActorId plus its durable
        Tenant authority projection.
      operationId: getCurrentIdentity
      responses:
        "200":
          description: The authenticated actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentIdentity"
        "401":
          description: No accepted authentication is present
      security:
      - browserSession: []
      - bearerAuth: []
  /api/credentials/google-drive:
    get:
      tags:
      - Credentials
      summary: List reusable Tenant-owned Google Drive credentials
      operationId: listGoogleDriveCredentials
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoogleDriveCredentialResponse"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/credentials/google-drive/{credentialId}:
    delete:
      tags:
      - Credentials
      summary: Delete an unused Google Drive credential with a revision precondition
      operationId: deleteGoogleDriveCredential
      parameters:
      - name: credentialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
      security:
      - bearerAuth: []
      - browserSession: []
components:
  schemas:
    UpdateGoogleDriveScheduleRequest:
      type: object
      additionalProperties: false
      properties:
        syncIntervalMinutes:
          type: integer
          format: int32
          maximum: 2147483647
          minimum: 1
      required:
      - syncIntervalMinutes
    GoogleDriveConfigurationResponse:
      type: object
      additionalProperties: false
      properties:
        sourceId:
          type: string
          format: uuid
        credentialId:
          type: string
          format: uuid
        accountEmail:
          type: string
        credentialStatus:
          type: string
        credentialRevision:
          type: integer
          format: int64
        oauthClientConfigured:
          type: boolean
        revision:
          type: integer
          format: int64
        syncIntervalMinutes:
          type: integer
          format: int32
          maximum: 2147483647
          minimum: 1
        scheduleRevision:
          type: integer
          format: int64
          minimum: 1
        scopeMode:
          type: string
          enum:
          - GENERAL
          - SPECIFIC
        roots:
          type: array
          description: "Selected roots for SPECIFIC; empty for GENERAL, whose My Drive\
            \ root is server-managed."
          items:
            $ref: "#/components/schemas/GoogleDriveRootResponse"
        lastSyncedAt:
          type:
          - string
          - "null"
          format: date-time
        pendingWork:
          type: boolean
        errorCode:
          type:
          - string
          - "null"
      required:
      - accountEmail
      - credentialId
      - credentialRevision
      - credentialStatus
      - errorCode
      - lastSyncedAt
      - oauthClientConfigured
      - pendingWork
      - revision
      - roots
      - scheduleRevision
      - scopeMode
      - sourceId
      - syncIntervalMinutes
    GoogleDriveRootResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        mimeType:
          type: string
      required:
      - id
      - mimeType
      - name
    ReplaceGoogleDriveRootsRequest:
      type: object
      additionalProperties: false
      properties:
        scopeMode:
          type: string
          description: GENERAL includes the connected account's My Drive tree; SPECIFIC
            includes selected links.
          enum:
          - GENERAL
          - SPECIFIC
        links:
          type: array
          description: "Empty for GENERAL; 1–20 distinct, non-overlapping file or\
            \ folder links for SPECIFIC."
          items:
            type: string
            maxLength: 2048
            minLength: 0
          maxItems: 20
          minItems: 0
      required:
      - links
      - scopeMode
    InitiateSourceUploadRequest:
      type: object
      additionalProperties: false
      properties:
        filename:
          type: string
          maxLength: 255
          minLength: 0
        mediaType:
          type: string
          maxLength: 160
          minLength: 0
        sizeBytes:
          type: integer
          format: int64
          maximum: 10485760
          minimum: 1
        sha256:
          type: string
          minLength: 1
          pattern: "^[0-9a-f]{64}$"
      required:
      - filename
      - mediaType
      - sha256
      - sizeBytes
    SourceUploadAuthorization:
      type: object
      additionalProperties: false
      properties:
        uploadId:
          type: string
          format: uuid
        method:
          type: string
        uploadUrl:
          type: string
          format: uri
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - expiresAt
      - method
      - requiredHeaders
      - uploadId
      - uploadUrl
    SourceItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        sha256:
          type: string
        sizeBytes:
          type: integer
          format: int64
        status:
          type: string
        uploadedAt:
          type: string
          format: date-time
        latestOperationId:
          type:
          - string
          - "null"
          format: uuid
        errorCode:
          type:
          - string
          - "null"
      required:
      - errorCode
      - filename
      - id
      - latestOperationId
      - sha256
      - sizeBytes
      - status
      - uploadedAt
    SourceOperation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type:
          - string
          - "null"
          format: date-time
        errorCode:
          type:
          - string
          - "null"
      required:
      - completedAt
      - createdAt
      - errorCode
      - id
      - status
      - type
    SourceUploadReceipt:
      type: object
      additionalProperties: false
      properties:
        item:
          $ref: "#/components/schemas/SourceItem"
        operation:
          $ref: "#/components/schemas/SourceOperation"
      required:
      - item
      - operation
    CreateGoogleDriveSourceRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
        credentialId:
          type: string
          format: uuid
        scopeMode:
          type: string
          description: GENERAL includes the connected account's My Drive tree; SPECIFIC
            includes selected links.
          enum:
          - GENERAL
          - SPECIFIC
        links:
          type: array
          description: "Empty for GENERAL; 1–20 distinct, non-overlapping file or\
            \ folder links for SPECIFIC."
          items:
            type: string
            maxLength: 2048
            minLength: 0
          maxItems: 20
          minItems: 0
      required:
      - credentialId
      - links
      - name
      - scopeMode
    SourceDetail:
      type: object
      additionalProperties: false
      properties:
        source:
          $ref: "#/components/schemas/SourceSummary"
        items:
          type: array
          items:
            $ref: "#/components/schemas/SourceItem"
      required:
      - items
      - source
    SourceSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        access:
          type: string
        status:
          type: string
        pendingWork:
          type: boolean
        documentCount:
          type: integer
          format: int64
        lastSucceededAt:
          type:
          - string
          - "null"
          format: date-time
        errorCode:
          type:
          - string
          - "null"
      required:
      - access
      - documentCount
      - errorCode
      - id
      - lastSucceededAt
      - name
      - pendingWork
      - status
      - type
    CreateFileSourceRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
      required:
      - name
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
    Invitation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - EXPIRED
          - REVOKED
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        acceptedActorId:
          type:
          - string
          - "null"
          format: uuid
        acceptedAt:
          type:
          - string
          - "null"
          format: date-time
        revokedAt:
          type:
          - string
          - "null"
          format: date-time
      required:
      - createdAt
      - email
      - expiresAt
      - id
      - status
    IssuedInvitation:
      type: object
      additionalProperties: false
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        invitationUrl:
          type: string
          description: Relative same-origin capability URL returned only from create
            or rotate.
          pattern: ^/invite/
        delivery:
          type: string
          description: Observable delivery result for this issue or rotation operation.
          enum:
          - ACTIVATION_EMAIL_SENT
          - EXISTING_ACCOUNT
          - RECOVERY_LINK_ONLY
      required:
      - delivery
      - invitation
      - invitationUrl
    RevokeGoogleDriveCredentialRequest:
      type: object
      additionalProperties: false
      properties:
        expectedCredentialRevision:
          type: integer
          format: int64
      required:
      - expectedCredentialRevision
    StartGoogleDriveAuthorizationRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
        credentialId:
          type: string
          format: uuid
        expectedCredentialRevision:
          type: integer
          format: int64
        oauthClientJson:
          type: string
          maxLength: 16384
          minLength: 0
      required:
      - name
    GoogleDriveAuthorizationResponse:
      type: object
      additionalProperties: false
      properties:
        authorizationUrl:
          type: string
      required:
      - authorizationUrl
    InvitationPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          maximum: 100
          minimum: 1
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
    CurrentInvitation:
      type: object
      additionalProperties: false
      properties:
        tenantDisplayName:
          type: string
        expiresAt:
          type: string
          format: date-time
        continueUrl:
          type: string
          pattern: ^/invite/continue
      required:
      - continueUrl
      - expiresAt
      - tenantDisplayName
    CurrentIdentity:
      type: object
      additionalProperties: false
      properties:
        actorId:
          type: string
          format: uuid
          description: Stable internal MemoryOS actor identifier.
        tenant:
          description: "Active Tenant context, or null when the actor has no active\
            \ Tenant membership."
          oneOf:
          - $ref: "#/components/schemas/CurrentTenant"
          - type: "null"
        capabilities:
          type: array
          description: Canonical capabilities backed by current server enforcement.
          items:
            type: string
            enum:
            - INVITATIONS_MANAGE
            - SOURCES_MANAGE
      required:
      - actorId
      - capabilities
      - tenant
    CurrentTenant:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          description: Display name of the actor's active Tenant.
        role:
          type: string
          description: Stable Tenant membership role used for presentation.
          enum:
          - OWNER
          - MEMBER
      required:
      - displayName
      - role
    GoogleDriveCredentialResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        accountEmail:
          type: string
        status:
          type: string
        credentialRevision:
          type: integer
          format: int64
        oauthClientConfigured:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sourceCount:
          type: integer
          format: int64
      required:
      - accountEmail
      - createdAt
      - credentialRevision
      - id
      - name
      - oauthClientConfigured
      - sourceCount
      - status
      - updatedAt
    ApiProblem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
          description: Stable problem type for capability failures; omitted means
            RFC 9457 `about:blank`.
        title:
          type: string
          description: Short human-readable problem category.
        status:
          type: integer
          format: int32
          description: HTTP status code.
        detail:
          type: string
          description: Safe human-readable fallback detail.
        instance:
          type: string
          format: uri-reference
          description: Request path that produced the problem.
        code:
          type: string
          description: Stable capability-prefixed code; present only for expected
            capability failures.
          pattern: "^[A-Z][A-Z0-9_]*$"
      required:
      - detail
      - instance
      - status
      - title
  securitySchemes:
    browserSession:
      type: apiKey
      description: HttpOnly JDBC-backed Spring Security session cookie.
      name: SESSION
      in: cookie
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
