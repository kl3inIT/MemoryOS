        \ as one paginated library, optionally narrowed to one conversation, to starred\
        \ files, or to uploads still in progress"
      operationId: listChatLibrary
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: sources
        in: query
        description: Empty means every source
        required: false
        schema:
          type: array
          items:
            type: string
      - name: categories
        in: query
        description: Empty means every category
        required: false
        schema:
          type: array
          items:
            type: string
      - name: sessionId
        in: query
        description: Only this conversation's own files; the caller must own it
        required: false
        schema:
          type: string
          format: uuid
      - name: favorite
        in: query
        description: Only starred files
        required: false
        schema:
          type: boolean
          default: false
      - name: status
        in: query
        description: "READY lists usable files; PENDING lists uploads still uploading,\
          \ processing or failed; TRASH lists what the owner deleted and may still\
          \ restore"
        required: false
        schema:
          type: string
          enum:
          - READY
          - PENDING
          - TRASH
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: NEWEST
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "400":
          description: Invalid library request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
