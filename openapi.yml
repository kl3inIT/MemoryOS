          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: Resource not accessible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Stale revision or duplicate model
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: "Provider, encryption key or client capacity unavailable"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "200":
          description: Successful result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Default"
      security:
      - bearerAuth: []
      - browserSession: []
    put:
      tags:
      - Chat models
      summary: "Set a visible, publicly available Tenant Chat default"
      operationId: setChatModelDefault
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: modelConfigurationId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: revision
        in: query
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "400":
          description: Invalid configuration
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: "Model management, Tenant membership or CSRF requirement not\
            \ met"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: Resource not accessible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Stale revision or duplicate model
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: "Provider, encryption key or client capacity unavailable"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required
        "200":
          description: Successful result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Default"
      security:
      - bearerAuth: []
      - browserSession: []
  /api/users/{actorId}/groups:
    post:
      tags:
      - Users
      summary: Replace a user's ordinary Group memberships
      operationId: replaceUserGroups
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: actorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceUserGroupsRequest"
        required: true
      responses:
        "204":
          description: The user's ordinary Group memberships were replaced
        "401":
          description: No accepted authentication is present
        "403":
          description: The actor lacks IAM_ADMIN authority or the same-origin header
            is missing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: The user or a requested Group does not exist in the current
            Tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/users/{actorId}/deactivate:
    post:
      tags:
      - Users
      summary: Deactivate an existing Tenant member
      operationId: deactivateUser
      parameters:
      - name: X-MemoryOS-CSRF
        in: header
        description: Same-origin non-simple request guard for browser-session mutations.
        required: true
        schema:
          type: string
          enum:
          - "1"
      - name: actorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The member is inactive
        "401":
          description: No accepted authentication is present
        "403":
          description: "The actor lacks USERS_MANAGE authority, the target is protected,\
            \ or the same-origin header is missing"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: The member does not exist in the current Tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - browserSession: []
      - bearerAuth: []
  /api/users/{actorId}/activate:
