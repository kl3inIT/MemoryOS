worker_processes 1;
worker_shutdown_timeout 130s;
pid /tmp/nginx.pid;
# NGINX errors can echo arbitrary request lines/headers; status diagnostics use
# the allowlisted access format instead. Never enable debug or dump auth config.
error_log /dev/stderr crit;

events {
    worker_connections 128;
    multi_accept off;
}

http {
    map_hash_bucket_size 128;
    include /tmp/inference-auth.conf;
    default_type application/json;
    server_tokens off;

    # No address, raw path/query, headers, body, upstream payload or credentials.
    map $uri $memoryos_route {
        default rejected;
        /v1/models models;
        /v1/chat/completions generation;
        /ready readiness;
    }
    log_format gateway escape=json
        '{"event":"inference_gateway","route":"$memoryos_route",'
        '"status":$status,"bytes":$body_bytes_sent,"seconds":$request_time,'
        '"upstream_seconds":"$upstream_response_time","admission":"$limit_conn_status"}';
    access_log /dev/stdout gateway;

    map $memoryos_inference_authorized $memoryos_auth_challenge {
        0 'Bearer realm="memoryos-inference"';
        1 '';
    }
    # A constant across all clients/workers: this is occupancy, not a rate limit.
    limit_conn_zone "memoryos-generation" zone=generation:32k;
    limit_conn_status 429;
    limit_conn_log_level notice;

    resolver 127.0.0.11 ipv6=off valid=5s;
    resolver_timeout 5s;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 4k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    keepalive_timeout 5s;
    keepalive_requests 100;
    send_timeout 30s;
    reset_timedout_connection on;

    proxy_http_version 1.1;
    proxy_set_header Host vllm:8000;
    proxy_set_header Connection "";
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 120s;
    proxy_next_upstream off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    gzip off;

    server {
        listen 8080 backlog=64;
        server_name _;
        add_header WWW-Authenticate $memoryos_auth_challenge always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;

        location = /v1/models {
            if ($memoryos_inference_authorized = 0) { return 401; }
            if ($request_method != GET) { return 405; }
            # Do not let normalized/encoded paths or queries widen the exact API.
            if ($request_uri != /v1/models) { return 404; }
            set $vllm_upstream http://vllm:8000;
            proxy_pass $vllm_upstream/v1/models;
        }

        location = /v1/chat/completions {
            if ($memoryos_inference_authorized = 0) { return 401; }
            if ($request_method != POST) { return 405; }
            if ($request_uri != /v1/chat/completions) { return 404; }
            # Rewrite-phase admission affects only new requests; existing SSE drains.
            if (-e /var/lib/memoryos-inference/control/maintenance) { return 503; }
            limit_conn generation 1;
            set $vllm_upstream http://vllm:8000;
            proxy_pass $vllm_upstream/v1/chat/completions;
        }

        location / { return 404; }
    }

    # Container-local health only; no secret in healthcheck argv or metadata.
    # This exercises authenticated public model listing, independently of admission.
    # The operator probe additionally verifies exact manifest model identity.
    server {
        listen 127.0.0.1:8081;
        server_name localhost;
        access_log off;
        location = /ready {
            if ($request_method != GET) { return 405; }
            proxy_set_header Host localhost;
            proxy_set_header Connection "";
            proxy_set_header Authorization $memoryos_inference_probe_authorization;
            proxy_pass http://127.0.0.1:8080/v1/models;
            proxy_read_timeout 3s;
        }
        location / { return 404; }
    }
}
