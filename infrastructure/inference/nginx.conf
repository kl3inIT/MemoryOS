worker_processes 1;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    map_hash_bucket_size 128;

    include /etc/nginx/mime.types;
    include /tmp/inference-auth.conf;
    default_type application/octet-stream;
    server_tokens off;

    log_format gateway
        '$remote_addr request_id=$request_id '
        '"$request_method $uri $server_protocol" '
        'status=$status bytes=$body_bytes_sent '
        'request_time=$request_time '
        'upstream_time=$upstream_response_time';

    access_log /dev/stdout gateway;

    map $memoryos_inference_authorized $memoryos_auth_challenge {
        0 'Bearer realm="memoryos-inference"';
        1 '';
    }

    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 8080;
        server_name _;

        client_max_body_size 16k;

        location ~ ^/v1/(models|chat/completions)$ {
            add_header WWW-Authenticate $memoryos_auth_challenge always;

            if ($memoryos_inference_authorized = 0) {
                return 401;
            }

            set $vllm_upstream http://vllm:8000;
            proxy_pass $vllm_upstream$request_uri;

            proxy_http_version 1.1;
            proxy_set_header Host vllm:8000;
            proxy_set_header Connection "";
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 120s;
            proxy_next_upstream off;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            gzip off;
        }

        location / {
            return 404;
        }
    }
}
