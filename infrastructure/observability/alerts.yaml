groups:
  - name: memoryos-staging
    rules:
      - alert: MemoryOSIngestionPending
        expr: memoryos_redis_stream_pending > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Redis deliveries have remained pending for ten minutes
      - alert: MemoryOSTelemetryMissing
        expr: absent_over_time(jvm_memory_used_bytes{service_name="memoryos-api"}[5m])
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: API telemetry is missing; inspect app and collector health
      - alert: MemoryOSWorkerTelemetryMissing
        expr: absent_over_time(jvm_memory_used_bytes{service_name="memoryos-worker"}[5m])
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Worker telemetry is missing; inspect worker and collector health
      - alert: MemoryOSHttpErrors
        expr: sum(rate(http_server_requests_milliseconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_milliseconds_count[5m])), 0.01) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: API server errors exceed five percent of requests
      - alert: MemoryOSDatabasePoolWaiting
        expr: hikaricp_connections_pending > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Application requests are waiting for a database connection
