name: memoryos-observability
x-defaults: &defaults
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
services:
  collector:
    <<: *defaults
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
    read_only: true
    networks:
      telemetry:
        aliases: [memoryos-otel-collector]
      backend:
  loki:
    <<: *defaults
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command: [-config.file=/etc/loki/config.yaml]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki:/loki
    networks: [backend]
  tempo:
    <<: *defaults
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    command:
      - -target=all
      - -config.file=/etc/tempo/config.yaml
      - -backend-scheduler.provider.work.compaction.block-retention=168h
    user: "10001:10001"
    volumes:
      - ./tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo:/var/tempo
    networks: [backend]
  prometheus:
    <<: *defaults
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=4GB
      - --web.enable-otlp-receiver
      # Tempo's metrics-generator writes span metrics here; the receiver is on the private backend network only.
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus:/prometheus
    networks: [backend]
  grafana:
    <<: *defaults
    user: "472:472"
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      GF_SERVER_ROOT_URL: ${MEMORYOS_GRAFANA_PUBLIC_URL:?Set MEMORYOS_GRAFANA_PUBLIC_URL}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC: "false"
      GF_AUTH_GENERIC_OAUTH_VALIDATE_ID_TOKEN: "true"
      GF_AUTH_GENERIC_OAUTH_JWK_SET_URL: ${MEMORYOS_GRAFANA_ISSUER}/protocol/openid-connect/certs
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: memoryos-grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE: /run/secrets/grafana_oidc_secret
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${MEMORYOS_GRAFANA_ISSUER:?Set MEMORYOS_GRAFANA_ISSUER}/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${MEMORYOS_GRAFANA_ISSUER}/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: ${MEMORYOS_GRAFANA_ISSUER}/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(realm_access.roles[*], 'memoryos-inspector') && 'Admin'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    secrets: [grafana_admin_password, grafana_oidc_secret]
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:3000/api/health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      backend:
      proxy:
        aliases: [memoryos-grafana]
networks:
  telemetry:
    name: ${MEMORYOS_TELEMETRY_NETWORK:-memoryos-telemetry}
    internal: true
  backend:
    internal: true
  proxy:
    name: ${MEMORYOS_PROXY_NETWORK:-proxy-network}
    external: true
volumes:
  grafana:
  loki:
  tempo:
  prometheus:
secrets:
  grafana_admin_password:
    file: ${MEMORYOS_GRAFANA_ADMIN_PASSWORD_FILE:?Set MEMORYOS_GRAFANA_ADMIN_PASSWORD_FILE}
  grafana_oidc_secret:
    file: ${MEMORYOS_GRAFANA_OIDC_SECRET_FILE:?Set MEMORYOS_GRAFANA_OIDC_SECRET_FILE}
