_meta:
  type: roles
  config_version: 2
memoryos_search:
  cluster_permissions:
    - cluster:monitor/health
    - cluster:monitor/main
    - cluster:admin/search/pipeline/*
    - indices:data/write/bulk
  index_permissions:
    - index_patterns:
        - memoryos-chunks*
      allowed_actions:
        - indices:*
memoryos_search_inspector:
  # Full read-only view for the owner in Dashboards, including Index Management and plugin read APIs; no writes.
  cluster_permissions:
    - cluster_composite_ops_ro
    - cluster_monitor
    - cluster:admin/opendistro/*/get*
    - cluster:admin/opendistro/*/search*
    - cluster:admin/opendistro/*/explain*
    - cluster:admin/opensearch/*/get*
    - cluster:admin/opensearch/*/search*
    - cluster:admin/opensearch/*/list*
  index_permissions:
    - index_patterns:
        - "*"
      allowed_actions:
        - read
        - indices_monitor
        - indices:admin/get
        - indices:admin/mappings/get
        - indices:admin/aliases/get
        - indices:admin/resolve/index
        - indices:admin/opendistro/ism/managedindex/explain
  tenant_permissions:
    - tenant_patterns:
        - global_tenant
      allowed_actions:
        - kibana_all_read
