_meta:
  type: roles
  config_version: 2
memoryos_search:
  cluster_permissions:
    - cluster:monitor/health
    - cluster:monitor/main
    - cluster:admin/search/pipeline/*
  index_permissions:
    - index_patterns:
        - memoryos-chunks*
      allowed_actions:
        - indices:*
memoryos_search_inspector:
  cluster_permissions:
    - cluster_composite_ops_ro
    - cluster_monitor
  index_permissions:
    - index_patterns:
        - memoryos-chunks*
      allowed_actions:
        - read
        - indices_monitor
  tenant_permissions:
    - tenant_patterns:
        - global_tenant
      allowed_actions:
        - kibana_all_read
