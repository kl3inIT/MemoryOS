_meta:
  type: rolesmapping
  config_version: 2
memoryos_search:
  users:
    - memoryos-service
kibana_server:
  users:
    - memoryos-dashboards
memoryos_search_inspector:
  backend_roles:
    - memoryos-inspector
# Built-in read-only roles give the owner a full read view of every Dashboards plugin without write access.
readall_and_monitor:
  backend_roles: [memoryos-inspector]
alerting_read_access:
  backend_roles: [memoryos-inspector]
anomaly_read_access:
  backend_roles: [memoryos-inspector]
asynchronous_search_read_access:
  backend_roles: [memoryos-inspector]
flow_framework_read_access:
  backend_roles: [memoryos-inspector]
forecast_read_access:
  backend_roles: [memoryos-inspector]
ip2geo_datasource_read_access:
  backend_roles: [memoryos-inspector]
knn_read_access:
  backend_roles: [memoryos-inspector]
ltr_read_access:
  backend_roles: [memoryos-inspector]
ml_read_access:
  backend_roles: [memoryos-inspector]
notebooks_read_access:
  backend_roles: [memoryos-inspector]
notifications_read_access:
  backend_roles: [memoryos-inspector]
observability_read_access:
  backend_roles: [memoryos-inspector]
reports_instances_read_access:
  backend_roles: [memoryos-inspector]
reports_read_access:
  backend_roles: [memoryos-inspector]
search_relevance_read_access:
