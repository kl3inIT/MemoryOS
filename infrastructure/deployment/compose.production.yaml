name: memoryos

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  mailpit:
    <<: *service-defaults
    image: ${MEMORYOS_MAILPIT_IMAGE:?Set MEMORYOS_MAILPIT_IMAGE}
    container_name: memoryos-mailpit
    user: "${MEMORYOS_MAILPIT_UID:-1000}:${MEMORYOS_MAILPIT_GID:-1000}"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_LABEL: MemoryOS staging
      MP_MAX_MESSAGES: ${MEMORYOS_MAILPIT_MAX_MESSAGES:-500}
      MP_MAX_AGE: ${MEMORYOS_MAILPIT_MAX_AGE:-7d}
      MP_SMTP_AUTH_FILE: /run/secrets/mailpit_smtp_auth
      MP_SMTP_TLS_CERT: /run/secrets/mailpit_smtp_tls_certificate
      MP_SMTP_TLS_KEY: /run/secrets/mailpit_smtp_tls_private_key
      MP_SMTP_REQUIRE_STARTTLS: "1"
    secrets:
      - mailpit_smtp_auth
      - mailpit_smtp_tls_certificate
      - mailpit_smtp_tls_private_key
    ports:
      - 127.0.0.1:${MEMORYOS_MAILPIT_UI_HOST_PORT:-18025}:8025
    networks:
      memoryos-internal:
        aliases:
          - mailpit
          - memoryos-mailpit
      mailpit-access:
    volumes:
      - ${MEMORYOS_MAILPIT_DATA_DIRECTORY:-/apps/memoryos/mailpit}:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
        reservations:
          memory: 32m

  mailpit-oauth2-proxy:
    <<: *service-defaults
    image: ${MEMORYOS_OAUTH2_PROXY_IMAGE:?Set MEMORYOS_OAUTH2_PROXY_IMAGE}
    container_name: memoryos-mailpit-oauth2-proxy
    user: "${MEMORYOS_MAILPIT_UID:-1000}:${MEMORYOS_MAILPIT_GID:-1000}"
    command:
      - --http-address=0.0.0.0:4180
      - --provider=keycloak-oidc
      - --oidc-issuer-url=${MEMORYOS_KEYCLOAK_HOSTNAME:-https://auth.kl3in.tech}/realms/memoryos
      - --client-id=memoryos-mailpit
      - --client-secret-file=/run/secrets/mailpit_oauth2_client_secret
      - --redirect-url=${MEMORYOS_MAILPIT_PUBLIC_URL:?Set MEMORYOS_MAILPIT_PUBLIC_URL}/oauth2/callback
      - --upstream=http://mailpit:8025/
      - --authenticated-emails-file=/run/secrets/mailpit_oauth2_allowed_emails
      - --scope=openid profile email
      - --code-challenge-method=S256
      - --cookie-secret-file=/run/secrets/mailpit_oauth2_cookie_secret
      - --cookie-name=_memoryos_mailpit
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-expire=1h
      - --session-cookie-minimal=true
      - --reverse-proxy=true
      - --trusted-proxy-ip=${MEMORYOS_PROXY_TRUSTED_CIDR:-172.21.0.0/16}
      - --skip-provider-button=true
      - --pass-basic-auth=false
      - --pass-user-headers=false
      - --proxy-websockets=true
      - --silence-ping-logging=true
    secrets:
      - mailpit_oauth2_allowed_emails
      - mailpit_oauth2_client_secret
      - mailpit_oauth2_cookie_secret
    depends_on:
      mailpit:
        condition: service_healthy
    networks:
      mailpit-access:
        aliases:
          - memoryos-mailpit-oauth2-proxy
      proxy:
        aliases:
          - memoryos-mailpit-oauth2-proxy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96m
        reservations:
          memory: 32m


  postgres:
    image: ${MEMORYOS_POSTGRES_IMAGE:-postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382}
    container_name: memoryos-postgres
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${MEMORYOS_POSTGRES_ADMIN_USER:-memoryos_platform}
      POSTGRES_PASSWORD: ${MEMORYOS_POSTGRES_ADMIN_PASSWORD:?Set MEMORYOS_POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      PGHOST: /var/run/postgresql
      PGUSER: ${MEMORYOS_POSTGRES_ADMIN_USER:-memoryos_platform}
      PGPASSWORD: ${MEMORYOS_POSTGRES_ADMIN_PASSWORD:?Set MEMORYOS_POSTGRES_ADMIN_PASSWORD}
      MEMORYOS_DATABASE_NAME: ${MEMORYOS_DATABASE_NAME:-memoryos}
      MEMORYOS_DATABASE_USERNAME: ${MEMORYOS_DATABASE_USERNAME:-memoryos_app}
      MEMORYOS_DATABASE_PASSWORD: ${MEMORYOS_DATABASE_PASSWORD:?Set MEMORYOS_DATABASE_PASSWORD}
      MEMORYOS_KEYCLOAK_DATABASE_NAME: ${MEMORYOS_KEYCLOAK_DATABASE_NAME:-keycloak}
      MEMORYOS_KEYCLOAK_DATABASE_USERNAME: ${MEMORYOS_KEYCLOAK_DATABASE_USERNAME:-keycloak}
      MEMORYOS_KEYCLOAK_DATABASE_PASSWORD: ${MEMORYOS_KEYCLOAK_DATABASE_PASSWORD:?Set MEMORYOS_KEYCLOAK_DATABASE_PASSWORD}
    ports:
      - 127.0.0.1:${MEMORYOS_POSTGRES_HOST_PORT:-5556}:5432
    networks:
      memoryos-internal:
        aliases:
          - postgres
          - memoryos-postgres
    volumes:
      - memoryos_postgres:/var/lib/postgresql
      - ../postgres/bootstrap-shared-databases.sh:/docker-entrypoint-initdb.d/10-bootstrap-shared-databases.sh:ro
      - ../postgres/bootstrap-database.sql:/bootstrap/bootstrap-database.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    stop_grace_period: 60s
    shm_size: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768m
        reservations:
          memory: 256m


  postgres-backup:
    image: ${MEMORYOS_POSTGRES_IMAGE:-postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382}
    profiles:
      - ops
    user: "${MEMORYOS_BACKUP_UID:-1000}:${MEMORYOS_BACKUP_GID:-1000}"
    entrypoint:
      - /bin/sh
      - /backup-tools/backup-databases.sh
    environment:
      PGHOST: postgres
      PGUSER: ${MEMORYOS_POSTGRES_ADMIN_USER:-memoryos_platform}
      PGPASSWORD: ${MEMORYOS_POSTGRES_ADMIN_PASSWORD:?Set MEMORYOS_POSTGRES_ADMIN_PASSWORD}
      BACKUP_DATABASES: ${MEMORYOS_BACKUP_DATABASES:-memoryos keycloak}
      BACKUP_DIRECTORY: /backup
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - memoryos-internal
    volumes:
      - ../postgres/backup-databases.sh:/backup-tools/backup-databases.sh:ro
      - ${MEMORYOS_BACKUP_DIRECTORY:-/apps/memoryos/backups}:/backup
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  shared-keycloak:
    <<: *service-defaults
    image: ${MEMORYOS_SHARED_KEYCLOAK_IMAGE:?Set MEMORYOS_SHARED_KEYCLOAK_IMAGE}
    container_name: memoryos-shared-keycloak
    command:
      - start
      - --optimized
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://memoryos-postgres:5432/${MEMORYOS_KEYCLOAK_DATABASE_NAME:-keycloak}
      KC_DB_USERNAME: ${MEMORYOS_KEYCLOAK_DATABASE_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${MEMORYOS_KEYCLOAK_DATABASE_PASSWORD:?Set MEMORYOS_KEYCLOAK_DATABASE_PASSWORD}
      KC_DB_POOL_INITIAL_SIZE: "2"
      KC_DB_POOL_MIN_SIZE: "2"
      KC_DB_POOL_MAX_SIZE: "10"
      KC_HOSTNAME: ${MEMORYOS_KEYCLOAK_HOSTNAME:-https://auth.kl3in.tech}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_PROXY_HEADERS: xforwarded
      KC_LOG_LEVEL: ${MEMORYOS_KEYCLOAK_LOG_LEVEL:-INFO}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${MEMORYOS_KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?Set MEMORYOS_KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${MEMORYOS_KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?Set MEMORYOS_KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      JAVA_OPTS_KC_HEAP: -XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=65
      KC_TRUSTSTORE_PATHS: /run/secrets/mailpit_smtp_ca
    secrets:
      - mailpit_smtp_ca
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 127.0.0.1:${MEMORYOS_KEYCLOAK_HOST_PORT:-18180}:8080
    networks:
      memoryos-internal:
        aliases:
          - keycloak
          - shared-keycloak
      shared-infra:
        aliases:
          - keycloak
          - orgmemory-keycloak
          - memoryos-keycloak
      proxy:
        aliases:
          - keycloak
          - orgmemory-keycloak
          - memoryos-keycloak
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          { printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep -q '"status" *: *"UP"'; } 0<>/dev/tcp/127.0.0.1/9000
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /opt/keycloak/data:size=128m,uid=1000,gid=0,mode=1770
    stop_grace_period: 45s
    cpu_shares: 256
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512m
        reservations:
          memory: 256m

  api:
    <<: *service-defaults
    image: ${MEMORYOS_API_IMAGE:?Set MEMORYOS_API_IMAGE}
    container_name: memoryos-api
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    secrets:
      - source: memoryos_infisical_bootstrap
        target: memoryos_infisical_bootstrap
    depends_on:
      postgres:
        condition: service_healthy
      shared-keycloak:
        condition: service_healthy
    ports:
      - 127.0.0.1:${MEMORYOS_API_HOST_PORT:-18080}:8080
    networks:
      memoryos-internal:
        aliases:
          - memoryos-api
      shared-infra:
        aliases:
          - memoryos-api
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://127.0.0.1:8080/actuator/health
          | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    stop_grace_period: 45s
    cpu_shares: 512
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768m
        reservations:
          memory: 384m


  worker:
    <<: *service-defaults
    image: ${MEMORYOS_WORKER_IMAGE:?Set MEMORYOS_WORKER_IMAGE}
    container_name: memoryos-worker
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    secrets:
      - source: memoryos_infisical_bootstrap
        target: memoryos_infisical_bootstrap
    environment:
      SPRING_PROFILES_ACTIVE: ${MEMORYOS_WORKER_PROFILE:-production}
    depends_on:
      api:
        condition: service_healthy
    networks:
      memoryos-internal:
        aliases:
          - memoryos-worker
      shared-infra:
        aliases:
          - memoryos-worker
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://127.0.0.1:8081/actuator/health/readiness
          | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    stop_grace_period: 120s
    cpu_shares: 512
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024m
        reservations:
          memory: 512m

  web:
    <<: *service-defaults
    image: ${MEMORYOS_WEB_IMAGE:?Set MEMORYOS_WEB_IMAGE}
    container_name: memoryos-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:${MEMORYOS_WEB_HOST_PORT:-18081}:8080
    networks:
      memoryos-internal:
        aliases:
          - memoryos-web
      proxy:
        aliases:
          - memoryos-web
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://127.0.0.1:8080/actuator/health
          | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    stop_grace_period: 15s
    cpu_shares: 128
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128m
        reservations:
          memory: 32m

networks:
  memoryos-internal:
    name: ${MEMORYOS_INTERNAL_NETWORK:-memoryos-internal}
    internal: true
  mailpit-access:
    name: ${MEMORYOS_MAILPIT_ACCESS_NETWORK:-memoryos-mailpit-access}
  shared-infra:
    name: ${MEMORYOS_SHARED_INFRA_NETWORK:-shared-infra}
    external: true
  proxy:
    name: ${MEMORYOS_PROXY_NETWORK:-proxy-network}
    external: true

secrets:
  memoryos_infisical_bootstrap:
    file: ${MEMORYOS_INFISICAL_BOOTSTRAP_FILE:?Set MEMORYOS_INFISICAL_BOOTSTRAP_FILE}
  mailpit_oauth2_allowed_emails:
    file: ${MEMORYOS_MAILPIT_OAUTH2_ALLOWED_EMAILS_FILE:?Set MEMORYOS_MAILPIT_OAUTH2_ALLOWED_EMAILS_FILE}
  mailpit_oauth2_client_secret:
    file: ${MEMORYOS_MAILPIT_OAUTH2_CLIENT_SECRET_FILE:?Set MEMORYOS_MAILPIT_OAUTH2_CLIENT_SECRET_FILE}
  mailpit_oauth2_cookie_secret:
    file: ${MEMORYOS_MAILPIT_OAUTH2_COOKIE_SECRET_FILE:?Set MEMORYOS_MAILPIT_OAUTH2_COOKIE_SECRET_FILE}
  mailpit_smtp_auth:
    file: ${MEMORYOS_MAILPIT_SMTP_AUTH_FILE:?Set MEMORYOS_MAILPIT_SMTP_AUTH_FILE}
  mailpit_smtp_ca:
    file: ${MEMORYOS_MAILPIT_SMTP_CA_FILE:?Set MEMORYOS_MAILPIT_SMTP_CA_FILE}
  mailpit_smtp_tls_certificate:
    file: ${MEMORYOS_MAILPIT_SMTP_TLS_CERTIFICATE_FILE:?Set MEMORYOS_MAILPIT_SMTP_TLS_CERTIFICATE_FILE}
  mailpit_smtp_tls_private_key:
    file: ${MEMORYOS_MAILPIT_SMTP_TLS_PRIVATE_KEY_FILE:?Set MEMORYOS_MAILPIT_SMTP_TLS_PRIVATE_KEY_FILE}

volumes:
  memoryos_postgres:
    name: ${MEMORYOS_POSTGRES_VOLUME:-memoryos-postgres-data}
