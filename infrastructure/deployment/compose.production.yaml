name: memoryos

services:
  web:
    environment:
      MEMORYOS_SENTRY_DSN: ${MEMORYOS_SENTRY_DSN:-}
      MEMORYOS_SENTRY_CONNECT_SRC: ${MEMORYOS_SENTRY_CONNECT_SRC:-}
      MEMORYOS_SENTRY_ENVIRONMENT: ${MEMORYOS_SENTRY_ENVIRONMENT:-production}
      MEMORYOS_SENTRY_REPLAY_ENABLED: ${MEMORYOS_SENTRY_REPLAY_ENABLED:-true}
      MEMORYOS_RELEASE: ${MEMORYOS_RELEASE:?Set MEMORYOS_RELEASE}

  api:
    environment:
      SPRING_PROFILES_ACTIVE: production

  worker:
    environment:
      SPRING_PROFILES_ACTIVE: production
