name: memoryos

services:
  api:
    networks:
      memoryos-internal:
      memoryos-telemetry:
      # Both other networks are internal: no route off the host and no public DNS. The api has to
      # reach its identity provider by the issuer's public name to fetch its discovery document and
      # keys, and the model provider for chat. Staging gets this from the network it shares with other
      # services on its host; production shares nothing, so it has one of its own for these two alone.
      egress:
    environment:
      SPRING_PROFILES_ACTIVE: production
      MEMORYOS_ENVIRONMENT: production
      # Traces, logs and metrics leave through the collector of this node's own observability
      # stack. The application states no default for this, so without the line it stops while
      # defining beans, long before anything explains why. Production keeps its telemetry on its
      # own machine: sending it to the staging collector would put customer request paths on a
      # host that is shared with unrelated services.
      MEMORYOS_OTLP_BASE_URL: ${MEMORYOS_OTLP_BASE_URL:-http://memoryos-otel-collector:4318}

  worker:
    networks:
      memoryos-internal:
      memoryos-telemetry:
      # The embedding provider is outside the host, and so is every Source the worker reads.
      egress:
    environment:
      SPRING_PROFILES_ACTIVE: production
      MEMORYOS_ENVIRONMENT: production
      MEMORYOS_OTLP_BASE_URL: ${MEMORYOS_OTLP_BASE_URL:-http://memoryos-otel-collector:4318}

networks:
  memoryos-telemetry:
    name: ${MEMORYOS_TELEMETRY_NETWORK:-memoryos-telemetry}
    external: true
  # Owned by this composition and created with it. Only the two services that must call out join
  # it; the stores and the sandbox server stay on internal networks alone.
  egress:
    name: ${MEMORYOS_EGRESS_NETWORK:-memoryos-egress}
