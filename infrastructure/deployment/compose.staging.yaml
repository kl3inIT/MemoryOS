name: memoryos

x-staging-service-defaults: &staging-service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    networks:
      postgres-inspection:
        aliases:
          - memoryos-postgres

  minio:
    environment:
      MINIO_SERVER_URL: http://127.0.0.1:9000
      MINIO_BROWSER_REDIRECT_URL: ${MEMORYOS_MINIO_CONSOLE_PUBLIC_URL:?Set MEMORYOS_MINIO_CONSOLE_PUBLIC_URL}
      MINIO_IDENTITY_OPENID_CONFIG_URL: ${MEMORYOS_KEYCLOAK_HOSTNAME:-https://auth.kl3in.tech}/realms/memoryos/.well-known/openid-configuration
      MINIO_IDENTITY_OPENID_CLIENT_ID: memoryos-minio-console
      MEMORYOS_MINIO_CONSOLE_OIDC_CLIENT_SECRET_FILE: /run/secrets/minio_console_oidc_client_secret
      MINIO_IDENTITY_OPENID_CLAIM_NAME: policy
      MINIO_IDENTITY_OPENID_SCOPES: profile,email
      MINIO_IDENTITY_OPENID_DISPLAY_NAME: MemoryOS SSO
    secrets:
      - minio_console_oidc_client_secret
    depends_on:
      shared-keycloak:
        condition: service_healthy

  shared-keycloak:
    environment:
      KC_TRUSTSTORE_PATHS: /run/secrets/mailpit_smtp_ca
    secrets:
      - mailpit_smtp_ca

  api:
    environment:
      SPRING_PROFILES_ACTIVE: staging
      MEMORYOS_TENANT_ID: ${MEMORYOS_TENANT_ID:?Set MEMORYOS_TENANT_ID}
      MEMORYOS_TENANT_SLUG: ${MEMORYOS_TENANT_SLUG:?Set MEMORYOS_TENANT_SLUG}
      MEMORYOS_TENANT_DISPLAY_NAME: ${MEMORYOS_TENANT_DISPLAY_NAME:?Set MEMORYOS_TENANT_DISPLAY_NAME}
      MEMORYOS_INITIAL_TENANT_CHANGE_REFERENCE: ${MEMORYOS_INITIAL_TENANT_CHANGE_REFERENCE:?Set MEMORYOS_INITIAL_TENANT_CHANGE_REFERENCE}
    depends_on:
      postgres-inspector-bootstrap:
        condition: service_completed_successfully

  worker:
    environment:
      SPRING_PROFILES_ACTIVE: production,staging
      MEMORYOS_REDIS_HOST: redis
      MEMORYOS_REDIS_PORT: "6379"
      MEMORYOS_REDIS_USERNAME: memoryos-worker
      MEMORYOS_REDIS_SSL_ENABLED: "true"
      MEMORYOS_REDIS_TLS_CA_FILE: /run/secrets/redis_tls_ca
      MEMORYOS_REDIS_PASSWORD_FILE: /run/secrets/redis_worker_password
      MEMORYOS_REDIS_CONNECT_TIMEOUT: ${MEMORYOS_REDIS_CONNECT_TIMEOUT:-2s}
      MEMORYOS_REDIS_COMMAND_TIMEOUT: ${MEMORYOS_REDIS_COMMAND_TIMEOUT:-2s}
      MEMORYOS_REDIS_POOL_MAX_ACTIVE: ${MEMORYOS_REDIS_POOL_MAX_ACTIVE:-8}
      MEMORYOS_REDIS_POOL_MAX_IDLE: ${MEMORYOS_REDIS_POOL_MAX_IDLE:-8}
      MEMORYOS_REDIS_POOL_MIN_IDLE: ${MEMORYOS_REDIS_POOL_MIN_IDLE:-0}
      MEMORYOS_REDIS_POOL_MAX_WAIT: ${MEMORYOS_REDIS_POOL_MAX_WAIT:-2s}
      MEMORYOS_SCHEDULER_NAME: ${MEMORYOS_SCHEDULER_NAME:-memoryos-worker-staging-1}
    secrets:
      - redis_tls_ca
      - redis_worker_password
    depends_on:
      redis:
        condition: service_healthy

  mailpit:
    <<: *staging-service-defaults
    image: ${MEMORYOS_MAILPIT_IMAGE:?Set MEMORYOS_MAILPIT_IMAGE}
    container_name: memoryos-mailpit
    user: "${MEMORYOS_MAILPIT_UID:-1000}:${MEMORYOS_MAILPIT_GID:-1000}"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_LABEL: MemoryOS staging
      MP_MAX_MESSAGES: ${MEMORYOS_MAILPIT_MAX_MESSAGES:-500}
      MP_MAX_AGE: ${MEMORYOS_MAILPIT_MAX_AGE:-7d}
      MP_SMTP_AUTH_FILE: /run/secrets/mailpit_smtp_auth
      MP_SMTP_TLS_CERT: /run/secrets/mailpit_smtp_tls_certificate
      MP_SMTP_TLS_KEY: /run/secrets/mailpit_smtp_tls_private_key
      MP_SMTP_REQUIRE_STARTTLS: "1"
    secrets:
      - mailpit_smtp_auth
      - mailpit_smtp_tls_certificate
      - mailpit_smtp_tls_private_key
    ports:
      - 127.0.0.1:${MEMORYOS_MAILPIT_UI_HOST_PORT:-18025}:8025
    networks:
      memoryos-internal:
        aliases:
          - mailpit
          - memoryos-mailpit
      mailpit-access:
    volumes:
      - ${MEMORYOS_MAILPIT_DATA_DIRECTORY:-/apps/memoryos/mailpit}:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
        reservations:
          memory: 32m

  mailpit-oauth2-proxy:
    <<: *staging-service-defaults
    image: ${MEMORYOS_OAUTH2_PROXY_IMAGE:?Set MEMORYOS_OAUTH2_PROXY_IMAGE}
    container_name: memoryos-mailpit-oauth2-proxy
    user: "${MEMORYOS_MAILPIT_UID:-1000}:${MEMORYOS_MAILPIT_GID:-1000}"
    command:
      - --http-address=0.0.0.0:4180
      - --provider=keycloak-oidc
      - --oidc-issuer-url=${MEMORYOS_KEYCLOAK_HOSTNAME:-https://auth.kl3in.tech}/realms/memoryos
      - --client-id=memoryos-mailpit
      - --client-secret-file=/run/secrets/mailpit_oauth2_client_secret
      - --redirect-url=${MEMORYOS_MAILPIT_PUBLIC_URL:?Set MEMORYOS_MAILPIT_PUBLIC_URL}/oauth2/callback
      - --upstream=http://mailpit:8025/
      - --authenticated-emails-file=/run/secrets/mailpit_oauth2_allowed_emails
      - --scope=openid profile email
      - --code-challenge-method=S256
      - --cookie-secret-file=/run/secrets/mailpit_oauth2_cookie_secret
      - --cookie-name=_memoryos_mailpit
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-expire=1h
      - --session-cookie-minimal=true
      - --reverse-proxy=true
      - --trusted-proxy-ip=${MEMORYOS_PROXY_TRUSTED_CIDR:-172.21.0.0/16}
      - --skip-provider-button=true
      - --pass-basic-auth=false
      - --pass-user-headers=false
      - --proxy-websockets=true
      - --silence-ping-logging=true
    secrets:
      - mailpit_oauth2_allowed_emails
      - mailpit_oauth2_client_secret
      - mailpit_oauth2_cookie_secret
    depends_on:
      mailpit:
        condition: service_healthy
    networks:
      mailpit-access:
        aliases:
          - memoryos-mailpit-oauth2-proxy
      proxy:
        aliases:
          - memoryos-mailpit-oauth2-proxy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96m
        reservations:
          memory: 32m

  redis:
    <<: *staging-service-defaults
    image: ${MEMORYOS_REDIS_IMAGE:-redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232}
    container_name: memoryos-redis
    user: "0:0"
    entrypoint:
      - /bin/sh
      - /redis-tools/start-staging-redis.sh
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - SETGID
      - SETUID
    secrets:
      - redis_admin_password
      - redis_inspector_password
      - redis_worker_password
      - redis_tls_ca
      - redis_tls_certificate
      - redis_tls_private_key
    networks:
      memoryos-internal:
        aliases:
          - redis
          - memoryos-redis
      redis-inspection:
        aliases:
          - redis
    volumes:
      - memoryos_redis:/data
      - ../redis/start-staging-redis.sh:/redis-tools/start-staging-redis.sh:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$(cat /run/secrets/redis_admin_password)"
          redis-cli --tls --cacert /run/secrets/redis_tls_ca
          --user memoryos-admin -h 127.0.0.1 ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384m
        reservations:
          memory: 128m

  postgres-inspector-bootstrap:
    image: ${MEMORYOS_POSTGRES_IMAGE:-postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382}
    container_name: memoryos-postgres-inspector-bootstrap
    entrypoint:
      - /bin/sh
      - /inspection-tools/provision-inspector-role.sh
    environment:
      PGHOST: postgres
      PGUSER: ${MEMORYOS_POSTGRES_ADMIN_USER:-memoryos_platform}
      PGPASSWORD: ${MEMORYOS_POSTGRES_ADMIN_PASSWORD:?Set MEMORYOS_POSTGRES_ADMIN_PASSWORD}
      MEMORYOS_DATABASE_NAME: ${MEMORYOS_DATABASE_NAME:-memoryos}
      MEMORYOS_DATABASE_USERNAME: ${MEMORYOS_DATABASE_USERNAME:-memoryos_app}
      MEMORYOS_PGWEB_USERNAME: ${MEMORYOS_PGWEB_USERNAME:-memoryos_pgweb}
      MEMORYOS_PGWEB_UID: ${MEMORYOS_PGWEB_UID:-1000}
      MEMORYOS_PGWEB_GID: ${MEMORYOS_PGWEB_GID:-1000}
    secrets:
      - pgweb_database_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres-inspection
    volumes:
      - ../postgres/provision-inspector-role.sh:/inspection-tools/provision-inspector-role.sh:ro
      - pgweb_credentials:/pgpass
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN

  pgweb:
    <<: *staging-service-defaults
    image: ${MEMORYOS_PGWEB_IMAGE:-sosedoff/pgweb:0.17.0@sha256:a5256d416e2e8b92d69a4459058e3eca33a9f075d8325491644411d0bc3bd70b}
    container_name: memoryos-pgweb
    user: "${MEMORYOS_PGWEB_UID:-1000}:${MEMORYOS_PGWEB_GID:-1000}"
    command:
      - --host=postgres
      - --port=5432
      - --user=${MEMORYOS_PGWEB_USERNAME:-memoryos_pgweb}
      - --db=${MEMORYOS_DATABASE_NAME:-memoryos}
      - --passfile=/pgpass/.pgpass
      - --ssl=disable
      - --readonly
      - --lock-session
      - --no-ssh
      - --query-timeout=${MEMORYOS_PGWEB_QUERY_TIMEOUT_SECONDS:-30}
      - --skip-open
    depends_on:
      postgres-inspector-bootstrap:
        condition: service_completed_successfully
    networks:
      postgres-inspection:
        aliases:
          - pgweb
      pgweb-access:
        aliases:
          - pgweb
    volumes:
      - pgweb_credentials:/pgpass:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test:
        - CMD
        - /usr/bin/curl
        - --fail
        - --silent
        - http://127.0.0.1:8081/
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
        reservations:
          memory: 32m

  pgweb-oauth2-proxy:
    <<: *staging-service-defaults
    image: ${MEMORYOS_OAUTH2_PROXY_IMAGE:?Set MEMORYOS_OAUTH2_PROXY_IMAGE}
    container_name: memoryos-pgweb-oauth2-proxy
    user: "${MEMORYOS_PGWEB_UID:-1000}:${MEMORYOS_PGWEB_GID:-1000}"
    command:
      - --http-address=0.0.0.0:4180
      - --provider=keycloak-oidc
      - --oidc-issuer-url=${MEMORYOS_KEYCLOAK_HOSTNAME:-https://auth.kl3in.tech}/realms/memoryos
      - --client-id=memoryos-pgweb
      - --client-secret-file=/run/secrets/pgweb_oauth2_client_secret
      - --redirect-url=${MEMORYOS_PGWEB_PUBLIC_URL:?Set MEMORYOS_PGWEB_PUBLIC_URL}/oauth2/callback
      - --upstream=http://pgweb:8081/
      - --allowed-role=memoryos-inspector
      - --email-domain=*
      - --scope=openid profile email
      - --code-challenge-method=S256
      - --cookie-secret-file=/run/secrets/pgweb_oauth2_cookie_secret
      - --cookie-name=_memoryos_pgweb
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-expire=1h
      - --session-cookie-minimal=true
      - --reverse-proxy=true
      - --trusted-proxy-ip=${MEMORYOS_PROXY_TRUSTED_CIDR:-172.21.0.0/16}
      - --skip-provider-button=true
      - --pass-basic-auth=false
      - --pass-user-headers=false
      - --silence-ping-logging=true
    secrets:
      - pgweb_oauth2_client_secret
      - pgweb_oauth2_cookie_secret
    depends_on:
      pgweb:
        condition: service_healthy
    ports:
      - 127.0.0.1:${MEMORYOS_PGWEB_PROXY_HOST_PORT:-18026}:4180
    networks:
      pgweb-access:
      proxy:
        aliases:
          - memoryos-pgweb-oauth2-proxy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96m
        reservations:
          memory: 32m


  redisinsight:
    <<: *staging-service-defaults
    image: ${MEMORYOS_REDISINSIGHT_IMAGE:-redis/redisinsight:3.8.0@sha256:b5e19ee240abef6edb435871b90ff8a210995422e8e018ab61c0339d318a1f84}
    container_name: memoryos-redisinsight
    user: "0:0"
    entrypoint:
      - /bin/sh
      - /redis-tools/start-redisinsight.sh
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    environment:
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_DATABASE_MANAGEMENT: "false"
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: MemoryOS staging execution
      RI_REDIS_USERNAME: memoryos-inspector
      RI_REDIS_TLS: "true"
      RI_REDIS_TLS_CA_PATH: /run/secrets/redis_tls_ca
    secrets:
      - redis_inspector_password
      - redis_tls_ca
      - redisinsight_encryption_key
    depends_on:
      redis:
        condition: service_healthy
    networks:
      redis-inspection:
        aliases:
          - redisinsight
      redisinsight-access:
        aliases:
          - redisinsight
    volumes:
      - memoryos_redisinsight:/data
      - ../redis/start-redisinsight.sh:/redis-tools/start-redisinsight.sh:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:5540/api/health/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512m
        reservations:
          memory: 128m

  redisinsight-oauth2-proxy:
    <<: *staging-service-defaults
    image: ${MEMORYOS_OAUTH2_PROXY_IMAGE:?Set MEMORYOS_OAUTH2_PROXY_IMAGE}
    container_name: memoryos-redisinsight-oauth2-proxy
    user: "${MEMORYOS_PGWEB_UID:-1000}:${MEMORYOS_PGWEB_GID:-1000}"
    command:
      - --http-address=0.0.0.0:4180
      - --provider=keycloak-oidc
      - --oidc-issuer-url=${MEMORYOS_KEYCLOAK_HOSTNAME:-https://auth.kl3in.tech}/realms/memoryos
      - --client-id=memoryos-redisinsight
      - --client-secret-file=/run/secrets/redisinsight_oauth2_client_secret
      - --redirect-url=${MEMORYOS_REDISINSIGHT_PUBLIC_URL:?Set MEMORYOS_REDISINSIGHT_PUBLIC_URL}/oauth2/callback
      - --upstream=http://redisinsight:5540/
      - --allowed-role=memoryos-inspector
      - --email-domain=*
      - --scope=openid profile email
      - --code-challenge-method=S256
      - --cookie-secret-file=/run/secrets/redisinsight_oauth2_cookie_secret
      - --cookie-name=_memoryos_redisinsight
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-expire=1h
      - --session-cookie-minimal=true
      - --reverse-proxy=true
      - --trusted-proxy-ip=${MEMORYOS_PROXY_TRUSTED_CIDR:-172.21.0.0/16}
      - --skip-provider-button=true
      - --pass-basic-auth=false
      - --pass-user-headers=false
      - --proxy-websockets=true
      - --silence-ping-logging=true
    secrets:
      - redisinsight_oauth2_client_secret
      - redisinsight_oauth2_cookie_secret
    depends_on:
      redisinsight:
        condition: service_healthy
    ports:
      - 127.0.0.1:${MEMORYOS_REDISINSIGHT_PROXY_HOST_PORT:-18027}:4180
    networks:
      redisinsight-access:
      proxy:
        aliases:
          - memoryos-redisinsight-oauth2-proxy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96m
        reservations:
          memory: 32m

networks:
  mailpit-access:
    name: ${MEMORYOS_MAILPIT_ACCESS_NETWORK:-memoryos-mailpit-access}
  postgres-inspection:
    name: ${MEMORYOS_POSTGRES_INSPECTION_NETWORK:-memoryos-postgres-inspection}
    internal: true
  pgweb-access:
    name: ${MEMORYOS_PGWEB_ACCESS_NETWORK:-memoryos-pgweb-access}
    internal: true
  redis-inspection:
    name: ${MEMORYOS_REDIS_INSPECTION_NETWORK:-memoryos-redis-inspection}
    internal: true
  redisinsight-access:
    name: ${MEMORYOS_REDISINSIGHT_ACCESS_NETWORK:-memoryos-redisinsight-access}
    internal: true

secrets:
  minio_console_oidc_client_secret:
    file: ${MEMORYOS_MINIO_CONSOLE_OIDC_CLIENT_SECRET_FILE:?Set MEMORYOS_MINIO_CONSOLE_OIDC_CLIENT_SECRET_FILE}
  mailpit_oauth2_allowed_emails:
    file: ${MEMORYOS_MAILPIT_OAUTH2_ALLOWED_EMAILS_FILE:?Set MEMORYOS_MAILPIT_OAUTH2_ALLOWED_EMAILS_FILE}
  mailpit_oauth2_client_secret:
    file: ${MEMORYOS_MAILPIT_OAUTH2_CLIENT_SECRET_FILE:?Set MEMORYOS_MAILPIT_OAUTH2_CLIENT_SECRET_FILE}
  mailpit_oauth2_cookie_secret:
    file: ${MEMORYOS_MAILPIT_OAUTH2_COOKIE_SECRET_FILE:?Set MEMORYOS_MAILPIT_OAUTH2_COOKIE_SECRET_FILE}
  mailpit_smtp_auth:
    file: ${MEMORYOS_MAILPIT_SMTP_AUTH_FILE:?Set MEMORYOS_MAILPIT_SMTP_AUTH_FILE}
  mailpit_smtp_ca:
    file: ${MEMORYOS_MAILPIT_SMTP_CA_FILE:?Set MEMORYOS_MAILPIT_SMTP_CA_FILE}
  mailpit_smtp_tls_certificate:
    file: ${MEMORYOS_MAILPIT_SMTP_TLS_CERTIFICATE_FILE:?Set MEMORYOS_MAILPIT_SMTP_TLS_CERTIFICATE_FILE}
  mailpit_smtp_tls_private_key:
    file: ${MEMORYOS_MAILPIT_SMTP_TLS_PRIVATE_KEY_FILE:?Set MEMORYOS_MAILPIT_SMTP_TLS_PRIVATE_KEY_FILE}
  pgweb_database_password:
    file: ${MEMORYOS_PGWEB_DATABASE_PASSWORD_FILE:?Set MEMORYOS_PGWEB_DATABASE_PASSWORD_FILE}
  pgweb_oauth2_client_secret:
    file: ${MEMORYOS_PGWEB_OAUTH2_CLIENT_SECRET_FILE:?Set MEMORYOS_PGWEB_OAUTH2_CLIENT_SECRET_FILE}
  pgweb_oauth2_cookie_secret:
    file: ${MEMORYOS_PGWEB_OAUTH2_COOKIE_SECRET_FILE:?Set MEMORYOS_PGWEB_OAUTH2_COOKIE_SECRET_FILE}
  redis_admin_password:
    file: ${MEMORYOS_REDIS_ADMIN_PASSWORD_FILE:?Set MEMORYOS_REDIS_ADMIN_PASSWORD_FILE}
  redis_worker_password:
    file: ${MEMORYOS_REDIS_WORKER_PASSWORD_FILE:?Set MEMORYOS_REDIS_WORKER_PASSWORD_FILE}
  redis_inspector_password:
    file: ${MEMORYOS_REDIS_INSPECTOR_PASSWORD_FILE:?Set MEMORYOS_REDIS_INSPECTOR_PASSWORD_FILE}
  redisinsight_encryption_key:
    file: ${MEMORYOS_REDISINSIGHT_ENCRYPTION_KEY_FILE:?Set MEMORYOS_REDISINSIGHT_ENCRYPTION_KEY_FILE}
  redis_tls_ca:
    file: ${MEMORYOS_REDIS_TLS_CA_FILE:?Set MEMORYOS_REDIS_TLS_CA_FILE}
  redis_tls_certificate:
    file: ${MEMORYOS_REDIS_TLS_CERTIFICATE_FILE:?Set MEMORYOS_REDIS_TLS_CERTIFICATE_FILE}
  redis_tls_private_key:
    file: ${MEMORYOS_REDIS_TLS_PRIVATE_KEY_FILE:?Set MEMORYOS_REDIS_TLS_PRIVATE_KEY_FILE}
  redisinsight_oauth2_client_secret:
    file: ${MEMORYOS_REDISINSIGHT_OAUTH2_CLIENT_SECRET_FILE:?Set MEMORYOS_REDISINSIGHT_OAUTH2_CLIENT_SECRET_FILE}
  redisinsight_oauth2_cookie_secret:
    file: ${MEMORYOS_REDISINSIGHT_OAUTH2_COOKIE_SECRET_FILE:?Set MEMORYOS_REDISINSIGHT_OAUTH2_COOKIE_SECRET_FILE}

volumes:
  memoryos_redis:
    name: ${MEMORYOS_REDIS_VOLUME:-memoryos-redis-data}
  memoryos_redisinsight:
    name: ${MEMORYOS_REDISINSIGHT_VOLUME:-memoryos-redisinsight-data}
  pgweb_credentials:
    name: ${MEMORYOS_PGWEB_CREDENTIALS_VOLUME:-memoryos-pgweb-credentials}
