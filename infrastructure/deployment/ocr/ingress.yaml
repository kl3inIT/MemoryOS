apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docling
  namespace: jmix-ocr
  labels:
    app.kubernetes.io/name: docling
    app.kubernetes.io/part-of: memoryos
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "150m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3630"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3630"
spec:
  ingressClassName: nginx
  rules:
    - host: ocr.10.123.123.194.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docling
                port:
                  number: 5001
