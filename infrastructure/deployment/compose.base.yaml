name: memoryos

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    image: ${MEMORYOS_POSTGRES_IMAGE:-postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382}
    container_name: memoryos-postgres
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${MEMORYOS_POSTGRES_ADMIN_USER:-memoryos_platform}
      POSTGRES_PASSWORD: ${MEMORYOS_POSTGRES_ADMIN_PASSWORD:?Set MEMORYOS_POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      PGHOST: /var/run/postgresql
      PGUSER: ${MEMORYOS_POSTGRES_ADMIN_USER:-memoryos_platform}
      PGPASSWORD: ${MEMORYOS_POSTGRES_ADMIN_PASSWORD:?Set MEMORYOS_POSTGRES_ADMIN_PASSWORD}
      MEMORYOS_DATABASE_NAME: ${MEMORYOS_DATABASE_NAME:-memoryos}
      MEMORYOS_DATABASE_USERNAME: ${MEMORYOS_DATABASE_USERNAME:-memoryos_app}
      MEMORYOS_DATABASE_PASSWORD: ${MEMORYOS_DATABASE_PASSWORD:?Set MEMORYOS_DATABASE_PASSWORD}
      MEMORYOS_KEYCLOAK_DATABASE_NAME: ${MEMORYOS_KEYCLOAK_DATABASE_NAME:-keycloak}
      MEMORYOS_KEYCLOAK_DATABASE_USERNAME: ${MEMORYOS_KEYCLOAK_DATABASE_USERNAME:-keycloak}
      MEMORYOS_KEYCLOAK_DATABASE_PASSWORD: ${MEMORYOS_KEYCLOAK_DATABASE_PASSWORD:?Set MEMORYOS_KEYCLOAK_DATABASE_PASSWORD}
    ports:
      - 127.0.0.1:${MEMORYOS_POSTGRES_HOST_PORT:-5556}:5432
    networks:
      memoryos-internal:
        aliases:
          - postgres
          - memoryos-postgres
    volumes:
      - memoryos_postgres:/var/lib/postgresql
      - ../postgres/bootstrap-shared-databases.sh:/docker-entrypoint-initdb.d/10-bootstrap-shared-databases.sh:ro
      - ../postgres/bootstrap-database.sql:/bootstrap/bootstrap-database.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    stop_grace_period: 60s
    shm_size: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768m
        reservations:
          memory: 256m


  postgres-backup:
    image: ${MEMORYOS_POSTGRES_IMAGE:-postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382}
    profiles:
      - ops
    user: "${MEMORYOS_BACKUP_UID:-1000}:${MEMORYOS_BACKUP_GID:-1000}"
    entrypoint:
      - /bin/sh
      - /backup-tools/backup-databases.sh
    environment:
      PGHOST: postgres
      PGUSER: ${MEMORYOS_POSTGRES_ADMIN_USER:-memoryos_platform}
      PGPASSWORD: ${MEMORYOS_POSTGRES_ADMIN_PASSWORD:?Set MEMORYOS_POSTGRES_ADMIN_PASSWORD}
      BACKUP_DATABASES: ${MEMORYOS_BACKUP_DATABASES:-memoryos keycloak}
      BACKUP_DIRECTORY: /backup
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - memoryos-internal
    volumes:
      - ../postgres/backup-databases.sh:/backup-tools/backup-databases.sh:ro
      - ${MEMORYOS_BACKUP_DIRECTORY:-/apps/memoryos/backups}:/backup
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  minio:
    <<: *service-defaults
    image: ${MEMORYOS_MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e}
    container_name: memoryos-minio
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >-
        export MINIO_ROOT_PASSWORD="$$(cat /run/secrets/minio_root_password)";
        exec minio server /data --address :9000 --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MEMORYOS_MINIO_ROOT_USER:-memoryos-root}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MEMORYOS_OBJECT_STORAGE_BROWSER_ORIGIN:?Set MEMORYOS_OBJECT_STORAGE_BROWSER_ORIGIN}
    secrets:
      - minio_root_password
    ports:
      - 127.0.0.1:${MEMORYOS_MINIO_HOST_PORT:-19000}:9000
    networks:
      memoryos-internal:
        aliases:
          - minio
          - memoryos-minio
      proxy:
        aliases:
          - minio
          - memoryos-minio
    volumes:
      - memoryos_minio:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:9000/minio/health/ready
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768m
        reservations:
          memory: 256m

  minio-bootstrap:
    image: ${MEMORYOS_MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3}
    container_name: memoryos-minio-bootstrap
    entrypoint:
      - /bootstrap/bootstrap.sh
    environment:
      MC_CONFIG_DIR: /tmp/mc
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MEMORYOS_MINIO_ROOT_USER:-memoryos-root}
      MINIO_BUCKET: ${MEMORYOS_OBJECT_STORAGE_BUCKET:-memoryos}
      MINIO_READINESS_KEY: ${MEMORYOS_OBJECT_STORAGE_READINESS_KEY:-system/readiness}
      MINIO_API_ACCESS_KEY: ${MEMORYOS_OBJECT_STORAGE_API_ACCESS_KEY:-memoryos-api}
      MINIO_WORKER_ACCESS_KEY: ${MEMORYOS_OBJECT_STORAGE_WORKER_ACCESS_KEY:-memoryos-worker}
    secrets:
      - minio_root_password
      - minio_api_secret_key
      - minio_worker_secret_key
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - memoryos-internal
    volumes:
      - ../minio/bootstrap.sh:/bootstrap/bootstrap.sh:ro
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  shared-keycloak:
    <<: *service-defaults
    image: ${MEMORYOS_SHARED_KEYCLOAK_IMAGE:?Set MEMORYOS_SHARED_KEYCLOAK_IMAGE}
    container_name: memoryos-shared-keycloak
    command:
      - start
      - --optimized
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://memoryos-postgres:5432/${MEMORYOS_KEYCLOAK_DATABASE_NAME:-keycloak}
      KC_DB_USERNAME: ${MEMORYOS_KEYCLOAK_DATABASE_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${MEMORYOS_KEYCLOAK_DATABASE_PASSWORD:?Set MEMORYOS_KEYCLOAK_DATABASE_PASSWORD}
      KC_DB_POOL_INITIAL_SIZE: "2"
      KC_DB_POOL_MIN_SIZE: "2"
      KC_DB_POOL_MAX_SIZE: "10"
      KC_HOSTNAME: ${MEMORYOS_KEYCLOAK_HOSTNAME:-https://auth.kl3in.tech}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_PROXY_HEADERS: xforwarded
      KC_LOG_LEVEL: ${MEMORYOS_KEYCLOAK_LOG_LEVEL:-INFO}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${MEMORYOS_KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?Set MEMORYOS_KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${MEMORYOS_KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?Set MEMORYOS_KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      JAVA_OPTS_KC_HEAP: -XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=65
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 127.0.0.1:${MEMORYOS_KEYCLOAK_HOST_PORT:-18180}:8080
    networks:
      memoryos-internal:
        aliases:
          - keycloak
          - shared-keycloak
      shared-infra:
        aliases:
          - keycloak
          - orgmemory-keycloak
          - memoryos-keycloak
      proxy:
        aliases:
          - keycloak
          - orgmemory-keycloak
          - memoryos-keycloak
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          { printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep -q '"status" *: *"UP"'; } 0<>/dev/tcp/127.0.0.1/9000
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /opt/keycloak/data:size=128m,uid=1000,gid=0,mode=1770
    stop_grace_period: 45s
    cpu_shares: 256
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512m
        reservations:
          memory: 256m

  api:
    <<: *service-defaults
    image: ${MEMORYOS_API_IMAGE:?Set MEMORYOS_API_IMAGE}
    container_name: memoryos-api
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    environment:
      MEMORYOS_OBJECT_STORAGE_SERVICE_ENDPOINT: http://minio:9000
      MEMORYOS_OBJECT_STORAGE_UPLOAD_ENDPOINT: ${MEMORYOS_OBJECT_STORAGE_UPLOAD_ENDPOINT:?Set MEMORYOS_OBJECT_STORAGE_UPLOAD_ENDPOINT}
      MEMORYOS_OBJECT_STORAGE_BUCKET: ${MEMORYOS_OBJECT_STORAGE_BUCKET:-memoryos}
      MEMORYOS_OBJECT_STORAGE_ACCESS_KEY: ${MEMORYOS_OBJECT_STORAGE_API_ACCESS_KEY:-memoryos-api}
      MEMORYOS_OBJECT_STORAGE_SECRET_KEY_FILE: /run/secrets/minio_api_secret_key
      MEMORYOS_OBJECT_STORAGE_READINESS_KEY: ${MEMORYOS_OBJECT_STORAGE_READINESS_KEY:-system/readiness}
    secrets:
      - source: memoryos_infisical_bootstrap
        target: memoryos_infisical_bootstrap
      - minio_api_secret_key
    depends_on:
      postgres:
        condition: service_healthy
      shared-keycloak:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:${MEMORYOS_API_HOST_PORT:-18080}:8080
    networks:
      memoryos-internal:
        aliases:
          - memoryos-api
      shared-infra:
        aliases:
          - memoryos-api
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://127.0.0.1:8080/actuator/health
          | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    stop_grace_period: 45s
    cpu_shares: 512
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768m
        reservations:
          memory: 384m


  worker:
    <<: *service-defaults
    image: ${MEMORYOS_WORKER_IMAGE:?Set MEMORYOS_WORKER_IMAGE}
    container_name: memoryos-worker
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    environment:
      MEMORYOS_OBJECT_STORAGE_SERVICE_ENDPOINT: http://minio:9000
      MEMORYOS_OBJECT_STORAGE_UPLOAD_ENDPOINT: ${MEMORYOS_OBJECT_STORAGE_UPLOAD_ENDPOINT:?Set MEMORYOS_OBJECT_STORAGE_UPLOAD_ENDPOINT}
      MEMORYOS_OBJECT_STORAGE_BUCKET: ${MEMORYOS_OBJECT_STORAGE_BUCKET:-memoryos}
      MEMORYOS_OBJECT_STORAGE_ACCESS_KEY: ${MEMORYOS_OBJECT_STORAGE_WORKER_ACCESS_KEY:-memoryos-worker}
      MEMORYOS_OBJECT_STORAGE_SECRET_KEY_FILE: /run/secrets/minio_worker_secret_key
      MEMORYOS_OBJECT_STORAGE_READINESS_KEY: ${MEMORYOS_OBJECT_STORAGE_READINESS_KEY:-system/readiness}
    secrets:
      - source: memoryos_infisical_bootstrap
        target: memoryos_infisical_bootstrap
      - minio_worker_secret_key
    depends_on:
      api:
        condition: service_healthy
    networks:
      memoryos-internal:
        aliases:
          - memoryos-worker
      shared-infra:
        aliases:
          - memoryos-worker
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://127.0.0.1:8081/actuator/health/readiness
          | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    stop_grace_period: 120s
    cpu_shares: 512
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024m
        reservations:
          memory: 512m

  web:
    <<: *service-defaults
    image: ${MEMORYOS_WEB_IMAGE:?Set MEMORYOS_WEB_IMAGE}
    container_name: memoryos-web
    environment:
      MEMORYOS_OBJECT_STORAGE_CONNECT_SRC: ${MEMORYOS_OBJECT_STORAGE_CONNECT_SRC:?Set MEMORYOS_OBJECT_STORAGE_CONNECT_SRC}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:${MEMORYOS_WEB_HOST_PORT:-18081}:8080
    networks:
      memoryos-internal:
        aliases:
          - memoryos-web
      proxy:
        aliases:
          - memoryos-web
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://127.0.0.1:8080/actuator/health
          | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    stop_grace_period: 15s
    cpu_shares: 128
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128m
        reservations:
          memory: 32m

networks:
  memoryos-internal:
    name: ${MEMORYOS_INTERNAL_NETWORK:-memoryos-internal}
    internal: true
  shared-infra:
    name: ${MEMORYOS_SHARED_INFRA_NETWORK:-shared-infra}
    external: true
  proxy:
    name: ${MEMORYOS_PROXY_NETWORK:-proxy-network}
    external: true

secrets:
  memoryos_infisical_bootstrap:
    file: ${MEMORYOS_INFISICAL_BOOTSTRAP_FILE:?Set MEMORYOS_INFISICAL_BOOTSTRAP_FILE}
  minio_root_password:
    file: ${MEMORYOS_MINIO_ROOT_PASSWORD_FILE:-/apps/memoryos/secrets/minio/root-password.txt}
  minio_api_secret_key:
    file: ${MEMORYOS_MINIO_API_SECRET_KEY_FILE:-/apps/memoryos/secrets/minio/api-secret-key.txt}
  minio_worker_secret_key:
    file: ${MEMORYOS_MINIO_WORKER_SECRET_KEY_FILE:-/apps/memoryos/secrets/minio/worker-secret-key.txt}

volumes:
  memoryos_postgres:
    name: ${MEMORYOS_POSTGRES_VOLUME:-memoryos-postgres-data}
  memoryos_minio:
    name: ${MEMORYOS_MINIO_VOLUME:-memoryos-minio-data}
