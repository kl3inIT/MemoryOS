name: memoryos

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    image: ${MEMORYOS_POSTGRES_IMAGE:-postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382}
    container_name: memoryos-postgres
    # Every one of these was the stock default until now, on a machine that has far more memory
    # than the defaults assume. The defaults here stay modest because one environment shares its
    # host with unrelated services; an environment with room of its own raises them in its
    # environment file. work_mem is charged per sort or hash within a query, not per connection,
    # so the ceiling is the pool size times the operations one query can hold at once.
    command:
      - postgres
      - -c
      - shared_buffers=${MEMORYOS_POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${MEMORYOS_POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - work_mem=${MEMORYOS_POSTGRES_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${MEMORYOS_POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - max_connections=${MEMORYOS_POSTGRES_MAX_CONNECTIONS:-100}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${MEMORYOS_POSTGRES_ADMIN_USER:-memoryos_platform}
      POSTGRES_PASSWORD: ${MEMORYOS_POSTGRES_ADMIN_PASSWORD:?Set MEMORYOS_POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      PGHOST: /var/run/postgresql
      PGUSER: ${MEMORYOS_POSTGRES_ADMIN_USER:-memoryos_platform}
      PGPASSWORD: ${MEMORYOS_POSTGRES_ADMIN_PASSWORD:?Set MEMORYOS_POSTGRES_ADMIN_PASSWORD}
      MEMORYOS_DATABASE_NAME: ${MEMORYOS_DATABASE_NAME:-memoryos}
      MEMORYOS_DATABASE_USERNAME: ${MEMORYOS_DATABASE_USERNAME:-memoryos_app}
      MEMORYOS_DATABASE_PASSWORD: ${MEMORYOS_DATABASE_PASSWORD:?Set MEMORYOS_DATABASE_PASSWORD}
      MEMORYOS_DATABASE_CONNECTION_LIMIT: ${MEMORYOS_DATABASE_CONNECTION_LIMIT:-40}
      MEMORYOS_KEYCLOAK_DATABASE_NAME: ${MEMORYOS_KEYCLOAK_DATABASE_NAME:-keycloak}
      MEMORYOS_KEYCLOAK_DATABASE_USERNAME: ${MEMORYOS_KEYCLOAK_DATABASE_USERNAME:-keycloak}
      MEMORYOS_KEYCLOAK_DATABASE_PASSWORD: ${MEMORYOS_KEYCLOAK_DATABASE_PASSWORD:?Set MEMORYOS_KEYCLOAK_DATABASE_PASSWORD}
    ports:
      - 127.0.0.1:${MEMORYOS_POSTGRES_HOST_PORT:-5556}:5432
    networks:
      memoryos-internal:
        aliases:
          - postgres
          - memoryos-postgres
    volumes:
      - memoryos_postgres:/var/lib/postgresql
      - ../postgres/bootstrap-shared-databases.sh:/docker-entrypoint-initdb.d/10-bootstrap-shared-databases.sh:ro
      - ../postgres/bootstrap-database.sql:/bootstrap/bootstrap-database.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    stop_grace_period: 60s
    shm_size: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    deploy:
      resources:
        reservations:
          memory: 256m


  postgres-backup:
    image: ${MEMORYOS_POSTGRES_IMAGE:-postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382}
    profiles:
      - ops
    user: "${MEMORYOS_BACKUP_UID:-1000}:${MEMORYOS_BACKUP_GID:-1000}"
    entrypoint:
      - /bin/sh
      - /backup-tools/backup-databases.sh
    environment:
      PGHOST: postgres
      PGUSER: ${MEMORYOS_POSTGRES_ADMIN_USER:-memoryos_platform}
      PGPASSWORD: ${MEMORYOS_POSTGRES_ADMIN_PASSWORD:?Set MEMORYOS_POSTGRES_ADMIN_PASSWORD}
      BACKUP_DATABASES: ${MEMORYOS_BACKUP_DATABASES:-memoryos keycloak}
      BACKUP_DIRECTORY: /backup
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - memoryos-internal
    volumes:
      - ../postgres/backup-databases.sh:/backup-tools/backup-databases.sh:ro
      - ${MEMORYOS_BACKUP_DIRECTORY:-/apps/memoryos/backups}:/backup
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  minio:
    <<: *service-defaults
    image: ${MEMORYOS_MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e}
    container_name: memoryos-minio
    cap_add:
      - DAC_OVERRIDE
    entrypoint:
      - /bin/sh
      - /minio-tools/start-minio.sh
    environment:
      MINIO_ROOT_USER: ${MEMORYOS_MINIO_ROOT_USER:-memoryos-root}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MEMORYOS_OBJECT_STORAGE_BROWSER_ORIGIN:?Set MEMORYOS_OBJECT_STORAGE_BROWSER_ORIGIN}
    secrets:
      - minio_root_password
    ports:
      - 127.0.0.1:${MEMORYOS_MINIO_HOST_PORT:-19000}:9000
    networks:
      memoryos-internal:
        aliases:
          - minio
          - memoryos-minio
      proxy:
        aliases:
          - minio
          - memoryos-minio
    volumes:
      - memoryos_minio:/data
      - ../minio/start-minio.sh:/minio-tools/start-minio.sh:ro
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:9000/minio/health/ready
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 60s
    deploy:
      resources:
        reservations:
          memory: 256m

  minio-bootstrap:
    # The same registry the server comes from, and by the same digest: Docker Hub no longer
    # serves minio/mc, so a host without it already cached cannot pull the client at all.
    image: ${MEMORYOS_MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3}
    container_name: memoryos-minio-bootstrap
    cap_add:
      - DAC_OVERRIDE
    entrypoint:
      - /bin/sh
      - /bootstrap/bootstrap.sh
    environment:
      MC_CONFIG_DIR: /tmp/mc
      MINIO_ENDPOINT: http://memoryos-minio:9000
      MINIO_ROOT_USER: ${MEMORYOS_MINIO_ROOT_USER:-memoryos-root}
      MINIO_BUCKET: ${MEMORYOS_OBJECT_STORAGE_BUCKET:-memoryos}
      MINIO_READINESS_KEY: ${MEMORYOS_OBJECT_STORAGE_READINESS_KEY:-system/readiness}
      MINIO_API_ACCESS_KEY: ${MEMORYOS_OBJECT_STORAGE_API_ACCESS_KEY:-memoryos-api}
      MINIO_WORKER_ACCESS_KEY: ${MEMORYOS_OBJECT_STORAGE_WORKER_ACCESS_KEY:-memoryos-worker}
    secrets:
      - minio_root_password
      - minio_api_secret_key
      - minio_worker_secret_key
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - memoryos-internal
    volumes:
      - ../minio/bootstrap.sh:/bootstrap/bootstrap.sh:ro
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  keycloak:
    <<: *service-defaults
    # Each release publishes memoryos-keycloak with the login theme inside it, and the deployment
    # rolls it out with the rest. A host whose environment file names this variable keeps that image
    # instead and manages Keycloak itself: staging, where the runtime is shared with OrgMemory.
    image: ${MEMORYOS_KEYCLOAK_IMAGE:?Set MEMORYOS_KEYCLOAK_IMAGE}
    container_name: memoryos-keycloak
    command:
      - start
      - --optimized
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://memoryos-postgres:5432/${MEMORYOS_KEYCLOAK_DATABASE_NAME:-keycloak}
      KC_DB_USERNAME: ${MEMORYOS_KEYCLOAK_DATABASE_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${MEMORYOS_KEYCLOAK_DATABASE_PASSWORD:?Set MEMORYOS_KEYCLOAK_DATABASE_PASSWORD}
      KC_DB_POOL_INITIAL_SIZE: "2"
      KC_DB_POOL_MIN_SIZE: "2"
      KC_DB_POOL_MAX_SIZE: "10"
      KC_HOSTNAME: ${MEMORYOS_KEYCLOAK_HOSTNAME:?Set MEMORYOS_KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_PROXY_HEADERS: xforwarded
      KC_LOG_LEVEL: ${MEMORYOS_KEYCLOAK_LOG_LEVEL:-INFO}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${MEMORYOS_KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?Set MEMORYOS_KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${MEMORYOS_KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?Set MEMORYOS_KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      JAVA_OPTS_KC_HEAP: -XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=65
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 127.0.0.1:${MEMORYOS_KEYCLOAK_HOST_PORT:-18180}:8080
    networks:
      memoryos-internal:
        aliases:
          - keycloak
          - memoryos-keycloak
      proxy:
        aliases:
          - keycloak
          - memoryos-keycloak
    healthcheck:
      # Readiness answers 200 only once the server is up. Its body gives every check a status of its
      # own, and those read UP while "Keycloak Initialized" is still DOWN.
      test:
        - CMD-SHELL
        - >-
          { printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&0;
          head -n 1 | grep -q ' 200 '; } 0<>/dev/tcp/127.0.0.1/9000
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /opt/keycloak/data:size=128m,uid=1000,gid=0,mode=1770
    stop_grace_period: 45s
    cpu_shares: 256
    deploy:
      resources:
        reservations:
          memory: 512m

  api:
    <<: *service-defaults
    image: ${MEMORYOS_API_IMAGE:?Set MEMORYOS_API_IMAGE}
    container_name: memoryos-api
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    environment:
      MEMORYOS_OBJECT_STORAGE_SERVICE_ENDPOINT: http://memoryos-minio:9000
      MEMORYOS_OBJECT_STORAGE_UPLOAD_ENDPOINT: ${MEMORYOS_OBJECT_STORAGE_UPLOAD_ENDPOINT:?Set MEMORYOS_OBJECT_STORAGE_UPLOAD_ENDPOINT}
      MEMORYOS_OBJECT_STORAGE_BUCKET: ${MEMORYOS_OBJECT_STORAGE_BUCKET:-memoryos}
      MEMORYOS_OBJECT_STORAGE_ACCESS_KEY: ${MEMORYOS_OBJECT_STORAGE_API_ACCESS_KEY:-memoryos-api}
      MEMORYOS_OBJECT_STORAGE_SECRET_KEY_FILE: /run/secrets/minio_api_secret_key
      MEMORYOS_OBJECT_STORAGE_READINESS_KEY: ${MEMORYOS_OBJECT_STORAGE_READINESS_KEY:-system/readiness}
      MEMORYOS_CHAT_STORAGE_LIBRARY_BYTES: ${MEMORYOS_CHAT_STORAGE_LIBRARY_BYTES:-536870912}
      MEMORYOS_TENANT_ID: ${MEMORYOS_TENANT_ID:?Set MEMORYOS_TENANT_ID}
      MEMORYOS_TENANT_SLUG: ${MEMORYOS_TENANT_SLUG:?Set MEMORYOS_TENANT_SLUG}
      MEMORYOS_TENANT_DISPLAY_NAME: ${MEMORYOS_TENANT_DISPLAY_NAME:?Set MEMORYOS_TENANT_DISPLAY_NAME}
      MEMORYOS_INITIAL_TENANT_CHANGE_REFERENCE: ${MEMORYOS_INITIAL_TENANT_CHANGE_REFERENCE:?Set MEMORYOS_INITIAL_TENANT_CHANGE_REFERENCE}
      MEMORYOS_RELEASE: ${MEMORYOS_RELEASE:?Set MEMORYOS_RELEASE}
      MEMORYOS_INTERPRETER_BASE_URL: http://memoryos-interpreter:8000
      MEMORYOS_INTERPRETER_API_KEY_FILE: /run/secrets/interpreter_api_key
      # MEM-26: Chat reply replay. The memoryos-api ACL user reaches only memoryos:chat:stream:* keys.
      MEMORYOS_REDIS_HOST: redis
      MEMORYOS_REDIS_PORT: "6379"
      MEMORYOS_REDIS_USERNAME: memoryos-api
      MEMORYOS_REDIS_SSL_ENABLED: "true"
      MEMORYOS_REDIS_TLS_CA_FILE: /run/secrets/redis_tls_ca
      MEMORYOS_REDIS_PASSWORD_FILE: /run/secrets/redis_api_password
      MEMORYOS_REDIS_CONNECT_TIMEOUT: ${MEMORYOS_REDIS_CONNECT_TIMEOUT:-2s}
      MEMORYOS_REDIS_COMMAND_TIMEOUT: ${MEMORYOS_REDIS_COMMAND_TIMEOUT:-2s}
      # Configuration the vault used to inject into the process. Compose interpolation fills the
      # composition file only; a value reaches the container when a service names it here.
      #
      # Addresses the composition itself decides, so the environment file cannot drift from them.
      MEMORYOS_DATABASE_URL: jdbc:postgresql://memoryos-postgres:5432/${MEMORYOS_DATABASE_NAME:-memoryos}
      MEMORYOS_DATABASE_USERNAME: ${MEMORYOS_DATABASE_USERNAME:-memoryos_app}
      MEMORYOS_DATABASE_POOL_SIZE: ${MEMORYOS_API_DATABASE_POOL_SIZE:-15}
      MEMORYOS_KEYCLOAK_ADMIN_SERVER_URL: http://memoryos-keycloak:8080
      MEMORYOS_OPENSEARCH_ENDPOINT: https://opensearch:9200
      MEMORYOS_OPENSEARCH_USERNAME: ${MEMORYOS_OPENSEARCH_USERNAME:-memoryos-service}
      #
      # Values that differ between environments. Required rather than defaulted: a wrong issuer or
      # a search index built for the other environment fails quietly, and quiet is the failure
      # that reaches customers.
      MEMORYOS_IDENTITY_ISSUER: ${MEMORYOS_IDENTITY_ISSUER:?Set MEMORYOS_IDENTITY_ISSUER}
      MEMORYOS_IDENTITY_JWK_SET_URI: ${MEMORYOS_IDENTITY_JWK_SET_URI:?Set MEMORYOS_IDENTITY_JWK_SET_URI}
      MEMORYOS_IDENTITY_AUDIENCE: ${MEMORYOS_IDENTITY_AUDIENCE:?Set MEMORYOS_IDENTITY_AUDIENCE}
      MEMORYOS_INITIAL_OWNER_SUBJECT: ${MEMORYOS_INITIAL_OWNER_SUBJECT:?Set MEMORYOS_INITIAL_OWNER_SUBJECT}
      MEMORYOS_INVITATION_ACTIVATION_REDIRECT_URI: ${MEMORYOS_INVITATION_ACTIVATION_REDIRECT_URI:?Set MEMORYOS_INVITATION_ACTIVATION_REDIRECT_URI}
      MEMORYOS_GOOGLE_DRIVE_REDIRECT_URI: ${MEMORYOS_GOOGLE_DRIVE_REDIRECT_URI:?Set MEMORYOS_GOOGLE_DRIVE_REDIRECT_URI}
      MEMORYOS_GOOGLE_DRIVE_CREDENTIAL_KEY_VERSION: ${MEMORYOS_GOOGLE_DRIVE_CREDENTIAL_KEY_VERSION:?Set MEMORYOS_GOOGLE_DRIVE_CREDENTIAL_KEY_VERSION}
      MEMORYOS_MCP_REDIRECT_URI: ${MEMORYOS_MCP_REDIRECT_URI:?Set MEMORYOS_MCP_REDIRECT_URI}
      MEMORYOS_SESSION_COOKIE_SECURE: ${MEMORYOS_SESSION_COOKIE_SECURE:?Set MEMORYOS_SESSION_COOKIE_SECURE}
      MEMORYOS_SEARCH_REPLICAS: ${MEMORYOS_SEARCH_REPLICAS:?Set MEMORYOS_SEARCH_REPLICAS}
      # An empty list admits nobody, which is the safe reading of an absent setting.
      MEMORYOS_JIT_ALLOWED_PROVIDER_ALIASES: ${MEMORYOS_JIT_ALLOWED_PROVIDER_ALIASES:-}
      MEMORYOS_DATABASE_PASSWORD_FILE: /run/secrets/database_password
      MEMORYOS_BROWSER_CLIENT_SECRET_FILE: /run/secrets/browser_client_secret
      MEMORYOS_KEYCLOAK_ADMIN_CLIENT_SECRET_FILE: /run/secrets/keycloak_admin_client_secret
      MEMORYOS_OPENSEARCH_PASSWORD_FILE: /run/secrets/opensearch_password
      MEMORYOS_CHAT_CATALOG_ENCRYPTION_KEY_FILE: /run/secrets/chat_catalog_encryption_key
      MEMORYOS_GOOGLE_DRIVE_CREDENTIAL_ENCRYPTION_KEY_FILE: /run/secrets/google_drive_credential_encryption_key
      MEMORYOS_MCP_CREDENTIAL_ENCRYPTION_KEY_FILE: /run/secrets/mcp_credential_encryption_key
      # One key serves chat and embedding; the launcher exports both names from this file.
      MEMORYOS_CHAT_API_KEY_FILE: /run/secrets/model_api_key
      MEMORYOS_EMBEDDING_API_KEY_FILE: /run/secrets/model_api_key
    secrets:
      - minio_api_secret_key
      - interpreter_api_key
      - redis_tls_ca
      - redis_api_password
      - database_password
      - browser_client_secret
      - keycloak_admin_client_secret
      - opensearch_password
      - chat_catalog_encryption_key
      - google_drive_credential_encryption_key
      - mcp_credential_encryption_key
      - model_api_key
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - 127.0.0.1:${MEMORYOS_API_HOST_PORT:-18080}:8080
    networks:
      memoryos-internal:
        aliases:
          - memoryos-api
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://127.0.0.1:8080/actuator/health
          | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    stop_grace_period: 45s
    cpu_shares: 512
    deploy:
      resources:
        reservations:
          memory: 384m


  worker:
    <<: *service-defaults
    image: ${MEMORYOS_WORKER_IMAGE:?Set MEMORYOS_WORKER_IMAGE}
    container_name: memoryos-worker
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    environment:
      MEMORYOS_EXTRACTION_DOCLING_ENDPOINT: ${MEMORYOS_EXTRACTION_DOCLING_ENDPOINT:-http://docling:5001}
      MEMORYOS_EXTRACTION_DOCLING_ENGINE_REVISION: ${MEMORYOS_EXTRACTION_DOCLING_ENGINE_REVISION:-sha256:0525640504db7ed8a53e0e443882727888f6a3746948b1b7a8820efe95567bd3}
      MEMORYOS_EXTRACTION_DOCLING_OCR_ENGINE: ${MEMORYOS_EXTRACTION_DOCLING_OCR_ENGINE:-easyocr}
      MEMORYOS_EXTRACTION_DOCLING_OCR_LANGUAGES: ${MEMORYOS_EXTRACTION_DOCLING_OCR_LANGUAGES:-}
      MEMORYOS_EXTRACTION_DOCLING_FORCE_OCR: ${MEMORYOS_EXTRACTION_DOCLING_FORCE_OCR:-false}
      MEMORYOS_EXTRACTION_DOCLING_TIMEOUT: ${MEMORYOS_EXTRACTION_DOCLING_TIMEOUT:-5m}
      # MEM-192: PaddleOCR-VL on the GPU node reads scans and images. Empty leaves it absent, and
      # Docling then keeps its own OCR; set, Docling reads text layers only.
      MEMORYOS_EXTRACTION_PADDLEOCR_VL_ENDPOINT: ${MEMORYOS_EXTRACTION_PADDLEOCR_VL_ENDPOINT:-}
      MEMORYOS_EXTRACTION_PADDLEOCR_VL_TIMEOUT: ${MEMORYOS_EXTRACTION_PADDLEOCR_VL_TIMEOUT:-10m}
      MEMORYOS_EXTRACTION_PADDLEOCR_VL_REVISION: ${MEMORYOS_EXTRACTION_PADDLEOCR_VL_REVISION:-}
      MEMORYOS_OBJECT_STORAGE_SERVICE_ENDPOINT: http://memoryos-minio:9000
      MEMORYOS_OBJECT_STORAGE_UPLOAD_ENDPOINT: ${MEMORYOS_OBJECT_STORAGE_UPLOAD_ENDPOINT:?Set MEMORYOS_OBJECT_STORAGE_UPLOAD_ENDPOINT}
      MEMORYOS_OBJECT_STORAGE_BUCKET: ${MEMORYOS_OBJECT_STORAGE_BUCKET:-memoryos}
      MEMORYOS_OBJECT_STORAGE_ACCESS_KEY: ${MEMORYOS_OBJECT_STORAGE_WORKER_ACCESS_KEY:-memoryos-worker}
      MEMORYOS_OBJECT_STORAGE_SECRET_KEY_FILE: /run/secrets/minio_worker_secret_key
      MEMORYOS_OBJECT_STORAGE_READINESS_KEY: ${MEMORYOS_OBJECT_STORAGE_READINESS_KEY:-system/readiness}
      MEMORYOS_RELEASE: ${MEMORYOS_RELEASE:?Set MEMORYOS_RELEASE}
      MEMORYOS_REDIS_HOST: redis
      MEMORYOS_REDIS_PORT: "6379"
      MEMORYOS_REDIS_USERNAME: memoryos-worker
      MEMORYOS_REDIS_SSL_ENABLED: "true"
      MEMORYOS_REDIS_TLS_CA_FILE: /run/secrets/redis_tls_ca
      MEMORYOS_REDIS_PASSWORD_FILE: /run/secrets/redis_worker_password
      MEMORYOS_REDIS_CONNECT_TIMEOUT: ${MEMORYOS_REDIS_CONNECT_TIMEOUT:-2s}
      # Not the api's value. The worker's stream reads block on the server for consumer-block (2s);
      # a command timeout no longer than that expires every idle read, logs it as a transport
      # failure and backs off before reading again.
      MEMORYOS_REDIS_COMMAND_TIMEOUT: ${MEMORYOS_WORKER_REDIS_COMMAND_TIMEOUT:-5s}
      MEMORYOS_REDIS_POOL_MAX_ACTIVE: ${MEMORYOS_REDIS_POOL_MAX_ACTIVE:-8}
      MEMORYOS_REDIS_POOL_MAX_IDLE: ${MEMORYOS_REDIS_POOL_MAX_IDLE:-8}
      MEMORYOS_REDIS_POOL_MIN_IDLE: ${MEMORYOS_REDIS_POOL_MIN_IDLE:-0}
      MEMORYOS_REDIS_POOL_MAX_WAIT: ${MEMORYOS_REDIS_POOL_MAX_WAIT:-2s}
      # See the api service. The Worker reads the database, the search cluster and the Google Drive
      # key version; identity and the redirect URIs belong to the browser-facing service alone.
      MEMORYOS_DATABASE_URL: jdbc:postgresql://memoryos-postgres:5432/${MEMORYOS_DATABASE_NAME:-memoryos}
      MEMORYOS_DATABASE_USERNAME: ${MEMORYOS_DATABASE_USERNAME:-memoryos_app}
      MEMORYOS_DATABASE_POOL_SIZE: ${MEMORYOS_WORKER_DATABASE_POOL_SIZE:-10}
      MEMORYOS_OPENSEARCH_ENDPOINT: https://opensearch:9200
      MEMORYOS_OPENSEARCH_USERNAME: ${MEMORYOS_OPENSEARCH_USERNAME:-memoryos-service}
      MEMORYOS_GOOGLE_DRIVE_CREDENTIAL_KEY_VERSION: ${MEMORYOS_GOOGLE_DRIVE_CREDENTIAL_KEY_VERSION:?Set MEMORYOS_GOOGLE_DRIVE_CREDENTIAL_KEY_VERSION}
      MEMORYOS_SEARCH_REPLICAS: ${MEMORYOS_SEARCH_REPLICAS:?Set MEMORYOS_SEARCH_REPLICAS}
      MEMORYOS_DATABASE_PASSWORD_FILE: /run/secrets/database_password
      MEMORYOS_OPENSEARCH_PASSWORD_FILE: /run/secrets/opensearch_password
      MEMORYOS_EXTRACTION_DOCLING_API_KEY_FILE: /run/secrets/docling_api_key
      MEMORYOS_GOOGLE_DRIVE_CREDENTIAL_ENCRYPTION_KEY_FILE: /run/secrets/google_drive_credential_encryption_key
      MEMORYOS_EMBEDDING_API_KEY_FILE: /run/secrets/model_api_key
      # The embedding provider chosen on the Search settings page keeps its key encrypted with the
      # catalog key (MEM-135), and the worker embeds every indexed chunk with it.
      MEMORYOS_CHAT_CATALOG_ENCRYPTION_KEY_FILE: /run/secrets/chat_catalog_encryption_key
    secrets:
      - minio_worker_secret_key
      - redis_tls_ca
      - redis_worker_password
      - database_password
      - opensearch_password
      - docling_api_key
      - google_drive_credential_encryption_key
      - model_api_key
      - chat_catalog_encryption_key
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      memoryos-internal:
        aliases:
          - memoryos-worker
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://127.0.0.1:8081/actuator/health/readiness
          | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    stop_grace_period: 120s
    cpu_shares: 512
    deploy:
      resources:
        reservations:
          memory: 512m

  web:
    <<: *service-defaults
    image: ${MEMORYOS_WEB_IMAGE:?Set MEMORYOS_WEB_IMAGE}
    container_name: memoryos-web
    environment:
      MEMORYOS_OBJECT_STORAGE_CONNECT_SRC: ${MEMORYOS_OBJECT_STORAGE_CONNECT_SRC:?Set MEMORYOS_OBJECT_STORAGE_CONNECT_SRC}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:${MEMORYOS_WEB_HOST_PORT:-18081}:8080
    networks:
      memoryos-internal:
        aliases:
          - memoryos-web
      proxy:
        aliases:
          - memoryos-web
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://127.0.0.1:8080/actuator/health
          | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    stop_grace_period: 15s
    cpu_shares: 128
    deploy:
      resources:
        reservations:
          memory: 32m

  docling:
    <<: *service-defaults
    image: ${MEMORYOS_DOCLING_IMAGE:-quay.io/docling-project/docling-serve-cpu:v1.34.0@sha256:0525640504db7ed8a53e0e443882727888f6a3746948b1b7a8820efe95567bd3}
    environment:
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: ${DOCLING_SERVE_ENG_LOC_NUM_WORKERS:-1}
      DOCLING_SERVE_MAX_NUM_PAGES: ${DOCLING_SERVE_MAX_NUM_PAGES:-200}
      DOCLING_SERVE_MAX_FILE_SIZE: ${DOCLING_SERVE_MAX_FILE_SIZE:-104857600}
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: ${DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT:-300}
      DOCLING_SERVE_MAX_SYNC_WAIT: ${DOCLING_SERVE_MAX_SYNC_WAIT:-310}
      DOCLING_SERVE_ALLOWED_SOURCE_TYPES: ${DOCLING_SERVE_ALLOWED_SOURCE_TYPES:-file}
      DOCLING_SERVE_ALLOWED_TARGET_TYPES: ${DOCLING_SERVE_ALLOWED_TARGET_TYPES:-inbody}
      DOCLING_SERVE_ENABLE_UI: ${DOCLING_SERVE_ENABLE_UI:-false}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      EASYOCR_MODULE_PATH: ${EASYOCR_MODULE_PATH:-/tmp/easyocr}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
    networks:
      - memoryos-internal
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:5001/health]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    stop_grace_period: 330s

  # MEM-26/MEM-43: Chat replay and the worker dispatch plane. TLS only, ACL users per deployable.
  redis:
    <<: *service-defaults
    image: ${MEMORYOS_REDIS_IMAGE:-redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232}
    container_name: memoryos-redis
    user: "0:0"
    entrypoint:
      - /bin/sh
      - /redis-tools/start-redis.sh
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - SETGID
      - SETUID
    secrets:
      - redis_admin_password
      - redis_worker_password
      - redis_api_password
      - redis_tls_ca
      - redis_tls_certificate
      - redis_tls_private_key
    networks:
      memoryos-internal:
        aliases:
          - redis
          - memoryos-redis
    volumes:
      - memoryos_redis:/data
      - ../redis/start-redis.sh:/redis-tools/start-redis.sh:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$(cat /run/secrets/redis_admin_password)"
          redis-cli --tls --cacert /run/secrets/redis_tls_ca
          --user memoryos-admin -h 127.0.0.1 ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s
    stop_grace_period: 30s
    deploy:
      resources:
        reservations:
          memory: 128m

  # MEM-110: runs Python for the Chat run_python tool. It starts one executor container per run
  # on the host daemon through the socket, which grants host-level Docker control: keep it on the
  # internal network without a host port. See the interpreter section of docs/runbooks/ci-cd.md.
  interpreter:
    <<: *service-defaults
    image: ${MEMORYOS_INTERPRETER_IMAGE:?Set MEMORYOS_INTERPRETER_IMAGE}
    container_name: memoryos-interpreter
    user: root
    # Compose file secrets keep their host owner and mode (0600, owned by the operator), so root in this
    # capability-dropped container needs DAC_OVERRIDE to read the API key, as the api service does.
    cap_add:
      - DAC_OVERRIDE
    environment:
      EXECUTOR_BACKEND: docker
      PYTHON_EXECUTOR_DOCKER_IMAGE: ${MEMORYOS_INTERPRETER_EXECUTOR_IMAGE:?Set MEMORYOS_INTERPRETER_EXECUTOR_IMAGE}
      PYTHON_EXECUTOR_DOCKER_NETWORK: none
      LOG_FORMAT: json
      # Each executor may use 1 GiB; this bounds executor memory on the host to about 4 GiB.
      MAX_CONCURRENT_EXECUTIONS: ${MEMORYOS_INTERPRETER_MAX_CONCURRENT_EXECUTIONS:-4}
      # deploy.sh pulls the executor with job-scoped registry credentials; the service has none.
      PYTHON_EXECUTOR_DOCKER_IMAGE_WATCHDOG_INTERVAL_SEC: "0"
      API_KEY_FILE: /run/secrets/interpreter_api_key
      # A turn reuses its uploads for at most 2 minutes; expired files free the /tmp tmpfs.
      FILE_TTL_SEC: "900"
    secrets:
      - interpreter_api_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      memoryos-internal:
        aliases:
          - memoryos-interpreter
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    stop_grace_period: 65s
    deploy:
      resources:
        reservations:
          memory: 128m

networks:
  memoryos-internal:
    name: ${MEMORYOS_INTERNAL_NETWORK:-memoryos-internal}
    internal: true
  proxy:
    name: ${MEMORYOS_PROXY_NETWORK:-proxy-network}
    external: true

secrets:
  # Generated on the server and never leaving it. A deployment refuses to reserve the environment
  # when one of these files is missing, which is a clearer failure than a container that starts
  # without a password. See docs/increments/active/server-secrets-as-files.
  database_password:
    file: ${MEMORYOS_DATABASE_PASSWORD_SECRET_FILE:-/apps/memoryos/secrets/database/app-password.txt}
  browser_client_secret:
    file: ${MEMORYOS_BROWSER_CLIENT_SECRET_SECRET_FILE:-/apps/memoryos/secrets/keycloak/browser-client-secret.txt}
  keycloak_admin_client_secret:
    file: ${MEMORYOS_KEYCLOAK_ADMIN_CLIENT_SECRET_SECRET_FILE:-/apps/memoryos/secrets/keycloak/admin-client-secret.txt}
  opensearch_password:
    file: ${MEMORYOS_OPENSEARCH_PASSWORD_SECRET_FILE:-/apps/memoryos/secrets/opensearch/service-password.txt}
  docling_api_key:
    file: ${MEMORYOS_EXTRACTION_DOCLING_API_KEY_SECRET_FILE:-/apps/memoryos/secrets/docling/api-key.txt}
  chat_catalog_encryption_key:
    file: ${MEMORYOS_CHAT_CATALOG_ENCRYPTION_KEY_SECRET_FILE:-/apps/memoryos/secrets/encryption/chat-catalog-key.txt}
  google_drive_credential_encryption_key:
    file: ${MEMORYOS_GOOGLE_DRIVE_CREDENTIAL_ENCRYPTION_KEY_SECRET_FILE:-/apps/memoryos/secrets/encryption/google-drive-credential-key.txt}
  mcp_credential_encryption_key:
    file: ${MEMORYOS_MCP_CREDENTIAL_ENCRYPTION_KEY_SECRET_FILE:-/apps/memoryos/secrets/encryption/mcp-credential-key.txt}
  model_api_key:
    file: ${MEMORYOS_MODEL_API_KEY_SECRET_FILE:-/apps/memoryos/secrets/model/api-key.txt}
  minio_root_password:
    file: ${MEMORYOS_MINIO_ROOT_PASSWORD_FILE:-/apps/memoryos/secrets/minio/root-password.txt}
  minio_api_secret_key:
    file: ${MEMORYOS_MINIO_API_SECRET_KEY_FILE:-/apps/memoryos/secrets/minio/api-secret-key.txt}
  minio_worker_secret_key:
    file: ${MEMORYOS_MINIO_WORKER_SECRET_KEY_FILE:-/apps/memoryos/secrets/minio/worker-secret-key.txt}
  interpreter_api_key:
    file: ${MEMORYOS_INTERPRETER_API_KEY_SECRET_FILE:-/apps/memoryos/secrets/interpreter/api-key.txt}
  redis_admin_password:
    file: ${MEMORYOS_REDIS_ADMIN_PASSWORD_FILE:?Set MEMORYOS_REDIS_ADMIN_PASSWORD_FILE}
  redis_worker_password:
    file: ${MEMORYOS_REDIS_WORKER_PASSWORD_FILE:?Set MEMORYOS_REDIS_WORKER_PASSWORD_FILE}
  redis_api_password:
    file: ${MEMORYOS_REDIS_API_PASSWORD_FILE:?Set MEMORYOS_REDIS_API_PASSWORD_FILE}
  redis_tls_ca:
    file: ${MEMORYOS_REDIS_TLS_CA_FILE:?Set MEMORYOS_REDIS_TLS_CA_FILE}
  redis_tls_certificate:
    file: ${MEMORYOS_REDIS_TLS_CERTIFICATE_FILE:?Set MEMORYOS_REDIS_TLS_CERTIFICATE_FILE}
  redis_tls_private_key:
    file: ${MEMORYOS_REDIS_TLS_PRIVATE_KEY_FILE:?Set MEMORYOS_REDIS_TLS_PRIVATE_KEY_FILE}

volumes:
  memoryos_postgres:
    name: ${MEMORYOS_POSTGRES_VOLUME:-memoryos-postgres-data}
  memoryos_minio:
    name: ${MEMORYOS_MINIO_VOLUME:-memoryos-minio-data}
  memoryos_redis:
    name: ${MEMORYOS_REDIS_VOLUME:-memoryos-redis-data}
