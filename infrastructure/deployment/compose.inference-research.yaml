name: memoryos-inference-research

services:
  vllm:
    image: ${MEMORYOS_VLLM_IMAGE:-vllm/vllm-openai-cpu:v0.28.0-x86_64@sha256:ea8b61f8ccab650e1c369105373863ac12a581b53f289b344cea72a09238e131}
    entrypoint:
      - /opt/venv/bin/python3
      - /memoryos-inference/start-vllm.py
    command:
      - HuggingFaceTB/SmolLM2-135M-Instruct
      - --revision=12fd25f77366fa6b3b4b768ec3050bf629380bac
      - --chat-template=/memoryos-inference/smollm2-chat-template.jinja
      - --dtype=bfloat16
      - --max-model-len=1024
      - --max-num-seqs=1
      - --max-num-batched-tokens=1024
      - --host=0.0.0.0
      - --port=8000
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: ${MEMORYOS_INFERENCE_HF_HUB_OFFLINE:-0}
      VLLM_CPU_KVCACHE_SPACE: "1"
    secrets:
      - inference_api_key
    networks:
      - inference
    volumes:
      - inference_cache:/cache
      - ../inference/start-vllm.py:/memoryos-inference/start-vllm.py:ro
      - ../inference/smollm2-chat-template.jinja:/memoryos-inference/smollm2-chat-template.jinja:ro
    cap_add:
      - SYS_NICE
    shm_size: 1g
    memswap_limit: 4g
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 300s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 4g
        reservations:
          memory: 3g

  gateway:
    image: ${MEMORYOS_INFERENCE_GATEWAY_IMAGE:-nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284}
    entrypoint:
      - /bin/sh
      - /memoryos-inference/start-gateway.sh
    depends_on:
      vllm:
        condition: service_started
    secrets:
      - inference_api_key
    ports:
      - 127.0.0.1:${MEMORYOS_INFERENCE_GATEWAY_HOST_PORT:-18088}:8080
    networks:
      - inference
    volumes:
      - ../inference/nginx.conf:/etc/memoryos/nginx.conf:ro
      - ../inference/start-gateway.sh:/memoryos-inference/start-gateway.sh:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=4m,mode=0755
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96m
        reservations:
          memory: 32m

networks:
  inference:
    name: ${MEMORYOS_INFERENCE_NETWORK:-memoryos-inference-research}

secrets:
  inference_api_key:
    file: ${MEMORYOS_INFERENCE_API_KEY_FILE:?Set MEMORYOS_INFERENCE_API_KEY_FILE}

volumes:
  inference_cache:
    name: ${MEMORYOS_INFERENCE_CACHE_VOLUME:-memoryos-inference-cache}
