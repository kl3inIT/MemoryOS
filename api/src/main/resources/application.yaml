arconia:
  multitenancy:
    resolution:
      fixed:
        enabled: true
        tenant-identifier: ${MEMORYOS_TENANT_ID}

spring:
  config:
    import:
      - classpath:/memoryos-observability.yaml
      - classpath:/memoryos-search.yaml
  application:
    name: memoryos-api
  main:
    keep-alive: true
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: ${memoryos.chat.stream.connection-timeout:10m}
    problemdetails:
      enabled: true
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  datasource:
    url: ${MEMORYOS_DATABASE_URL}
    username: ${MEMORYOS_DATABASE_USERNAME}
    password: ${MEMORYOS_DATABASE_PASSWORD}
    hikari:
      # A fixed-size pool, which is what HikariCP recommends: creating a connection is slow and it
      # would happen exactly when load arrives. Idle backends are cheap on the PostgreSQL side.
      #
      # The size follows the pool-sizing formula, (cores x 2) + effective spindles. The production
      # node has 12 vCPU on SSD, so about 25 connections may usefully work at once against this
      # database; api takes 15 and worker 10. Past that point throughput falls rather than rises,
      # because the server spends its time switching between backends and contending for locks.
      # Queueing in the application is the better place to wait.
      pool-name: memoryos-api
      maximum-pool-size: ${MEMORYOS_DATABASE_POOL_SIZE:15}
      minimum-idle: ${MEMORYOS_DATABASE_POOL_SIZE:15}
      # Fail while a caller is still waiting rather than after it has given up.
      connection-timeout: ${MEMORYOS_DATABASE_CONNECTION_TIMEOUT:10000}
      # Retire a connection before anything between here and PostgreSQL decides to drop it.
      max-lifetime: ${MEMORYOS_DATABASE_CONNECTION_LIFETIME:1500000}
      # Prints the stack trace of whoever borrowed a connection and never gave it back. A leak is
      # otherwise indistinguishable from load: the pool is empty and nothing is running.
      leak-detection-threshold: ${MEMORYOS_DATABASE_LEAK_THRESHOLD:60000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
  flyway:
    enabled: true
  data:
    redis:
      # Chat reply replay (MEM-26). Commands are short and non-blocking, so the shared Lettuce connection serves them.
      host: ${MEMORYOS_REDIS_HOST:localhost}
      port: ${MEMORYOS_REDIS_PORT:6379}
      username: ${MEMORYOS_REDIS_USERNAME:}
      password: ${MEMORYOS_REDIS_PASSWORD:}
      connect-timeout: ${MEMORYOS_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${MEMORYOS_REDIS_COMMAND_TIMEOUT:2s}
      ssl:
        enabled: ${MEMORYOS_REDIS_SSL_ENABLED:false}
      repositories:
        enabled: false
      lettuce:
        shutdown-timeout: 1s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${MEMORYOS_IDENTITY_ISSUER}
          jwk-set-uri: ${MEMORYOS_IDENTITY_JWK_SET_URI}
      client:
        registration:
          memoryos:
            provider: memoryos
            client-id: ${MEMORYOS_BROWSER_CLIENT_ID:memoryos-web}
            client-secret: ${MEMORYOS_BROWSER_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid
        provider:
          memoryos:
            issuer-uri: ${MEMORYOS_IDENTITY_ISSUER}
  session:
    jdbc:
      initialize-schema: never
      table-name: spring_session

springdoc:
  api-docs:
    enabled: false

embabel:
  agent:
    platform:
      llm-operations:
        data-binding:
          max-attempts: 2
  models:
    default-llm: ${memoryos.chat.persona.model:gpt-5-mini}

# Native framework diagnostics include prompts, tool arguments/results and binding errors.
# Keep native observations (sanitized at the tool boundary) and MemoryOS lifecycle/failure logs.
logging:
  level:
    Embabel: OFF
    com.embabel: OFF

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${MEMORYOS_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${MEMORYOS_SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      # Redis holds only Chat replay; a Redis outage degrades resume to history and must not mark the API down.
      enabled: false

memoryos:
  chat:
    provider:
      api-key: ${MEMORYOS_CHAT_API_KEY:${SPRING_AI_OPENAI_API_KEY:}}
      base-url: ${MEMORYOS_CHAT_BASE_URL:https://api.openai.com/v1}
    catalog:
      encryption-key: ${MEMORYOS_CHAT_CATALOG_ENCRYPTION_KEY:}
    execution:
      concurrency: 8
      # No total turn deadline, as Onyx: a renewed lease detects a dead process; providers get a read-gap timeout.
      lease-ttl: 30m
      lease-renewal: 60s
      provider-read-timeout: 60s
      max-cycles: 6
      # Room reserved for the answer when the input budget is computed (Onyx GEN_AI_NUM_RESERVED_OUTPUT_TOKENS).
      # As Onyx, input is bounded by the model's window; context-token-limit and mcp-call-limit are optional caps.
      max-output-tokens: 1024
      # Bounds the Redis replay buffer, not the model.
      max-answer-characters: 1000000
      mcp-call-timeout: 60s
    interpreter:
      # Empty: Code Interpreter is absent. Staging sets both through Compose and the launcher.
      base-url: ${MEMORYOS_INTERPRETER_BASE_URL:}
      api-key: ${MEMORYOS_INTERPRETER_API_KEY:}
    storage:
      # How much one person's file library may hold; 0 means no limit. The deployment sets it, not an
      # administrator: 512 MiB by default, changed by the environment and read when the API starts.
      library-bytes: ${MEMORYOS_CHAT_STORAGE_LIBRARY_BYTES:536870912}
  identity:
    audience: ${MEMORYOS_IDENTITY_AUDIENCE}
    jit:
      allowed-provider-aliases: ${MEMORYOS_JIT_ALLOWED_PROVIDER_ALIASES:}
    keycloak:
      admin:
        server-url: ${MEMORYOS_KEYCLOAK_ADMIN_SERVER_URL}
        realm: memoryos
        client-id: memoryos-user-provisioner
        client-secret: ${MEMORYOS_KEYCLOAK_ADMIN_CLIENT_SECRET}
        action-client-id: ${MEMORYOS_BROWSER_CLIENT_ID:memoryos-web}
        action-redirect-uri: ${MEMORYOS_INVITATION_ACTIVATION_REDIRECT_URI}
        connect-timeout: 2s
        connection-request-timeout: 1s
        read-timeout: 5s
  browser:
    registration-id: memoryos
  mcp:
    credential-encryption-key: ${MEMORYOS_MCP_CREDENTIAL_ENCRYPTION_KEY:}
    # HTTPS (or loopback HTTP) ending in /login/oauth2/code/mcp; registered with each OAuth client.
    redirect-uri: ${MEMORYOS_MCP_REDIRECT_URI:}
    connect-timeout: 5s
    # Upper bound per MCP request; Chat turns further cap it by their remaining deadline.
    request-timeout: 30s
  google-drive:
    credential-encryption-key: ${MEMORYOS_GOOGLE_DRIVE_CREDENTIAL_ENCRYPTION_KEY:}
    credential-key-version: ${MEMORYOS_GOOGLE_DRIVE_CREDENTIAL_KEY_VERSION:}
    redirect-uri: ${MEMORYOS_GOOGLE_DRIVE_REDIRECT_URI:}
    authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    revocation-uri: https://oauth2.googleapis.com/revoke
    issuer-uri: https://accounts.google.com
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
    drive-api-base-url: https://www.googleapis.com/drive/v3
    sheets-api-base-url: https://sheets.googleapis.com/v4
    docs-api-base-url: https://docs.googleapis.com/v1
    admin-api-base-url: https://admin.googleapis.com/admin/directory/v1
    group-sync-interval: ${MEMORYOS_GOOGLE_DRIVE_GROUP_SYNC_INTERVAL:PT1H}
  sharepoint:
    credential-encryption-key: ${MEMORYOS_SHAREPOINT_CREDENTIAL_ENCRYPTION_KEY:}
    credential-key-version: ${MEMORYOS_SHAREPOINT_CREDENTIAL_KEY_VERSION:}
    authority: https://login.microsoftonline.com
    graph-base-url: https://graph.microsoft.com/v1.0
    connect-timeout: 3s
    request-timeout: 30s
    acquisition-timeout: 15s
    max-requests: 64
    max-response-bytes: 1048576
  invitation:
    time-to-live: ${MEMORYOS_INVITATION_TTL:72h}
  initial-tenant:
    id: ${MEMORYOS_TENANT_ID}
    owner-subject: ${MEMORYOS_INITIAL_OWNER_SUBJECT}
    slug: ${MEMORYOS_TENANT_SLUG}
    display-name: ${MEMORYOS_TENANT_DISPLAY_NAME}
    change-reference: ${MEMORYOS_INITIAL_TENANT_CHANGE_REFERENCE}
  object-storage:
    upload:
      lifetime: ${MEMORYOS_OBJECT_UPLOAD_LIFETIME:15m}
      verification-lease: ${MEMORYOS_OBJECT_UPLOAD_VERIFICATION_LEASE:30s}
      adoption-timeout: ${MEMORYOS_OBJECT_UPLOAD_ADOPTION_TIMEOUT:5m}
      cleanup-lease: ${MEMORYOS_OBJECT_UPLOAD_CLEANUP_LEASE:1m}
      cleanup-batch-size: ${MEMORYOS_OBJECT_UPLOAD_CLEANUP_BATCH_SIZE:16}
    s3:
      service-endpoint: ${MEMORYOS_OBJECT_STORAGE_SERVICE_ENDPOINT}
      upload-endpoint: ${MEMORYOS_OBJECT_STORAGE_UPLOAD_ENDPOINT}
      region: ${MEMORYOS_OBJECT_STORAGE_REGION:us-east-1}
      bucket: ${MEMORYOS_OBJECT_STORAGE_BUCKET:memoryos}
      access-key: ${MEMORYOS_OBJECT_STORAGE_ACCESS_KEY}
      secret-key: ${MEMORYOS_OBJECT_STORAGE_SECRET_KEY}
      path-style-access: ${MEMORYOS_OBJECT_STORAGE_PATH_STYLE_ACCESS:true}
      readiness-key: ${MEMORYOS_OBJECT_STORAGE_READINESS_KEY:system/readiness}
      authorization-lifetime: ${MEMORYOS_OBJECT_UPLOAD_AUTHORIZATION_LIFETIME:10m}
      connect-timeout: ${MEMORYOS_OBJECT_STORAGE_CONNECT_TIMEOUT:2s}
      read-timeout: ${MEMORYOS_OBJECT_STORAGE_READ_TIMEOUT:30s}
