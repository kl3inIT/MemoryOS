spring:
  application:
    name: memoryos-api
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${MEMORYOS_DATABASE_URL}
    username: ${MEMORYOS_DATABASE_USERNAME}
    password: ${MEMORYOS_DATABASE_PASSWORD}
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${MEMORYOS_IDENTITY_ISSUER}
          jwk-set-uri: ${MEMORYOS_IDENTITY_JWK_SET_URI}
      client:
        registration:
          memoryos:
            provider: memoryos
            client-id: ${MEMORYOS_BROWSER_CLIENT_ID:memoryos-web}
            client-secret: ${MEMORYOS_BROWSER_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid
        provider:
          memoryos:
            issuer-uri: ${MEMORYOS_IDENTITY_ISSUER}
  session:
    jdbc:
      initialize-schema: never
      table-name: spring_session

springdoc:
  api-docs:
    enabled: false

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${MEMORYOS_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${MEMORYOS_SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health

memoryos:
  identity:
    audience: ${MEMORYOS_IDENTITY_AUDIENCE}
    keycloak:
      admin:
        server-url: ${MEMORYOS_KEYCLOAK_ADMIN_SERVER_URL}
        realm: ${MEMORYOS_KEYCLOAK_ADMIN_REALM:memoryos}
        client-id: ${MEMORYOS_KEYCLOAK_ADMIN_CLIENT_ID:memoryos-user-provisioner}
        client-secret: ${MEMORYOS_KEYCLOAK_ADMIN_CLIENT_SECRET}
        action-client-id: ${MEMORYOS_BROWSER_CLIENT_ID:memoryos-web}
        action-redirect-uri: ${MEMORYOS_INVITATION_ACTIVATION_REDIRECT_URI}
        connect-timeout: ${MEMORYOS_KEYCLOAK_ADMIN_CONNECT_TIMEOUT:2s}
        connection-request-timeout: ${MEMORYOS_KEYCLOAK_ADMIN_CONNECTION_REQUEST_TIMEOUT:1s}
        read-timeout: ${MEMORYOS_KEYCLOAK_ADMIN_READ_TIMEOUT:5s}
  browser:
    registration-id: memoryos
  invitation:
    time-to-live: ${MEMORYOS_INVITATION_TTL:72h}
  initial-organization:
    owner-subject: ${MEMORYOS_INITIAL_OWNER_SUBJECT}
    slug: ${MEMORYOS_ORGANIZATION_SLUG}
    display-name: ${MEMORYOS_ORGANIZATION_DISPLAY_NAME}
    change-reference: ${MEMORYOS_INITIAL_ORGANIZATION_CHANGE_REFERENCE}