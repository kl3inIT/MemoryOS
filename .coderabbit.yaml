language: vi-VN
tone_instructions: >-
  Review ngắn gọn bằng tiếng Việt; giữ nguyên symbol và API bằng tiếng Anh.
  Ưu tiên correctness, security boundaries và bằng chứng có thể kiểm tra; bỏ qua lời khen và góp ý chỉ về style.

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: true
  review_progress: true
  fail_commit_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  suggested_reviewers: false
  poem: false
  path_filters:
    - "!**/build/**"
    - "!.gradle/**"
    - "!gradle/wrapper/gradle-wrapper.jar"
    - "!docs/**"
  path_instructions:
    - path: "core/src/main/java/**/*.java"
      instructions: >-
        Enforce Spring Modulith capability boundaries. Capability-owned persistence must stay under
        that capability's persistence package and must not be imported by another capability.
        Flag any path that can expose unauthorized content, metadata, title, citation, or ranking signals.
    - path: "core/src/test/java/**/*.java"
      instructions: >-
        Require tests to defend observable architecture or security contracts and to fail for a plausible regression.
        Reject source-text assertions and implementation-detail tests.
    - path: "api/**"
      instructions: >-
        Keep API code as a thin HTTP composition root. Flag business logic, capability-owned persistence,
        credentials, or provider-specific logic placed in this module.
    - path: "worker/**"
      instructions: >-
        Keep worker code as a thin background-processing composition root. Flag in-process assumptions that
        prevent durable jobs, retries, or independent deployment once processing is introduced.
    - path: "**/*.gradle.kts"
      instructions: >-
        Verify the dependency direction core <- api and core <- worker, Java 25 compatibility, reproducible builds,
        and that core never depends on a deployable module.
    - path: ".github/**"
      instructions: >-
        Verify least-privilege permissions, pinned current action majors, valid Dependabot ecosystems,
        and that CI runs the complete architecture and test gate.
    - path: ".omp/**"
      instructions: >-
        Treat these as project-local agent settings. Reject credentials, non-local MCP endpoints added without reason,
        global side effects, or instructions contradicting repository architecture.
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    drafts: false
    labels:
      - "!wip"
    ignore_title_keywords:
      - "WIP"
      - "DO NOT REVIEW"

chat:
  auto_reply: true
