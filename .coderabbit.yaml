language: vi-VN
tone_instructions: >-
  Review ngắn gọn bằng tiếng Việt; giữ nguyên symbol và API bằng tiếng Anh.
  Ưu tiên correctness, security boundaries và bằng chứng có thể kiểm tra; bỏ qua lời khen và góp ý chỉ về style.

reviews:
  path_instructions:
    - path: "**/chat/**"
      instructions: >-
        Provider endpoint HTTP và private/loopback host được chấp nhận có chủ đích cho model nội bộ.
        MODELS_MANAGE là quyền quản trị endpoint tin cậy; không đề xuất bắt buộc HTTPS hoặc cấm private host cho luồng này.
        Vẫn báo lỗi nếu actor thiếu quyền cấu hình được endpoint, hoặc credential bị lộ qua response/log hay gửi sai endpoint đã cấu hình.
        Chính sách và tradeoff được ghi tại docs/specs/chat-models.md phần Credentials and provider extension.
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: true
  review_progress: true
  fail_commit_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  suggested_reviewers: false
  poem: false
  path_filters:
    - "!**/build/**"
    - "!.gradle/**"
    - "!gradle/wrapper/gradle-wrapper.jar"
    - "!**/*.md"
    - "!gradlew"
    - "!gradlew.bat"
  auto_review:
    enabled: true
    base_branches:
      - "^feat/mem-11-production-chat$"
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    drafts: false
    labels:
      - "!wip"
    ignore_title_keywords:
      - "WIP"
      - "DO NOT REVIEW"

chat:
  auto_reply: true
