language: vi-VN
tone_instructions: >-
  Review ngắn gọn bằng tiếng Việt; giữ nguyên symbol và API bằng tiếng Anh.
  Ưu tiên correctness, security boundaries và bằng chứng có thể kiểm tra; bỏ qua lời khen và góp ý chỉ về style.

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: true
  review_progress: true
  fail_commit_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  suggested_reviewers: false
  poem: false
  path_filters:
    - "!**/build/**"
    - "!.gradle/**"
    - "!gradle/wrapper/gradle-wrapper.jar"
    - "!**/*.md"
    - "!gradlew"
    - "!gradlew.bat"
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    drafts: false
    labels:
      - "!wip"
    ignore_title_keywords:
      - "WIP"
      - "DO NOT REVIEW"

chat:
  auto_reply: true
