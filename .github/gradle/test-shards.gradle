// CI passes one shard per runner. The catch-all gets every class outside the named groups.
gradle.beforeProject { project ->
    def groups = [
        ':memoryos-core': [
            'core-ai': ['io/memoryos/ai/**'],
            'core-chat': ['io/memoryos/chat/**'],
            'core-connectors': ['io/memoryos/connector/**'],
            'core-architecture': [
                'io/memoryos/CoreDependencyRulesTest.class',
                'io/memoryos/ModulithArchitectureTest.class',
            ],
            'core-retrieval': ['io/memoryos/retrieval/**'],
            'core-main': ['io/memoryos/retrieval/opensearch/OpenSearchRetrievalIntegrationTest.class'],
        ],
        ':memoryos-api': [
            'api-contracts': [
                'io/memoryos/api/OpenApiContractTest.class',
                'io/memoryos/api/*MigrationTest.class',
            ],
            'api-main': [
                'io/memoryos/api/chat/ChatSessionApiIntegrationTest.class',
                'io/memoryos/api/StagingTelemetryIntegrationTest.class',
            ],
        ],
    ][project.path]
    if (groups == null) {
        return
    }
    def shard = project.providers.environmentVariable('BACKEND_TEST_SHARD').get()
    if (project.name != "memoryos-${shard.split('-')[0]}") {
        return // The other module can be configured as a dependency.
    }
    def catchAll = shard.endsWith('-other')
    if (!catchAll && !groups.containsKey(shard)) {
        throw new GradleException("Unknown test shard: ${shard}")
    }

    project.pluginManager.withPlugin('java') {
        project.tasks.named('test', Test) {
            if (catchAll) {
                exclude(groups.values().flatten())
            } else {
                include(groups[shard])
                if (shard == 'core-retrieval') {
                    exclude(groups['core-main'])
                }
            }
        }
    }
}
