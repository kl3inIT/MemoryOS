name: pnpm project
description: Node, pnpm, a warm store and one project's dependencies.

inputs:
  directory:
    description: Directory holding the project's package.json and pnpm-lock.yaml
    required: true

runs:
  using: composite
  steps:
    - name: Set up Node.js 24
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '24'

    - name: Enable pnpm 11.22.0
      shell: bash
      run: |
        corepack enable
        corepack install --global pnpm@11.22.0

    - name: Resolve the pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm downloads
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.directory)) }}
        restore-keys: pnpm-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: pnpm --dir "${{ inputs.directory }}" install --frozen-lockfile
