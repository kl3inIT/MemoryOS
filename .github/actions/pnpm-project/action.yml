name: pnpm project
description: pnpm, its Node.js runtime, a warm store and one project's dependencies.

# pnpm's own CI guidance no longer goes through Corepack, and `pnpm doctor` warns when it finds
# pnpm running under it: Corepack takes over version management and disables `pnpm self-update`.
# This action installs pnpm directly, at the version the project's package.json already pins in
# `packageManager`, and brings its own Node.js — so the toolchain has one source of truth.

inputs:
  directory:
    description: Directory holding the project's package.json and pnpm-lock.yaml
    required: true

runs:
  using: composite
  steps:
    - name: Install pnpm and Node.js
      uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        # An exact release: `node@26` resolves to the newest listed one, whose checksums nodejs.org can publish later
        # (26.13.0 on 2026-10-28), and every job then fails to verify the download.
        runtime: node@26.12.1
        working-directory: ${{ inputs.directory }}
        cache: true
        cache-dependency-path: ${{ inputs.directory }}/pnpm-lock.yaml
        # Every job reads the store; only a main push writes it, so pull requests do not fill the 10 GB Actions cache.
        save-cache: ${{ github.ref == 'refs/heads/main' }}
        # The install below states --frozen-lockfile rather than relying on a default.
        install: false

    - name: Install dependencies
      shell: bash
      run: pnpm --dir "${{ inputs.directory }}" install --frozen-lockfile
