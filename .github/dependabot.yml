version: 2

# Every committed manifest has an owner here, so no ecosystem only hears about a security advisory. Images that
# live outside a Dockerfile or Compose file (the Playwright container in ci.yml, ARG-selected bases) are updated by
# hand with their package: the Playwright image must match @playwright/test.
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # One review per risk class: patch and minor upgrades land together, majors stay separate.
    groups:
      gradle-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directories:
      - /web
      - /landing
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # The archify skill lockfile is committed, so security alerts land on it; without this
  # ecosystem Dependabot reports them without ever opening a fixing pull request.
  - package-ecosystem: npm
    directory: /.skills/archify
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      skills-npm:
        patterns:
          - "*"

  - package-ecosystem: uv
    directories:
      - /interpreter/service
      - /interpreter/executor
    schedule:
      interval: weekly
      day: monday
      time: "09:35"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      uv-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /
      - /web
      - /landing
      - /interpreter/service
      - /interpreter/executor
      - /infrastructure/keycloak
      - /infrastructure/deployment/ocr
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 10
    labels:
      - dependencies

  - package-ecosystem: docker-compose
    directories:
      - /infrastructure/deployment
      - /infrastructure/observability
    schedule:
      interval: weekly
      day: monday
      time: "09:25"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      compose-minor-and-patch:
        update-types:
          - minor
          - patch

  # "/" covers .github/workflows; composite actions under .github/actions need their own entry.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
