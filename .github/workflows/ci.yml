name: CI

"on":
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'tools/visual-paradigm-mcp/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'tools/visual-paradigm-mcp/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      web: ${{ steps.scope.outputs.web }}
      landing: ${{ steps.scope.outputs.landing }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Map changed files to verification areas
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          backend=true
          web=true
          landing=true
          # Main pushes always verify and publish every area. A pull request selects areas from its merge
          # commit, whose first parent is the base branch tip; unknown paths or an empty diff select all.
          if [[ "$EVENT_NAME" == pull_request ]]; then
            mapfile -t changed < <(git diff --name-only HEAD^1 HEAD)
            if (( ${#changed[@]} > 0 )); then
              backend=false
              web=false
              landing=false
              for path in "${changed[@]}"; do
                # Mirror paths-ignore: only root-level Markdown is documentation; nested .md can be source.
                if [[ "$path" != */* && "$path" == *.md ]]; then
                  continue
                fi
                case "$path" in
                  docs/*|tools/visual-paradigm-mcp/*)
                    ;;
                  openapi.yml)
                    backend=true
                    web=true
                    ;;
                  infrastructure/deployment/compose.landing.yaml)
                    backend=true
                    landing=true
                    ;;
                  core/*|connector/*|api/*|worker/*|gradle/*|build.gradle.kts|settings.gradle.kts|gradle.properties|gradlew|gradlew.bat|Dockerfile|infrastructure/*)
                    backend=true
                    ;;
                  web/*)
                    web=true
                    ;;
                  landing/*)
                    landing=true
                    ;;
                  *)
                    backend=true
                    web=true
                    landing=true
                    ;;
                esac
              done
            fi
          fi
          printf 'backend=%s\nweb=%s\nlanding=%s\n' "$backend" "$web" "$landing" >> "$GITHUB_OUTPUT"
          printf 'Verification areas: backend=%s web=%s landing=%s\n' "$backend" "$web" "$landing" >> "$GITHUB_STEP_SUMMARY"

  check:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate workflows and shell scripts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          shellcheck infrastructure/deployment/deploy-staging.sh

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Build and verify
        run: ./gradlew clean check --no-daemon

      - name: Verify Grafana SSO credential boundary
        run: python3 -m unittest discover -s infrastructure/observability -p 'test_*.py'

      - name: Verify Search administration and certificate renewal
        run: python3 -m unittest discover -s infrastructure/opensearch -p 'test_*.py'

      - name: Verify staging deployment boundaries
        run: python3 -m unittest discover -s infrastructure/deployment -p 'test_*.py'

      - name: Upload backend test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-tests
          path: |
            core/build/test-results/test/*.xml
            connector/build/test-results/test/*.xml
            api/build/test-results/test/*.xml
            worker/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 7

  frontend-check:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Enable pnpm 11.22.0
        run: |
          corepack enable
          corepack install --global pnpm@11.22.0

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      # Static, unit and build gate; it needs no browser, so it runs outside the Playwright container.
      - name: Verify frontend
        run: pnpm --dir web check

      - name: Upload frontend unit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-check-reports
          path: web/reports/
          if-no-files-found: warn
          retention-days: 7

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Playwright's CI guidance: one worker per runner, scale with shards. fullyParallel splits by test.
        shard: [1, 2, 3, 4]
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Enable pnpm 11.22.0
        run: |
          corepack enable
          corepack install --global pnpm@11.22.0

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Exercise browser states
        run: pnpm --dir web test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload shard blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: web/blob-report/
          if-no-files-found: warn
          retention-days: 1

  # Not a gate: merges the shard blob reports (with their traces, screenshots and videos) into one HTML report.
  frontend-report:
    needs: [changes, frontend]
    if: ${{ !cancelled() && needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Enable pnpm 11.22.0
        run: |
          corepack enable
          corepack install --global pnpm@11.22.0

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Download shard blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: web/all-blob-reports

      - name: Merge browser reports
        run: pnpm --dir web exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged browser report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-tests
          path: web/playwright-report/
          if-no-files-found: warn
          retention-days: 7

  frontend-image:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve image and Sentry build configuration
        id: config
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          sentry=false
          if [[ -n "$SENTRY_AUTH_TOKEN" && -n "$SENTRY_ORG" && -n "$SENTRY_PROJECT" ]]; then
            sentry=true
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            echo "Sentry source-map configuration is required for a main release." >&2
            exit 1
          fi
          printf 'sentry=%s\nbuild-date=%s\n' "$sentry" "$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Layers are cached in the Actions cache; the source-map upload step still reruns for every commit
      # because SENTRY_RELEASE is part of its cache key.
      - name: Build production frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: web/Dockerfile
          tags: memoryos-web:sha-${{ github.sha }}
          load: true
          provenance: false
          sbom: false
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.config.outputs.build-date }}
            SENTRY_ORG=${{ steps.config.outputs.sentry == 'true' && vars.SENTRY_ORG || '' }}
            SENTRY_PROJECT=${{ steps.config.outputs.sentry == 'true' && vars.SENTRY_PROJECT || '' }}
            SENTRY_RELEASE=${{ steps.config.outputs.sentry == 'true' && github.sha || '' }}
          secrets: ${{ steps.config.outputs.sentry == 'true' && format('sentry_auth_token={0}', secrets.SENTRY_AUTH_TOKEN) || '' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Verify and preserve the frontend image
        run: |
          if docker run --rm --entrypoint /bin/sh "memoryos-web:sha-$GITHUB_SHA" \
            -c 'find /usr/share/nginx/html -type f -name "*.map" -print -quit | grep -q .'; then
            echo "Public source maps must not be present in the frontend image." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            mkdir -p candidate
            docker save --output candidate/web.tar "memoryos-web:sha-$GITHUB_SHA"
          fi

      - name: Preserve verified frontend image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-web
          path: candidate/web.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 7

  landing:
    needs: changes
    if: ${{ needs.changes.outputs.landing == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate the landing smoke script
        run: shellcheck landing/scripts/smoke-image.sh

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Enable pnpm 11.22.0
        run: |
          corepack enable
          corepack install --global pnpm@11.22.0

      - name: Install landing dependencies
        run: pnpm --dir landing install --frozen-lockfile

      - name: Verify landing page
        run: pnpm --dir landing check

      - name: Build and exercise the landing image
        run: |
          docker build --tag "memoryos-landing:sha-$GITHUB_SHA" \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(git show -s --format=%cI HEAD)" landing
          bash landing/scripts/smoke-image.sh "memoryos-landing:sha-$GITHUB_SHA"
          MEMORYOS_LANDING_IMAGE="memoryos-landing:sha-$GITHUB_SHA" \
            docker compose --file infrastructure/deployment/compose.landing.yaml config --quiet
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            mkdir -p candidate
            docker save --output candidate/landing.tar "memoryos-landing:sha-$GITHUB_SHA"
          fi

      - name: Upload landing test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: landing-tests
          path: landing/reports/
          if-no-files-found: warn
          retention-days: 7

      # Named outside candidate-* so the application publication never downloads it.
      - name: Preserve verified landing image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: landing-image
          path: candidate/landing.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 7

  backend-images:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve image metadata
        id: meta
        run: printf 'build-date=%s\n' "$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Both targets share the Gradle build stage; each keeps its own cache scope and reads the other's.
      - name: Build production API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: api
          tags: memoryos-api:sha-${{ github.sha }}
          load: true
          provenance: false
          sbom: false
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build-date }}
          cache-from: |
            type=gha,scope=backend-api
            type=gha,scope=backend-worker
          cache-to: type=gha,mode=max,scope=backend-api

      - name: Build production worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: worker
          tags: memoryos-worker:sha-${{ github.sha }}
          load: true
          provenance: false
          sbom: false
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build-date }}
          cache-from: |
            type=gha,scope=backend-api
            type=gha,scope=backend-worker
          cache-to: type=gha,mode=max,scope=backend-worker

      - name: Save backend images for publication
        if: ${{ github.event_name == 'push' }}
        run: |
          mkdir -p candidate
          docker save --output candidate/backend.tar "memoryos-api:sha-$GITHUB_SHA" "memoryos-worker:sha-$GITHUB_SHA"

      - name: Preserve verified backend images
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-backend
          path: candidate/backend.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 7

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan history with a checksum-pinned scanner
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

  gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [changes, check, frontend-check, frontend, frontend-image, backend-images, landing, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every selected job to succeed and every unselected job to be skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          # An area job may be skipped only when change detection succeeded and did not select that area.
          jq --exit-status '
            . as $jobs
            | ($jobs.changes.outputs // {}) as $area
            | def selected(name; jobs): if $area[name] == "true"
                then all(jobs[]; $jobs[.].result == "success")
                else all(jobs[]; $jobs[.].result == "skipped") end;
            ($jobs | keys) == ["backend-images", "changes", "check", "frontend", "frontend-check", "frontend-image", "landing", "secrets"]
            and $jobs.changes.result == "success"
            and $jobs.secrets.result == "success"
            and selected("backend"; ["check", "backend-images"])
            and selected("web"; ["frontend-check", "frontend", "frontend-image"])
            and selected("landing"; ["landing"])
          ' <<< "$RESULTS"

  publish:
    name: Publish verified release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # Read the verified main revision for the release bundle.
      packages: write # Publish the preserved images to GHCR after CI Gate succeeds.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: candidate-*
          merge-multiple: true
          path: candidate
      - name: Authenticate to GHCR for this job
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish the preserved images and record their digests
        run: |
          docker load --input candidate/backend.tar
          docker load --input candidate/web.tar
          mkdir release
          for component in api worker web; do
            image="memoryos-$component:sha-$GITHUB_SHA"
            docker image inspect "$image" | jq --exit-status --arg sha "$GITHUB_SHA" '
              .[0].Config.Labels | .["org.opencontainers.image.revision"] == $sha
              and .["org.opencontainers.image.source"] == "https://github.com/kl3inIT/MemoryOS"
            '
            repository="ghcr.io/kl3init/memoryos-$component"
            tag="$repository:sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            docker tag "$image" "$tag"
            docker push "$tag"
            digest=$(docker image inspect "$tag" | jq --exit-status --raw-output --arg repo "$repository@" '
              [.[0].RepoDigests[] | select(startswith($repo))] | if length == 1 then .[0] else error("Ambiguous digest") end
            ')
            [[ "$digest" =~ ^ghcr.io/kl3init/memoryos-$component@sha256:[0-9a-f]{64}$ ]]
            printf 'MEMORYOS_%s_IMAGE=%s\n' "${component^^}" "$digest" >> release/images.env
          done
          printf 'MEMORYOS_RELEASE=%s\n' "$GITHUB_SHA" >> release/images.env
          git archive --format=tar --output=release/configuration.tar HEAD infrastructure core/src/main/resources/db/migration
          (cd release && sha256sum configuration.tar images.env > SHA256SUMS)
          jq --null-input --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{repository: "kl3inIT/MemoryOS", sha: $sha, run: $run, attempt: $attempt}' > release/manifest.json
      - name: Preserve release manifest and configuration
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 90
      - name: Remove registry credentials
        if: ${{ always() }}
        run: docker logout ghcr.io

  publish-landing:
    name: Publish landing
    # The landing site is an independent artifact and deployment, so it publishes as
    # soon as its own job and the secret scan pass, without waiting for the app gate.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [landing, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # Required by the workflow token; no repository content is read.
      packages: write # Publish the preserved landing image to GHCR after CI Gate succeeds.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: landing-image
          path: candidate
      - name: Authenticate to GHCR for this job
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish the preserved landing image and record its digest
        run: |
          docker load --input candidate/landing.tar
          image="memoryos-landing:sha-$GITHUB_SHA"
          docker image inspect "$image" | jq --exit-status --arg sha "$GITHUB_SHA" '
            .[0].Config.Labels | .["org.opencontainers.image.revision"] == $sha
            and .["org.opencontainers.image.source"] == "https://github.com/kl3inIT/MemoryOS"
          '
          repository="ghcr.io/kl3init/memoryos-landing"
          tag="$repository:sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag "$image" "$tag"
          docker push "$tag"
          digest=$(docker image inspect "$tag" | jq --exit-status --raw-output --arg repo "$repository@" '
            [.[0].RepoDigests[] | select(startswith($repo))] | if length == 1 then .[0] else error("Ambiguous digest") end
          ')
          [[ "$digest" =~ ^ghcr\.io/kl3init/memoryos-landing@sha256:[0-9a-f]{64}$ ]]
          mkdir landing-release
          printf 'MEMORYOS_LANDING_IMAGE=%s\n' "$digest" > landing-release/landing.env
          # shellcheck disable=SC2016 # The backticks are Markdown code formatting, not a substitution.
          printf '### Landing image\n\n`%s`\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the landing release reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: landing-release-${{ github.sha }}-${{ github.run_attempt }}
          path: landing-release/landing.env
          if-no-files-found: error
          retention-days: 90
      - name: Remove registry credentials
        if: ${{ always() }}
        run: docker logout ghcr.io
