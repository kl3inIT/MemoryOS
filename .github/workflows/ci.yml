name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and verify
        run: ./gradlew clean check --no-daemon

      - name: Verify Grafana SSO credential boundary
        run: python3 -m unittest discover -s infrastructure/observability -p 'test_*.py'

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable pnpm 11.22.0
        run: |
          corepack enable
          corepack install --global pnpm@11.22.0

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Verify frontend
        run: pnpm --dir web check

      - name: Exercise browser states
        run: pnpm --dir web test:e2e

      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: error
          retention-days: 14

  frontend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build production frontend image
        run: docker build --file web/Dockerfile --tag memoryos-web:ci .

  backend-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build production API image
        run: docker build --target api --tag memoryos-api:ci .

      - name: Build production worker image
        run: docker build --target worker --tag memoryos-worker:ci .
