name: Deploy staging

# Staging keeps automatic promotion after a successful main CI run. The delivery logic lives in
# the shared deploy workflow; this file only decides when staging runs and where it points.

"on":
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run containing the verified release
        required: true
        type: string
      recovery_release:
        description: Optional exact healthy pending SHA-run-attempt to finish before deploying; never restores a database
        required: false
        default: ''
        type: string

permissions:
  contents: read # Check out trusted main deployment code.
  actions: read # Verify the source CI run and download its release bundle.
  packages: read # Pull the verified private GHCR images on staging.

concurrency:
  group: memoryos-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (vars.STAGING_AUTO_DEPLOY == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      ci_run_id: ${{ inputs.ci_run_id }}
      recovery_release: ${{ inputs.recovery_release }}
    secrets: inherit
