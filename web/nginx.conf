user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    log_format invitation_redacted '$remote_addr - [$time_local] '
                                     '"$request_method /invite/[redacted]" '
                                     '$status $body_bytes_sent';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_x_forwarded_proto $memoryos_forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    map $http_x_forwarded_host $memoryos_forwarded_host {
        default $http_x_forwarded_host;
        "" $http_host;
    }

    map $uri $memoryos_cache_control {
        ~^/assets/ "public, max-age=31536000, immutable";
        ~^/invite/ "no-store";
        /favicon.svg "public, max-age=86400";
        default "no-cache";
    }

    map $uri $memoryos_referrer_policy {
        ~^/invite/ "no-referrer";
        default "strict-origin-when-cross-origin";
    }

    map "$request_method:$uri" $memoryos_invite_intake_rate_key {
        default "";
        ~^GET:/invite/ $binary_remote_addr;
    }

    map "$request_method:$uri" $memoryos_invitation_mutation_rate_key {
        default "";
        ~^(?:POST|DELETE):/api/invitations(?:/|$) $binary_remote_addr;
    }

    limit_req_zone $memoryos_invite_intake_rate_key
                   zone=memoryos_invite_intake:10m rate=30r/m;
    limit_req_zone $memoryos_invitation_mutation_rate_key
                   zone=memoryos_invitation_mutation:10m rate=30r/m;


    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control $memoryos_cache_control always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ${MEMORYOS_OBJECT_STORAGE_CONNECT_SRC} ${MEMORYOS_SENTRY_CONNECT_SRC}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Referrer-Policy $memoryos_referrer_policy always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), display-capture=(self), geolocation=(), microphone=(self), payment=(), usb=()" always;

        location /assets/ {
            try_files $uri =404;
        }

        # The stock mime.types maps only .js to JavaScript. ES module workers (pdf.js) are emitted as .mjs and
        # browsers refuse to run them as application/octet-stream under nosniff.
        location ~ ^/assets/.+\.mjs$ {
            types { }
            default_type text/javascript;
            try_files $uri =404;
        }

        location = /favicon.svg {
            try_files $uri =404;
        }

        location = /runtime-config.js {
            alias /tmp/runtime-config.js;
            default_type application/javascript;
            add_header Cache-Control "no-store" always;
        }

        location ~* \.map$ {
            return 404;
        }

        location ^~ /invite/ {
            access_log /dev/stdout invitation_redacted;
            limit_req zone=memoryos_invite_intake burst=10 nodelay;
            limit_req_status 429;
            set $memoryos_api http://memoryos-api:8080;
            proxy_pass $memoryos_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $memoryos_forwarded_host;
            proxy_set_header X-Forwarded-Host $memoryos_forwarded_host;
            proxy_set_header X-Forwarded-Proto $memoryos_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # MEM-91 voice WebSockets (dictation and read-aloud). The API bounds idle time (60s and 5m) and
        # session length (10m); this read timeout only has to outlast them. Matched before the general API location.
        location ~ ^/api/chat/voice/(?:transcribe|synthesize)/stream$ {
            set $memoryos_api http://memoryos-api:8080;
            proxy_pass $memoryos_api;
            proxy_http_version 1.1;
            proxy_read_timeout 660s;
            proxy_send_timeout 660s;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $memoryos_forwarded_host;
            proxy_set_header X-Forwarded-Host $memoryos_forwarded_host;
            proxy_set_header X-Forwarded-Proto $memoryos_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # MEM-92 meeting track WebSocket. A track records up to five hours and the API closes it after 60s
        # without audio, but nobody speaking leaves this proxy silent for minutes, so the read timeout has to
        # outlast a quiet room rather than a request. Matched before the general API location.
        location = /api/meeting-stream {
            set $memoryos_api http://memoryos-api:8080;
            proxy_pass $memoryos_api;
            proxy_http_version 1.1;
            proxy_read_timeout 5400s;
            proxy_send_timeout 5400s;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $memoryos_forwarded_host;
            proxy_set_header X-Forwarded-Host $memoryos_forwarded_host;
            proxy_set_header X-Forwarded-Proto $memoryos_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/(?:api|oauth2|login)/|^/logout$|^/actuator/health(?:/|$) {
            limit_req zone=memoryos_invitation_mutation burst=10 nodelay;
            limit_req_status 429;
            set $memoryos_api http://memoryos-api:8080;
            proxy_pass $memoryos_api;
            proxy_http_version 1.1;
            # Google discovery may finish its current bounded acquisition before its overall deadline.
            proxy_read_timeout 300s;
            proxy_set_header Connection "";
            proxy_set_header Host $memoryos_forwarded_host;
            proxy_set_header X-Forwarded-Host $memoryos_forwarded_host;
            proxy_set_header X-Forwarded-Proto $memoryos_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
