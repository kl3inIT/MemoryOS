allowBuilds:
  msw: false
# rehype-katex (through @streamdown/math) asks for katex ^0.16, but the stylesheet comes from the direct
# katex dependency, whose class names changed since 0.16; one version keeps markup and styles in step.
overrides:
  katex: 0.19.0
  # Patched releases for advisories reached only through the shadcn CLI (GHSA-rpw4-54j3-4h4q, GHSA-2vr4-cq9g-pvrc,
  # GHSA-j6r3-76f7-8jcv, GHSA-h3mg-xc3c-68pw, GHSA-hrr3-gc8f-f4qj, GHSA-mrhx-c7xc-m3w5, GHSA-27r3-jxmh-p828,
  # GHSA-333x-w4r6-6crp, GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr, GHSA-xhq7-xmqj-769h); each stays inside the ranges
  # its dependents ask for.
  ip-address: 10.7.3
  fast-uri: 3.1.9
  zod: 4.6.7
  body-parser: 2.4.0
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 can exhaust the stack on a deeply nested pattern, and no patched release exists (2026-10-03).
    # It is reached only through the shadcn CLI (fast-glob > micromatch), run by developers on their own patterns;
    # the browser bundle and the nginx image carry no Node. Remove this once braces 3.0.4 is published.
    - GHSA-vfj7-8cjw-p6xm
minimumReleaseAgeExclude:
  - "@assistant-ui/ai-sdk@0.0.13"
  - "@assistant-ui/core@0.3.29"
  - "@assistant-ui/react@0.15.29"
  - "@assistant-ui/store@0.3.21"
  - assistant-stream@0.3.52
patchedDependencies:
  "@assistant-ui/ai-sdk@0.0.13": patches/@assistant-ui__ai-sdk@0.0.13.patch
