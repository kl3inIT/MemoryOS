[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "memoryos-rag-benchmark"
version = "0.1.0"
description = "MemoryOS retrieval and answer benchmark: measures search, citations, abstention and Group authority"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "MemoryOS" }]
dependencies = [
  "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "mypy>=1.13.0", "ruff>=0.7.0"]

[project.scripts]
rag-benchmark = "rag_benchmark.cli:main"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true

[tool.hatch.build.targets.wheel]
packages = ["rag_benchmark", "memoryos_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# URLs come from the manifest and the operator's configuration, never from a response.
"memoryos_bench/*" = ["S310"]
# Authoring aids hold Vietnamese prompts and docstrings; their URLs are the configured judge endpoint.
"authoring/*" = ["E501", "S310"]
# The promptfoo provider and config hold Vietnamese rubrics; the provider must catch every failure to
# report it on the row.
"promptfoo/*" = ["E501", "BLE001"]

[tool.pytest.ini_options]
pythonpath = ["."]
