[project]
name = "interpreter-eval"
version = "0.1.0"
description = "Evaluates the run_python guidance and the executor's guards with a real model on fixed data tasks"
# Runs with the executor's own environment (interpreter/executor/.venv); scoring and its tests need only the
# standard library.
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM", "S", "BLE"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
