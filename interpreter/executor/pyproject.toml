[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "memoryos-interpreter-executor"
version = "0.1.0"
description = "Dependency bundle for the MemoryOS interpreter executor image"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "MemoryOS" }]
dependencies = [
  "fpdf2==2.8.7",
  "matplotlib>=3.10.6,<3.11",
  "matplotlib-inline>=0.1.7",
  "matplotlib-venn>=1.1.2",
  "numpy==1.26.4",
  "opencv-python>=4.11.0.86",
  "openpyxl>=3.1.5",
  "pandas==2.2.2",
  "pdfplumber>=0.11.7",
  "pydantic>=2.11.9",
  "pypdf==6.13.3",
  "python-docx==1.2.0",
  "python-pptx>=1.0.2",
  "reportlab>=5.0.0",
  "scikit-image>=0.25.2",
  "scikit-learn>=1.7.2",
  "scipy>=1.16.2",
  "seaborn>=0.13.2",
  "svglib>=2.0.2",
  "xgboost>=3.0.5",
  # MemoryOS additions (MEM-110): office, finance and encoding work beyond the Onyx baseline.
  "beautifulsoup4>=4.13",
  "chardet>=5.2",
  "jinja2>=3.1",
  "markdown>=3.8",
  "markitdown[docx,pdf,pptx,xls,xlsx]>=0.1.2",
  "pdf2image>=1.17",
  "pyarrow>=21",
  "statsmodels>=0.14.5",
  "sympy>=1.14",
  "tabulate>=0.9",
  "xlrd>=2.0.2",
  "xlsxwriter>=3.2.9",
]

[tool.uv]
# xgboost pulls the CUDA NCCL wheel (~380 MB) on Linux; executors have no GPU.
override-dependencies = ["nvidia-nccl-cu12; sys_platform == 'never'"]

[tool.hatch.build.targets.wheel]
packages = []
include = [
  "README.md",
]
