<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEM-198 · Phân loại (System One) · prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&display=swap">
<style>
/* Tokens copied from web/src/styles/tokens.css; the prototype uses no other colour. */
:root {
  color-scheme: light dark;
  --surface-canvas: #f0f0f1;
  --surface-base: #fafafa;
  --surface-raised: #ffffff;
  --surface-sunken: #e6e6e9;
  --surface-overlay: #ffffff;
  --surface-scrim: #00000066;
  --content-primary: #000000e5;
  --content-secondary: #000000bf;
  --content-muted: #0000008c;
  --content-disabled: #00000073;
  --border-subtle: #e6e6e6;
  --border-default: #cccccc;
  --action-primary: #1c1c1c;
  --action-primary-hover: #333333;
  --action-primary-content: #ffffff;
  --action-selection: #286df8;
  --focus-ring: #000000;
  --status-success-surface: #e6f2e7;
  --status-success-content: #007a2d;
  --status-success-border: #91d099;
  --status-success-faint: #f8fbf8;
  --status-info-surface: #e7effc;
  --status-info-content: #245fda;
  --status-danger-surface: #fceae7;
  --status-danger-content: #c12222;
  --status-danger-border: #f8a59b;
  --status-danger-faint: #fef7f6;
  --elevation-2: 0 0 0 1px #00000005, 0 4px 8px -2px #00000014, 0 12px 24px -4px #00000014;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface-canvas: #26262b;
    --surface-base: #19191e;
    --surface-raised: #000000;
    --surface-sunken: #323239;
    --surface-overlay: #262626;
    --surface-scrim: #00000099;
    --content-primary: #fffffff2;
    --content-secondary: #ffffffd9;
    --content-muted: #ffffff99;
    --content-disabled: #ffffff73;
    --border-subtle: #333333;
    --border-default: #555555;
    --action-primary: #e9e9e9;
    --action-primary-hover: #cacaca;
    --action-primary-content: #000000e5;
    --focus-ring: #ffffff;
    --status-success-surface: #002207;
    --status-success-content: #48c775;
    --status-success-border: #004214;
    --status-success-faint: #001503;
    --status-info-surface: #091938;
    --status-info-content: #8cb4ff;
    --status-danger-surface: #330b09;
    --status-danger-content: #ff8276;
    --status-danger-border: #5f1a16;
    --status-danger-faint: #210504;
    --elevation-2: 0 1px 2px #00000038, 0 12px 32px #00000047;
  }
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--surface-base);
  color: var(--content-primary);
  font-family: "Hanken Grotesk", "Segoe UI Variable", "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 20px;
  font-weight: 500;
}
h1, h2, p { margin: 0; }
h1 { font-size: 24px; line-height: 36px; font-weight: 600; }
h2 { font-size: 18px; line-height: 28px; font-weight: 600; }
svg, img { flex: none; }
a { color: var(--status-info-content); }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

.shell { display: flex; min-height: 100vh; }
.sidebar {
  flex: none;
  width: 240px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 16px 12px;
  background: var(--surface-canvas);
  border-right: 1px solid var(--border-subtle);
}
.brand { padding: 0 8px; font-size: 16px; line-height: 24px; font-weight: 700; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-label { padding: 0 8px 4px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--content-muted); }
.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 8px;
  border-radius: 8px;
  color: var(--content-secondary);
  text-decoration: none;
  white-space: nowrap;
}
a.nav-item:hover { background: var(--surface-sunken); color: var(--content-primary); }
.nav-item[aria-current="page"] { background: var(--surface-sunken); color: var(--content-primary); font-weight: 600; }

.main { flex: 1 1 auto; min-width: 0; padding: 52px 16px 72px; }
.page { max-width: 872px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
.page-header { display: flex; align-items: center; gap: 12px; color: var(--content-secondary); }
.page-header h1 { color: var(--content-primary); }
.section { display: flex; flex-direction: column; gap: 12px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

.card { border: 1px solid var(--border-subtle); border-radius: 8px; background: var(--surface-raised); }
.card-pad { padding: 16px; }
.divided { padding: 0 16px; }
.divided > * { padding: 16px 0; }
.divided > * + * { border-top: 1px solid var(--border-subtle); }
.muted { color: var(--content-muted); }

.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.row-title { flex: 1 1 160px; min-width: 0; font-weight: 600; }
.row-note { flex: 1 1 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; font-weight: 400; color: var(--content-muted); }
.row-note a { font-weight: 600; }

.picker { position: relative; flex: 2 1 280px; min-width: 0; max-width: 460px; }
.trigger {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  height: 36px;
  padding: 0 12px;
  border: 1px solid var(--border-default);
  border-radius: 8px;
  background: var(--surface-raised);
  color: var(--content-primary);
  font: inherit;
  text-align: left;
}
button.trigger { cursor: pointer; }
.trigger .value { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trigger .chevron { color: var(--content-muted); }
.menu {
  position: absolute;
  top: 40px;
  left: 0;
  right: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 4px;
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  background: var(--surface-overlay);
  box-shadow: var(--elevation-2);
}
.menu-label { padding: 6px 8px 2px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--content-muted); }
.menu-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 36px;
  padding: 6px 8px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--content-primary);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.menu-item:hover { background: var(--surface-canvas); }
.menu-item .value { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.menu-empty { padding: 6px 8px; color: var(--content-muted); }

.pill, .tag, .badge {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 12px;
  line-height: 16px;
  font-weight: 600;
  white-space: nowrap;
}
.pill { background: var(--surface-canvas); color: var(--content-secondary); }
.pill-info { background: var(--status-info-surface); color: var(--status-info-content); }
.tag { border: 1px solid var(--border-subtle); background: var(--surface-base); color: var(--content-secondary); }
.badge { background: var(--status-success-surface); color: var(--status-success-content); }

.conn { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 16px; }
.conn[data-selected] { border-color: var(--action-selection); }
.logo { flex: none; display: grid; place-items: center; width: 36px; height: 36px; color: var(--content-secondary); }
.conn-body { flex: 1 1 200px; min-width: 112px; display: flex; flex-direction: column; gap: 2px; }
.conn-name { font-weight: 600; }
.conn-summary { color: var(--content-muted); overflow-wrap: anywhere; }
.conn-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; margin-left: auto; }

.setting-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.setting-icon { color: var(--content-secondary); }
.setting-body { flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.setting-title { font-weight: 600; }
.setting-value { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--content-muted); overflow-wrap: anywhere; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 36px;
  padding: 0 16px;
  border: 1px solid transparent;
  border-radius: 8px;
  font: inherit;
  font-weight: 600;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
}
.btn-sm { height: 28px; padding: 0 10px; }
.btn-primary { background: var(--action-primary); color: var(--action-primary-content); }
.btn-primary:hover { background: var(--action-primary-hover); }
.btn-secondary { background: var(--surface-base); border-color: var(--border-subtle); color: var(--content-secondary); }
.btn-secondary:hover { background: var(--surface-canvas); border-color: var(--border-default); color: var(--content-primary); }
.btn-tertiary { background: transparent; color: var(--content-secondary); }
.btn-tertiary:hover { background: var(--surface-canvas); color: var(--content-primary); }
.btn-danger { background: transparent; color: var(--status-danger-content); }
.btn-danger:hover { background: var(--status-danger-surface); }
.btn:disabled { background: var(--surface-sunken); border-color: var(--border-subtle); color: var(--content-disabled); cursor: default; }
.btn-tertiary:disabled { background: transparent; border-color: transparent; }

dialog {
  width: calc(100% - 32px);
  max-width: 512px;
  padding: 24px;
  border: 0;
  border-radius: 12px;
  background: var(--surface-overlay);
  color: var(--content-primary);
  box-shadow: var(--elevation-2);
}
dialog::backdrop { background: var(--surface-scrim); }
.form { display: flex; flex-direction: column; gap: 20px; }
.dialog-head { display: flex; align-items: center; gap: 12px; }
.dialog-head h2 { min-width: 0; overflow-wrap: anywhere; }
.fields { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input {
  height: 36px;
  padding: 0 12px;
  border: 1px solid var(--border-default);
  border-radius: 8px;
  background: var(--surface-raised);
  color: var(--content-primary);
  font: inherit;
}
.field input::placeholder { color: var(--content-muted); }
fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 6px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.choice {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 12px;
  border: 1px solid var(--border-default);
  border-radius: 8px;
  cursor: pointer;
}
.choice:has(input:checked) { border-color: var(--action-selection); }
.choice input { margin: 0; accent-color: var(--action-selection); }
.alert { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid; border-radius: 8px; font-weight: 600; }
.alert-success { border-color: var(--status-success-border); background: var(--status-success-faint); color: var(--status-success-content); }
.alert-danger { border-color: var(--status-danger-border); background: var(--status-danger-faint); color: var(--status-danger-content); }
.dialog-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
.dialog-actions .start { margin-right: auto; }
[hidden] { display: none !important; }

@media (max-width: 767px) {
  .shell { flex-direction: column; }
  .sidebar { width: auto; flex-direction: row; gap: 4px; padding: 8px 12px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border-subtle); }
  .brand, .nav-label, .nav-item:not([href]) { display: none; }
  .nav-group { flex-direction: row; gap: 4px; }
  .main { padding-top: 24px; }
  .grid { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<div id="app"></div>

<dialog id="connection-dialog" aria-labelledby="dialog-title">
  <form class="form" id="connection-form">
    <div class="dialog-head">
      <span class="logo" id="dialog-logo"></span>
      <h2 id="dialog-title"></h2>
    </div>
    <div class="fields">
      <div class="field">
        <label for="field-name">Tên</label>
        <input id="field-name" type="text" maxlength="200">
      </div>
      <div class="field" id="endpoint-row">
        <label for="field-endpoint" id="endpoint-label"></label>
        <input id="field-endpoint" type="text" spellcheck="false">
      </div>
      <div class="field">
        <label for="field-key">API key</label>
        <input id="field-key" type="password" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="field-model">Model</label>
        <input id="field-model" type="text" spellcheck="false">
      </div>
      <fieldset>
        <legend>Ranh giới dữ liệu</legend>
        <div class="choices">
          <label class="choice"><input type="radio" name="boundary" value="EXTERNAL">Bên ngoài</label>
          <label class="choice"><input type="radio" name="boundary" value="INTERNAL">Nội bộ</label>
        </div>
      </fieldset>
    </div>
    <div class="alert alert-success" id="test-ok" role="status" hidden></div>
    <div class="alert alert-danger" id="test-fail" role="alert" hidden></div>
    <div class="alert alert-danger" id="delete-blocked" role="alert" hidden></div>
    <div class="dialog-actions">
      <button type="button" class="btn btn-danger start" id="delete-button">Xoá kết nối</button>
      <button type="button" class="btn btn-tertiary" id="test-button">Kiểm tra kết nối</button>
      <button type="button" class="btn btn-secondary" id="close-button">Đóng</button>
      <button type="submit" class="btn btn-primary" id="save-button">Lưu</button>
    </div>
  </form>
</dialog>

      ${navItem(null, "globe", "Tìm kiếm Web")}
      ${navItem(null, "audio", "Giọng nói")}
      ${navItem(null, "image", "Tạo ảnh")}
      ${navItem(null, "terminal", "Code Interpreter")}
      ${navItem("chat", "message", "Chat")}
    </div>
    <div class="nav-group">
      <div class="nav-label">Trợ lý và công cụ</div>
      ${navItem(null, "bot", "Quản lý trợ lý")}
      ${navItem(null, "blocks", "Máy chủ MCP")}
      ${navItem(null, "plug", "MemoryOS MCP")}
    </div>
  </nav>`;
}

function systemOnePage() {
  const now = current();
  const options = state.connections.length
    ? state.connections
        .map(
          (c) => `<button type="button" class="menu-item" data-pick="${c.id}">
            <span class="value">${esc(c.name)} · ${esc(c.model)}</span>
            <span class="tag">${boundaryLabel(c.boundary)}</span>
            ${c.id === state.task ? icon("check") : ""}
          </button>`,
        )
        .join("")
    : `<div class="menu-empty">Chưa có kết nối.</div>`;
  const menu = state.menuOpen
    ? `<div class="menu" id="task-menu">
        <div class="menu-label">LLM</div>
        <button type="button" class="menu-item" data-pick="">
          <span class="value">${LLM_CHECK_MODEL}</span>${now ? "" : icon("check")}
        </button>
        <div class="menu-label">System One</div>
        ${options}
      </div>`
    : "";
  const cards = state.connections.length
    ? state.connections
        .map(
          (c) => `<section class="card conn" aria-label="${esc(c.name)}"${c.id === state.task ? " data-selected" : ""}>
            <span class="logo">${marks[c.type]}</span>
            <div class="conn-body">
              <div class="conn-name">${esc(c.name)}</div>
              <div class="conn-summary">${esc(summary(c))}</div>
            </div>
            <div class="conn-actions">
              <span class="tag">${boundaryLabel(c.boundary)}</span>
              ${c.id === state.task ? `<span class="badge">${icon("checkCircle", 12)}Đang dùng</span>` : ""}
              <button type="button" class="btn btn-tertiary btn-sm" data-edit="${c.id}">${icon("settings", 14)}Cấu hình</button>
            </div>
          </section>`,
        )
        .join("")
    : `<p class="card card-pad muted">Chưa có kết nối.</p>`;
  const types = Object.entries(providers)
    .map(
      ([type, provider]) => `<div class="card conn">
        <span class="logo">${marks[type]}</span>
        <div class="conn-body">
          <div class="conn-name">${provider.name}</div>
          <div class="conn-summary">${provider.subtitle}</div>
        </div>
        <div class="conn-actions">
          <button type="button" class="btn btn-secondary btn-sm" data-add="${type}" aria-label="Kết nối ${provider.name}">Kết nối</button>
        </div>
      </div>`,
    )
    .join("");
  return `<header class="page-header">${icon("split", 24)}<h1>Phân loại (System One)</h1></header>
    <section class="section" aria-label="Tác vụ">
      <h2>Tác vụ</h2>
      <div class="card card-pad row">
        <div class="row-title">${TASK}</div>
        <div class="picker" id="task-picker">
          <button type="button" class="trigger" id="task-trigger" aria-haspopup="true" aria-expanded="${state.menuOpen}" aria-label="${TASK} chạy bằng">
            <span class="pill">${now ? "System One" : "LLM"}</span>
            <span class="value">${now ? `${esc(now.name)} · ${esc(now.model)}` : LLM_CHECK_MODEL}</span>
            ${icon("chevron", 16, "chevron")}
          </button>
          ${menu}
        </div>
        ${now ? `<span class="tag">${boundaryLabel(now.boundary)}</span>` : ""}
        ${state.saved ? `<p class="row-note" role="status">Đã lưu</p>` : ""}
      </div>
    </section>
    <section class="section" aria-label="Kết nối">
      <h2>Kết nối</h2>
      ${cards}
    </section>
    <section class="section" aria-label="Thêm kết nối">
      <h2>Thêm kết nối</h2>
      <div class="grid">${types}</div>
    </section>`;
}

function fakePicker(model, effort) {
  return `<div class="picker"><div class="trigger">
    <span class="value">${model}</span>
    ${effort ? `<span class="pill pill-info">${effort}</span>` : ""}
    ${icon("chevron", 16, "chevron")}
  </div></div>`;
}

function modelsPage() {
  const now = current();
  const note = now
    ? `<p class="row-note" role="status">
        <span class="pill pill-info">System One</span>
        <span>Đang chạy bằng ${esc(now.name)} · ${esc(now.model)}.</span>
        <a href="#systemone">Phân loại (System One)</a>
      </p>`
    : "";
  return `<header class="page-header">${icon("sparkles", 24)}<h1>Mô hình</h1></header>
    <section class="section" aria-label="Mô hình theo tác vụ">
      <h2>Mô hình theo tác vụ</h2>
      <div class="card divided">
        <div class="row"><div class="row-title">Chat</div>${fakePicker("cx/gpt-6-luna")}</div>
        <div class="row"><div class="row-title">Đặt tên cuộc trò chuyện</div>${fakePicker(LLM_CHECK_MODEL)}</div>
        <div class="row"><div class="row-title">${TASK}</div>${fakePicker(LLM_CHECK_MODEL)}${note}</div>
        <div class="row"><div class="row-title">Biên bản họp</div>${fakePicker("cx/gpt-6-luna", "Vừa")}</div>
        <div class="row"><div class="row-title">Sửa transcript</div>${fakePicker("cx/gpt-6-luna")}</div>
      </div>
    </section>`;
}

function chatPage() {
  const now = current();
  const value = now
    ? `<span class="pill pill-info">System One</span><span>${esc(now.name)} · ${esc(now.model)}</span><span class="tag">${boundaryLabel(now.boundary)}</span>`
    : `<span>${LLM_CHECK_MODEL}</span>`;
  return `<header class="page-header">${icon("message", 24)}<h1>Chat</h1></header>
    <div class="card card-pad setting-row">
      <span class="setting-icon">${icon("sparkles")}</span>
      <div class="setting-body">
        <div class="setting-title">Mô hình kiểm tra câu hỏi</div>
        <div class="setting-value">${value}</div>
      </div>
      <a class="btn btn-tertiary btn-sm" href="#${now ? "systemone" : "models"}">Đổi</a>
    </div>`;
}

function render() {
  const pages = { systemone: systemOnePage, models: modelsPage, chat: chatPage };
  document.getElementById("app").innerHTML =
    `<div class="shell">${sidebar()}<main class="main"><div class="page">${pages[state.view]()}</div></main></div>`;
}

function assign(id) {
  state.task = id;
  state.menuOpen = false;
  state.saved = true;
  clearTimeout(savedTimer);
  savedTimer = setTimeout(() => {
    state.saved = false;
    render();
  }, 2000);
  render();
  document.getElementById("task-trigger")?.focus();
}

// The connection dialog keeps its inputs in the page; only their values and the result lines change.
const dialog = document.getElementById("connection-dialog");
const field = (id) => document.getElementById(id);
const boundaryInput = (value) => dialog.querySelector(`input[name="boundary"][value="${value}"]`);

function openDraft(connection, type) {
  const kind = connection ? connection.type : type;
  const provider = providers[kind];
  state.menuOpen = false;
  state.draft = connection
    ? { ...connection, test: null }
    : { id: null, type: kind, boundary: "EXTERNAL", hasKey: false, test: null };
  field("dialog-logo").innerHTML = marks[kind];
  field("dialog-title").textContent = connection ? `Cấu hình ${connection.name}` : `Kết nối ${provider.name}`;
  field("field-name").value = connection?.name ?? (kind === "SYSTEMONE_COMPATIBLE" ? "" : provider.name);
  field("endpoint-row").hidden = !provider.endpointLabel;
  field("endpoint-label").textContent = provider.endpointLabel ?? "";
  field("field-endpoint").type = provider.endpointLabel === "Endpoint" ? "url" : "text";
  field("field-endpoint").placeholder = provider.endpointPlaceholder ?? "";
  field("field-endpoint").value = !connection
    ? ""
    : kind === "CLOUDFLARE"
      ? connection.endpoint.slice(CLOUDFLARE_ACCOUNTS.length)
      : connection.endpoint;
  field("field-model").value = connection?.model ?? provider.model;
  field("field-model").placeholder = provider.modelPlaceholder ?? "";
  field("field-key").value = "";
  field("field-key").placeholder = connection?.hasKey ? "Giữ key hiện tại" : "";
  boundaryInput(state.draft.boundary).checked = true;
  field("delete-button").hidden = !connection;
  field("delete-blocked").hidden = true;
  syncDialog();
  render();
  if (!dialog.open) dialog.showModal();
}

function closeDraft() {
  clearTimeout(testTimer);
  state.draft = null;
  if (dialog.open) dialog.close();
  render();
}

function complete() {
  const draft = state.draft;
  if (!draft) return false;
  const provider = providers[draft.type];
  const endpoint = field("field-endpoint").value.trim();
  if (!field("field-name").value.trim() || !field("field-model").value.trim()) return false;
  if (provider.endpointLabel && !endpoint) return false;
  if (draft.type === "CLOUDFLARE" && !/^[0-9a-f]{32}$/i.test(endpoint)) return false;
  return !provider.keyRequired || draft.hasKey || field("field-key").value.trim() !== "";
}

function syncDialog() {
  const draft = state.draft;
  if (!draft) return;
  const pending = draft.test === "pending";
  field("test-ok").hidden = draft.test !== "ok";
  field("test-fail").hidden = draft.test !== "fail";
  field("test-button").textContent = pending ? "Đang kiểm tra…" : "Kiểm tra kết nối";
  field("test-button").disabled = pending || !complete();
  field("save-button").disabled = pending || !complete();
}

function draftChanged() {
  if (!state.draft) return;
  clearTimeout(testTimer);
  state.draft.test = null;
  field("delete-blocked").hidden = true;
  syncDialog();
}

function runTest() {
  const draft = state.draft;
  if (!draft || !complete()) return;
  draft.test = "pending";
  field("delete-blocked").hidden = true;
  syncDialog();
  clearTimeout(testTimer);
  testTimer = setTimeout(() => {
    if (state.draft !== draft) return;
    const endpoint = field("field-endpoint").value.trim();
    const keyed = draft.hasKey || field("field-key").value.trim() !== "";
    const selfHosted = /\.internal|localhost|\/\/10\.|\/\/172\.|\/\/192\.168\./.test(endpoint);
    if (!keyed && !selfHosted) {
      draft.test = "fail";
      field("test-fail").innerHTML = `${icon("alert")}<span>Endpoint từ chối API key.</span>`;
    } else {
      draft.test = "ok";
      const latency = draft.type === "LAYA" ? 240 : draft.type === "TYPESAFE" ? 520 : /serving/.test(endpoint) ? 64 : 480;
      field("test-ok").innerHTML = `${icon("checkCircle")}<span>Kiểm tra kết nối thành công · ${latency} ms</span>`;
    }
    syncDialog();
  }, 700);
}

function saveDraft() {
  const draft = state.draft;
  if (!draft || !complete()) return;
  const typed = field("field-endpoint").value.trim();
  const record = {
    id: draft.id ?? `c${Date.now()}`,
    type: draft.type,
    name: field("field-name").value.trim(),
    endpoint:
      draft.type === "TYPESAFE"
        ? providers.TYPESAFE.endpoint
        : draft.type === "CLOUDFLARE"
          ? CLOUDFLARE_ACCOUNTS + typed.toLowerCase()
          : typed,
    model: field("field-model").value.trim(),
    boundary: dialog.querySelector('input[name="boundary"]:checked').value,
    hasKey: draft.hasKey || field("field-key").value.trim() !== "",
  };
  state.connections = draft.id
    ? state.connections.map((c) => (c.id === draft.id ? record : c))
    : [...state.connections, record];
  closeDraft();
}

function removeDraft() {
  const draft = state.draft;
  if (!draft?.id) return;
  if (draft.id === state.task) {
    field("delete-blocked").innerHTML = `${icon("alert")}<span>Tác vụ ${TASK} đang dùng kết nối này.</span>`;
    field("delete-blocked").hidden = false;
    return;
  }
  state.connections = state.connections.filter((c) => c.id !== draft.id);
  closeDraft();
}

dialog.addEventListener("input", draftChanged);
// Escape closes the dialog itself; the draft is dropped here unless the dialog was reopened meanwhile.
dialog.addEventListener("close", () => {
  if (state.draft && !dialog.open) closeDraft();
});
field("connection-form").addEventListener("submit", (event) => {
  event.preventDefault();
  saveDraft();
});
field("test-button").addEventListener("click", runTest);
field("close-button").addEventListener("click", closeDraft);
field("delete-button").addEventListener("click", removeDraft);

document.getElementById("app").addEventListener("click", (event) => {
  const target = event.target.closest("button");
  if (!target) return;
  if (target.id === "task-trigger") {
    state.menuOpen = !state.menuOpen;
    render();
    document.getElementById("task-trigger").focus();
  } else if (target.dataset.pick !== undefined) {
    assign(target.dataset.pick);
  } else if (target.dataset.add) {
    openDraft(null, target.dataset.add);
  } else if (target.dataset.edit) {
    openDraft(state.connections.find((c) => c.id === target.dataset.edit));
  }
});
document.addEventListener("click", (event) => {
  if (state.menuOpen && !event.target.closest("#task-picker")) {
    state.menuOpen = false;
    render();
  }
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && state.menuOpen) {
    state.menuOpen = false;
    render();
    document.getElementById("task-trigger")?.focus();
  }
});

function route() {
  const view = location.hash.slice(1);
  state.view = ["systemone", "models", "chat"].includes(view) ? view : "systemone";
  state.menuOpen = false;
  render();
}
window.addEventListener("hashchange", route);
route();

const preset = new URLSearchParams(location.search).get("open") ?? "";
if (preset === "menu") {
  state.menuOpen = true;
  render();
} else if (preset.startsWith("add:") && providers[preset.slice(4)]) {
  openDraft(null, preset.slice(4));
} else if (preset === "edit") {
  openDraft(state.connections[0]);
  state.draft.test = "ok";
  field("test-ok").innerHTML = `${icon("checkCircle")}<span>Kiểm tra kết nối thành công · 480 ms</span>`;
  syncDialog();
}
</script>
</body>
</html>
