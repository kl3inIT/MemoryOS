<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mockup tương tác — Thư viện</title>
<!-- Interactive design mockup with fake data. Tokens mirror web/src/styles/tokens.css (light). -->
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;450;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{--canvas:#f0f0f1;--base:#fafafa;--raised:#fff;--subtle:#f0f0f1;--sunken:#e6e6e9;--c1:#000000e5;--c2:#000000bf;--c3:#0000008c;--b1:#e6e6e6;--b2:#cccccc;--primary:#1c1c1c;--sel:#286df8;
--ok-s:#e6f2e7;--ok-c:#007a2d;--ok-e:#007a2d;--wa-s:#fbeae4;--wa-c:#b54204;--wa-b:#f5a88b;--wa-e:#b54204;--da-s:#fceae7;--da-c:#c12222;--da-b:#f8a59b;--da-e:#c12222;--in-s:#e7effc;--in-c:#245fda;--in-e:#245fda;--ne-e:#5c5c5c;
--e1:0 1px 2px #0000000d;--e2:0 0 0 1px #00000005,0 4px 8px -2px #00000014,0 12px 24px -4px #00000014}
*{box-sizing:border-box}body{margin:0;font-family:"Hanken Grotesk","Segoe UI",sans-serif;font-size:14px;line-height:20px;font-weight:500;color:var(--c1);background:var(--base);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}svg.lucide{width:16px;height:16px;stroke-width:1.75;flex:none}
.app{display:flex;min-height:100vh}
.side{width:240px;flex:none;background:var(--canvas);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;letter-spacing:1px;font-size:22px;padding:4px 8px 16px}
.side a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--c2);cursor:pointer}
.side a.on{background:var(--raised);color:var(--c1);box-shadow:var(--e1)}.side .lbl{color:var(--c3);font-size:12px;padding:18px 10px 4px}
.main{flex:1;min-width:0}.topbar{height:56px;border-bottom:1px solid var(--b1);display:flex;align-items:center;padding:0 16px;gap:10px;color:var(--c2)}
.role{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--c3)}.role .seg{display:flex;background:var(--subtle);border-radius:8px;padding:2px}
.role .seg button{border:0;background:transparent;height:26px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--c2)}.role .seg button.on{background:var(--raised);box-shadow:var(--e1);color:var(--c1)}
.page{padding:36px 32px 64px;max-width:1240px}
.ph{display:flex;justify-content:space-between;gap:16px}.ph h1{font-size:24px;line-height:36px;font-weight:600;margin:0;display:flex;gap:10px;align-items:center}
.ph h1 svg.lucide{width:24px;height:24px}.ph p{margin:4px 0 0 34px;color:var(--c2);font-weight:450}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}
.btn{display:inline-flex;gap:6px;align-items:center;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--b1);background:var(--base);font-weight:600;white-space:nowrap}
.btn:hover{background:var(--subtle);border-color:var(--b2)}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.primary:hover{background:#333}
.btn.danger{background:var(--da-e);border-color:var(--da-e);color:#fff}.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--subtle)}
.btn.icon{width:32px;padding:0;justify-content:center}.btn.sm{height:28px;padding:0 10px;font-size:12px}.btn.sm.icon{width:28px;padding:0}.btn:disabled{opacity:.45;cursor:not-allowed}
.body{display:flex;gap:32px;margin-top:28px}
.rail{width:208px;flex:none;display:flex;flex-direction:column;gap:2px;position:sticky;top:16px;align-self:flex-start}
.tab{display:flex;align-items:center;gap:10px;height:36px;padding:0 8px;border-radius:8px;color:var(--c3);cursor:pointer;user-select:none}
.tab:hover{background:#ffffff99;color:var(--c1)}.tab.on{background:var(--raised);color:var(--c1);box-shadow:var(--e1)}
.tab .n{margin-left:auto;font-size:12px;color:var(--c3)}.tab .dot{margin-left:auto;min-width:18px;height:18px;border-radius:9px;background:var(--da-e);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.sep{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--c3);padding:14px 8px 4px}
.new{font-size:10px;font-weight:700;color:var(--in-c);background:var(--in-s);border-radius:4px;padding:0 5px}
.storage{margin-top:18px;border:1px solid var(--b1);border-radius:12px;padding:12px;background:var(--raised);font-size:12px;color:var(--c2)}
.bar{height:6px;background:var(--sunken);border-radius:3px;margin:8px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--primary);border-radius:3px;transition:width .4s}
.content{flex:1;min-width:0}
.toolbar{display:flex;gap:8px;align-items:center}.search{flex:1;display:flex;gap:8px;align-items:center;height:36px;padding:0 12px;border:1px solid var(--b2);border-radius:8px;background:var(--raised)}
.search input{border:0;outline:0;flex:1;background:transparent}.search:focus-within{border-color:var(--c1)}
select.sel{height:36px;border:1px solid var(--b2);border-radius:8px;background:var(--raised);padding:0 10px}
.chips{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.chip{height:28px;padding:0 12px;border-radius:14px;border:1px solid var(--b1);background:var(--raised);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}.chip .c{font-weight:500;opacity:.7}
.list{border:1px solid var(--b1);border-radius:12px;background:var(--raised);overflow:hidden;margin-top:14px}
.it{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--b1)}.it:first-child{border-top:0}.it:hover{background:#fcfcfc}
.it .acts{opacity:.0;transition:opacity .1s}.it:hover .acts,.it .acts.show{opacity:1}
.thumb{width:40px;height:40px;border-radius:10px;border:1px solid var(--b1);display:grid;place-items:center;background:var(--base);flex:none}
.thumb svg.lucide{width:18px;height:18px;color:var(--c2)}.thumb svg:not(.lucide){width:24px;height:24px}
.nm{font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center}.nm:hover{text-decoration:underline}
.meta{color:var(--c3);font-size:12px;font-weight:400;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}.meta>span+span::before{content:"· ";}
.reason{font-size:12px;color:var(--c2);font-weight:450;margin-top:2px}
.acts{display:flex;gap:4px;align-items:center}
.pill{display:inline-flex;gap:5px;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:500;color:#fff;white-space:nowrap}.pill svg.lucide{width:12px;height:12px}
.pill.ok{background:var(--ok-e)}.pill.in{background:var(--in-e)}.pill.wa{background:var(--wa-e)}.pill.da{background:var(--da-e)}.pill.ne{background:var(--ne-e)}
.soft{display:inline-flex;gap:5px;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap}.soft svg.lucide{width:12px;height:12px}
.soft.ok{background:var(--ok-s);color:var(--ok-c)}.soft.in{background:var(--in-s);color:var(--in-c)}.soft.wa{background:var(--wa-s);color:var(--wa-c)}.soft.da{background:var(--da-s);color:var(--da-c)}.soft.ne{background:var(--subtle);color:var(--c2)}
.mine{font-size:11px;font-weight:600;color:var(--c2);background:var(--subtle);border-radius:4px;padding:0 6px}
.star.on svg{fill:#f5b301;color:#f5b301}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--b1);border-radius:12px;background:var(--raised)}.stats.two{grid-template-columns:repeat(2,1fr)}
.stat{padding:14px 16px;border-left:1px solid var(--b1)}.stat:first-child{border-left:0}.stat .k{display:flex;gap:6px;align-items:center;color:var(--c2);font-size:12px;font-weight:400}
.stat .v{font-size:18px;line-height:28px;font-weight:600;font-variant-numeric:tabular-nums}.stat .s{font-size:12px;color:var(--c3);font-weight:400}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;margin-top:16px;background:var(--wa-s);border:1px solid var(--wa-b);color:var(--wa-c)}
.alert .t{flex:1;color:var(--c2);font-weight:450}.alert .t strong{color:var(--wa-c);font-weight:600;display:block}
.info{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--in-s);color:var(--in-c);font-weight:450;margin-bottom:14px}
.group{margin-top:22px}.group h3{font-size:13px;font-weight:600;margin:0 0 8px;display:flex;gap:8px;align-items:center;color:var(--c2)}.group h3 .h{color:var(--c3);font-weight:400}
.group .list{margin-top:0}
.prog{width:140px}.prog small{font-size:11px;color:var(--c3)}.prog .bar{margin:4px 0 0}.prog .bar>i{background:var(--in-e)}
.ro{display:inline-flex;gap:5px;align-items:center;color:var(--c3);font-size:12px;margin-right:6px}.ro svg.lucide{width:13px;height:13px}
.crumb{display:flex;gap:6px;align-items:center;color:var(--c3);font-size:13px}.crumb a{cursor:pointer}.crumb a:hover{color:var(--c1);text-decoration:underline}.crumb b{color:var(--c1)}
.dh{display:flex;gap:16px;align-items:flex-start;margin-top:16px}.dh .thumb{width:56px;height:56px;border-radius:14px}.dh .thumb svg:not(.lucide){width:32px;height:32px}.dh h1{margin:0;font-size:24px;line-height:32px;font-weight:600}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--b1);margin-top:24px}.tabs a{padding:10px 0;color:var(--c3);font-weight:600;border-bottom:2px solid transparent;cursor:pointer;display:flex;gap:6px}
.tabs a.on{color:var(--c1);border-color:var(--c1)}.tabs a .c{font-weight:500;color:var(--c3)}
.split{display:grid;grid-template-columns:1fr 300px;gap:24px;margin-top:18px}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--raised);border:1px solid var(--b1);border-radius:12px;overflow:hidden}
th{text-align:left;font-size:12px;font-weight:600;color:var(--c3);padding:10px 14px;border-bottom:1px solid var(--b1);background:var(--base);white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--b1);vertical-align:middle}tr:first-child td{border-top:0}.nw{white-space:nowrap}
.fn{display:flex;gap:10px;align-items:center;font-weight:600}.fn small{display:block;font-weight:400;color:var(--c3);font-size:12px;white-space:nowrap}.err{color:var(--da-c);font-size:12px;font-weight:450}
.card{border:1px solid var(--b1);border-radius:12px;background:var(--raised);padding:16px}.card h4{margin:0 0 12px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.kv{display:grid;grid-template-columns:112px 1fr;gap:10px 8px;font-size:13px}.kv dt{color:var(--c3);font-weight:400}.kv dd{margin:0}
.switch{width:30px;height:18px;border-radius:9px;background:var(--b2);position:relative;display:inline-block;vertical-align:middle;border:0;padding:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:7px;background:#fff;transition:left .15s}.switch.on{background:var(--sel)}.switch.on::after{left:14px}
.link{color:var(--sel);font-weight:600;display:inline-flex;gap:5px;align-items:center;cursor:pointer}.note{font-size:12px;color:var(--c3);font-weight:400;margin-top:10px}
.gchip{display:inline-flex;gap:4px;align-items:center;height:24px;padding:0 8px;border-radius:12px;background:var(--subtle);font-size:12px;margin:0 4px 4px 0}
.gchip button{border:0;background:transparent;padding:0;display:grid;place-items:center}
.pgroup{margin-top:20px}.phead{display:flex;gap:10px;align-items:center;padding:6px 2px 10px;cursor:pointer;flex-wrap:wrap}.phead .thumb{width:28px;height:28px;border-radius:7px}.phead .thumb svg:not(.lucide){width:18px;height:18px}
.phead .pm{margin-left:auto;display:flex;gap:18px;color:var(--c3);font-size:12px;flex-wrap:wrap}.phead .pm b{color:var(--c1);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
dl.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 24px;margin:0}dl.facts dt{color:var(--c3);font-size:12px}dl.facts dd{margin:4px 0 0;font-weight:600}
.hint{font-size:13px;color:var(--c2);font-weight:450}.dzone{border-color:var(--da-b)}.dzone h4{color:var(--da-c)}.menu button[disabled]{opacity:.45;cursor:not-allowed}
.flbl{display:block;font-weight:600;font-size:13px;margin:12px 0 6px}
.runerr td{padding:0;background:var(--base)}.runerr .in{padding:12px 14px 14px 48px}.runerr .e{display:grid;grid-template-columns:1fr 200px 140px 120px;gap:8px;padding:6px 0;border-top:1px dashed var(--b1);align-items:center;font-size:13px}.runerr .e:first-child{border-top:0}
.counts{font-size:12px;color:var(--c2);font-weight:450}.counts b{color:var(--c1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:14px}
.gc{border:1px solid var(--b1);border-radius:12px;background:var(--raised);overflow:hidden;cursor:pointer}.gc .pv{height:110px;background:var(--subtle);display:grid;place-items:center}.gc .pv svg.lucide{width:30px;height:30px;color:var(--c3)}
.gc .bt{padding:10px}.gc .bt div{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--primary);color:#fff;margin-top:12px}.selbar .btn{background:#ffffff1a;border-color:#ffffff33;color:#fff}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--subtle);color:var(--c2);margin-top:14px;font-weight:450}
.empty{padding:48px 16px;text-align:center;color:var(--c3)}.empty svg.lucide{width:28px;height:28px;margin-bottom:8px}.empty b{display:block;color:var(--c1);font-size:15px;margin-bottom:4px}
.menuwrap{position:relative;display:inline-block}.menu{position:absolute;right:0;top:calc(100% + 4px);min-width:220px;background:var(--raised);border:1px solid var(--b1);border-radius:10px;box-shadow:var(--e2);padding:4px;z-index:30}
.menu button{display:flex;width:100%;gap:8px;align-items:center;border:0;background:transparent;padding:8px 10px;border-radius:6px;text-align:left;font-weight:500}.menu button:hover{background:var(--subtle)}.menu .sepl{height:1px;background:var(--b1);margin:4px 0}.menu .dz{color:var(--da-c)}
.menu.left{left:0;right:auto}
.scrim{position:fixed;inset:0;background:#00000066;display:grid;place-items:center;z-index:50}.dlg{background:var(--raised);border-radius:14px;box-shadow:var(--e2);width:440px;max-width:92vw;padding:20px}
.dlg.wide{width:760px}.dlg h2{margin:0 0 6px;font-size:18px}.dlg p{margin:0 0 14px;color:var(--c2);font-weight:450}.dlg .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.dlg input[type=text]{width:100%;height:36px;border:1px solid var(--b2);border-radius:8px;padding:0 10px}
.opt{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--b1);border-radius:10px;margin-top:8px;cursor:pointer}.opt.on{border-color:var(--c1);background:var(--base)}
.pvbox{height:380px;border-radius:10px;background:var(--subtle);display:grid;place-items:center;color:var(--c3);margin-top:8px}
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{min-width:280px;max-width:420px;background:var(--primary);color:#fff;border-radius:10px;padding:10px 14px;box-shadow:var(--e2);display:flex;gap:10px;align-items:center;animation:in .2s ease-out}
.toast .grow{font-weight:450}.toast button{background:transparent;border:0;color:#8fb5ff;font-weight:700}@keyframes in{from{transform:translateY(8px);opacity:0}}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--c3);font-size:12px}
.spin{animation:spin 1s linear infinite}
.ltabs{display:flex;align-items:flex-end;gap:4px;border-bottom:1px solid var(--b1);margin-top:24px}
.ltabs a{display:flex;gap:8px;align-items:center;padding:10px 12px;color:var(--c3);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.ltabs a:hover{color:var(--c1)}.ltabs a.on{color:var(--c1);border-color:var(--c1)}.ltabs a .n{font-size:12px;color:var(--c3);font-weight:500}
.ltabs a .dot{min-width:18px;height:18px;border-radius:9px;background:var(--da-e);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.meter{margin-left:auto;display:flex;gap:10px;align-items:center;padding:0 4px 10px;font-size:12px;color:var(--c2);cursor:pointer}.meter .bar{width:90px;margin:0}
.subnav{display:flex;gap:8px;align-items:center;margin-bottom:16px}.seg2{display:flex;background:var(--subtle);border-radius:9px;padding:3px}
.seg2 button{border:0;background:transparent;height:30px;padding:0 14px;border-radius:7px;font-weight:600;color:var(--c2);display:flex;gap:6px;align-items:center}.seg2 button.on{background:var(--raised);box-shadow:var(--e1);color:var(--c1)}
.seg2 .dot{min-width:18px;height:18px;border-radius:9px;background:var(--da-e);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.quiet{margin-left:auto;display:flex;gap:4px}.quiet .btn .n{font-size:12px;color:var(--c3);font-weight:500}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<div id="app"></div><div class="toasts" id="toasts"></div>
<script>
/* ---------- icons ---------- */
const DRIVE='<svg viewBox="0 0 52 52" fill="none"><path d="M7.7 43.9c.4.8 1.1 1.4 1.8 1.8 2.1-2.7 3.6-4.8 4.4-6.3.9-1.5 1.9-3.8 3.1-7-3.3-.4-5.8-.7-7.5-.7-1.7 0-4.2.2-7.6.7 0 .9.2 1.7.7 2.5l5.1 9Z" fill="#0066DA"/><path d="M42.4 45.7c.7-.4 1.4-1.1 1.8-1.8l5.1-8.9c.4-.8.7-1.6.7-2.5-3.4-.4-5.9-.7-7.5-.7-1.7 0-4.3.2-7.5.7 1.2 3.2 2.2 5.5 3.1 6.9.8 1.5 2.3 3.6 4.4 6.3Z" fill="#EA4335"/><path d="M26 16.9c2.5-3 4.2-5.3 5.1-7 .7-1.3 1.6-3.4 2.5-6.3-.7-.4-1.6-.7-2.5-.7H20.9c-.9 0-1.7.3-2.5.7 1.1 3.3 2.1 5.6 2.9 7 .9 1.6 2.4 3.6 4.7 6.3Z" fill="#00832D"/><path d="M34.9 32.5H17.1l-7.5 13.2c.7.4 1.6.7 2.5.7H40c.9 0 1.7-.3 2.5-.7l-7.6-13.2Z" fill="#2684FC"/><path d="M26 16.9 18.4 3.7c-.7.4-1.4 1.1-1.8 1.8L2.7 30c-.4.8-.7 1.6-.7 2.5h15.1L26 16.9Z" fill="#00AC47"/><path d="M35.4 5.5c-.4-.8-1.1-1.4-1.8-1.8L26 16.9l8.9 15.6H50c0-.9-.2-1.7-.7-2.5L35.4 5.5Z" fill="#FFBA00"/></svg>';

function runsTable(s){const runs=D.runs.filter(r=>r.src===s.id);const kinds=s.t==='SP';const lastOk=runs.find(r=>r.st==='DONE'||r.st==='SAME');

function attemptsTable(s){const rows=D.docs.filter(d=>d.src===s.id).map(d=>`<tr><td>${esc(d.name)}</td><td class="nw" style="color:var(--c2)">${d.at}</td><td class="nw">${softState(itemState(d))}</td><td class="nw" style="color:var(--c2)">${d.state==='INDEXING'?'—':d.state==='FAILED'?'12 giây':'4 giây'}</td><td class="err">${d.error||''}</td><td class="nw"><a class="link" data-a="attempt" data-id="${d.id}">Xem chi tiết</a></td></tr>`).join('');
 return `<div style="margin-top:${s.t==='SP'?28:0}px"><b>Lịch sử lập chỉ mục tệp</b></div><table style="margin-top:10px"><thead><tr><th>Tệp</th><th>Bắt đầu</th><th>Trạng thái</th><th>Hoàn tất / thời gian xử lý</th><th>Thông báo lỗi</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6" style="color:var(--c3)">Chưa có lần xử lý.</td></tr>'}</tbody></table>`}
function srcHistory(s){return s.t==='DRIVE'?runsTable(s):s.t==='SP'?runsTable(s)+attemptsTable(s):attemptsTable(s)}
function srcSettings(s,edit){const cards=[];
 if(s.t==='DRIVE')cards.push(`<div class="card"><h4>Thông tin kết nối${isAdmin()&&s.cred==='RECONNECT'?`<button class="btn sm primary" data-a="reconnect" data-id="${s.id}">Kết nối lại Google Drive</button>`:''}</h4><dl class="kv"><dt>Kết nối</dt><dd>${s.cred==='RECONNECT'?'<span class="soft wa">Cần kết nối lại</span>':'<span class="soft ok">Đã kết nối</span>'}</dd></dl></div>`);

 if(isAdmin()){const mg=mgrName(s);cards.push(`<div class="card"><h4>Người quản lý nhóm phụ trách</h4><div class="row"><span class="grow">${mg?`Người phụ trách: ${mg}`:'<span style="color:var(--c3)">Chưa có người phụ trách</span>'}</span>${mg?`<button class="btn sm" data-a="mgrPick" data-id="${s.id}">Đổi người phụ trách</button><button class="btn sm" data-a="mgrClear" data-id="${s.id}">Bỏ người phụ trách</button>`:`<button class="btn sm" data-a="mgrPick" data-id="${s.id}">Chỉ định người phụ trách</button>`}</div><div class="note">Người quản lý phải là quản lý của một nhóm, và gắn nguồn vào các nhóm họ quản lý.</div></div>`)}

const VIEWS={recent:['clock','Gần đây',viewRecent],ready:['folder-open','Tệp của tôi',viewReady],shared:['users','Được chia sẻ với tôi',viewShared],meetings:['mic','Cuộc họp',viewMeetings],

function rail(){const t=v=>{const [icon,label]=VIEWS[v];let extra='';
  if(v==='ready')extra=`<span class="n">${D.files.filter(f=>f.state==='READY').length}</span>`;
  if(v==='pending'){const n=D.files.filter(f=>f.state==='PROCESSING'||f.state==='FAILED').length;if(n)extra=`<span class="n">${n}</span>`}

  return `<div class="tab ${S.view===v?'on':''}" data-a="view" data-v="${v}">${ic(icon)}${label}${extra}</div>`};
 const used=readySize();
 return `<nav class="rail" aria-label="Phần của thư viện">${['recent','ready','shared','meetings'].map(t).join('')}<div class="sep">Tổ chức</div>${['sources','documents'].map(t).join('')}<div class="sep">Của bạn</div>${['starred','pending','trash'].map(t).join('')}
 <div class="storage">Dung lượng<div style="font-weight:600;color:var(--c1);margin-top:2px">${mb(used)} / ${LIMIT} MB</div><div class="bar"><i style="width:${Math.min(100,used/LIMIT*100)}%"></i></div>${D.files.filter(f=>f.state!=='TRASH').length} tệp<div style="margin-top:6px"><a class="link" data-a="largest">Xem tệp lớn nhất</a></div></div></nav>`}

 case 'groups':{const s=byId('sources',d.id);const gs=isAdmin()?D.allGroups:D.myGroups;return wrap(`<h2>Liên kết nhóm</h2><p>${isAdmin()?esc(s.name):'Chọn các nhóm bạn quản lý, hoặc để trống.'}</p>${gs.map(g=>`<div class="opt ${d.pick.includes(g)?'on':''}" data-a="pickGroup" data-v="${g}">${ic(d.pick.includes(g)?'square-check':'square')}${g}</div>`).join('')}`+foot('groupsOk','Lưu liên kết'))}

 case 'settings':return wrap(`<h2>Cài đặt thư viện</h2><dl class="kv" style="margin-top:12px"><dt>Dung lượng</dt><dd>${mb(readySize())} / ${LIMIT} MB</dd><dt>Thùng rác</dt><dd>Giữ 30 ngày</dd><dt>Lưu hội thoại</dt><dd>Không giới hạn</dd></dl><div class="bar" style="margin-top:12px"><i style="width:${Math.min(100,readySize()/LIMIT*100)}%"></i></div><div class="foot"><button class="btn" data-a="largest">${ic('arrow-down-wide-narrow')}Xem tệp lớn nhất</button><button class="btn primary" data-a="closeDlg">Xong</button></div>`);

 case 'meeting':{const m=byId('meetings',d.id);return wrap(`<div class="row"><h2 class="grow">${esc(m.title)}</h2><button class="btn sm ghost icon" data-a="closeDlg">${ic('x')}</button></div><p>${m.dur} · ${m.at}${m.mine?'':' · '+m.reason}</p>

  setTimeout(()=>{const d=D.docs.find(x=>x.id===id);if(d){d.state='READY';render();toast(`${name} đã sẵn sàng để tìm.`)}},2500);return}
