logging:
  level:
    root: INFO
    io.memoryos: ${MEMORYOS_LOG_LEVEL:INFO}
  pattern:
    level: "%5p %kvp"
    correlation: "[${spring.application.name:} trace=%X{traceId:-} span=%X{spanId:-} operation_id=%X{operation_id:-} delivery_id=%X{delivery_id:-} workload=%X{workload:-}] "
management:
  otlp:
    metrics:
      export:
        enabled: false
---
# Every deployed environment exports telemetry to its own stack; MEMORYOS_ENVIRONMENT names it.
spring:
  config:
    activate:
      on-profile: "staging | production"
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service_name: ${spring.application.name}
        environment: ${MEMORYOS_ENVIRONMENT:local}
        release: ${MEMORYOS_RELEASE:unknown}
      stacktrace:
        max-length: 8192
        root: first
management:
  tracing:
    sampling:
      probability: ${MEMORYOS_TRACE_SAMPLING:1.0}
  opentelemetry:
    map-environment-variables: false
    resource-attributes:
      service.name: ${spring.application.name}
      service.version: ${MEMORYOS_RELEASE:unknown}
      deployment.environment.name: ${MEMORYOS_ENVIRONMENT:local}
    tracing:
      export:
        max-queue-size: 2048
        max-batch-size: 256
        schedule-delay: 1s
        timeout: 2s
        otlp:
          endpoint: ${MEMORYOS_OTLP_BASE_URL}/v1/traces
          connect-timeout: 2s
          timeout: 2s
      limits:
        max-attributes: 64
        max-attribute-value-length: 1024
    logging:
      export:
        max-queue-size: 2048
        max-batch-size: 256
        schedule-delay: 1s
        timeout: 2s
        otlp:
          endpoint: ${MEMORYOS_OTLP_BASE_URL}/v1/logs
          connect-timeout: 2s
          timeout: 2s
      limits:
        max-attributes: 64
        max-attribute-value-length: 1024
  otlp:
    metrics:
      export:
        enabled: true
        url: ${MEMORYOS_OTLP_BASE_URL}/v1/metrics
        step: 30s
        aggregation-temporality: cumulative
        connect-timeout: 2s
        read-timeout: 2s
        resource-attributes:
          service.name: ${spring.application.name}
          service.version: ${MEMORYOS_RELEASE:unknown}
          deployment.environment.name: ${MEMORYOS_ENVIRONMENT:local}
  metrics:
    distribution:
      # Every timer a dashboard takes a percentile of; each range bounds its bucket count.
      percentiles-histogram:
        http.server.requests: true
        memoryos.redis.operation.processing: true
        gen_ai.client.operation: true
        memoryos.chat.turn: true
        memoryos.chat.turn.first.text: true
        memoryos.chat.guardrail.check: true
        memoryos.chat.web.request: true
        memoryos.chat.image.request: true
        memoryos.chat.voice.request: true
        memoryos.chat.mcp.call: true
        memoryos.chat.research.phase.duration: true
        memoryos.search.query.duration: true
        memoryos.search.stage.duration: true
        memoryos.search.index.duration: true
        memoryos.operation.initial.queue.wait: true
      minimum-expected-value:
        http.server.requests: 5ms
        memoryos.redis.operation.processing: 5ms
        gen_ai.client.operation: 50ms
        memoryos.chat.turn: 100ms
        memoryos.chat.turn.first.text: 50ms
        memoryos.chat.guardrail.check: 10ms
        memoryos.chat.web.request: 10ms
        memoryos.chat.image.request: 100ms
        memoryos.chat.voice.request: 10ms
        memoryos.chat.mcp.call: 10ms
        memoryos.chat.research.phase.duration: 100ms
        memoryos.search.query.duration: 5ms
        memoryos.search.stage.duration: 1ms
        memoryos.search.index.duration: 5ms
        memoryos.operation.initial.queue.wait: 5ms
      maximum-expected-value:
        http.server.requests: 120s
        memoryos.redis.operation.processing: 120s
        gen_ai.client.operation: 300s
        memoryos.chat.turn: 600s
        memoryos.chat.turn.first.text: 120s
        memoryos.chat.guardrail.check: 30s
        memoryos.chat.web.request: 120s
        memoryos.chat.image.request: 300s
        memoryos.chat.voice.request: 120s
        memoryos.chat.mcp.call: 120s
        memoryos.chat.research.phase.duration: 900s
        memoryos.search.query.duration: 30s
        memoryos.search.stage.duration: 30s
        memoryos.search.index.duration: 120s
        memoryos.operation.initial.queue.wait: 3600s
