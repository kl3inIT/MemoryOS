memoryos:
  search:
    endpoint: ${MEMORYOS_OPENSEARCH_ENDPOINT:http://127.0.0.1:9200}
    username: ${MEMORYOS_OPENSEARCH_USERNAME:}
    password: ${MEMORYOS_OPENSEARCH_PASSWORD:}
    ca-certificate: ${MEMORYOS_OPENSEARCH_CA_CERTIFICATE:}
    # The deployment's serving node (compose.serving.yaml) seeds the first search generation; its key is entered on
    # the Search settings page, as every embedding key is (MEM-216).
    embedding-endpoint: ${MEMORYOS_EMBEDDING_ENDPOINT:}
    model: ${MEMORYOS_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-4B}
    dimensions: ${MEMORYOS_EMBEDDING_DIMENSIONS:2560}
    embedding-batch-size: ${MEMORYOS_EMBEDDING_BATCH_SIZE:32}
    embedding-concurrency: ${MEMORYOS_EMBEDDING_CONCURRENCY:2}
    embedding-timeout: ${MEMORYOS_EMBEDDING_TIMEOUT:10s}
    embedding-retries: ${MEMORYOS_EMBEDDING_RETRIES:2}
    candidate-limit: ${MEMORYOS_SEARCH_CANDIDATE_LIMIT:500}
    keyword-weight: ${MEMORYOS_SEARCH_KEYWORD_WEIGHT:0.5}
    minimum-semantic-score: ${MEMORYOS_SEARCH_MINIMUM_SEMANTIC_SCORE:0.70}
    timeout: ${MEMORYOS_SEARCH_TIMEOUT:30s}
    index-prefix: ${MEMORYOS_SEARCH_INDEX_PREFIX:memoryos-chunks}
    replicas: ${MEMORYOS_SEARCH_REPLICAS:1}
    # The embedding values above and these prefixes only seed the first PRESENT search generation (MEM-135);
    # afterwards the Search settings page decides the model.
    query-prefix: ${MEMORYOS_EMBEDDING_QUERY_PREFIX:}
    document-prefix: ${MEMORYOS_EMBEDDING_DOCUMENT_PREFIX:}
    # Embedding provider keys use the Chat catalog's encryption key.
    provider-encryption-key: ${MEMORYOS_CHAT_CATALOG_ENCRYPTION_KEY:}
