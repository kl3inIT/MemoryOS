spring:
  config:
    import:
      - classpath:/memoryos-observability.yaml
      - classpath:/memoryos-search.yaml
  application:
    name: memoryos-worker
  main:
    keep-alive: true
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MEMORYOS_DATABASE_URL}
    username: ${MEMORYOS_DATABASE_USERNAME}
    password: ${MEMORYOS_DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
  data:
    redis:
      host: ${MEMORYOS_REDIS_HOST:localhost}
      port: ${MEMORYOS_REDIS_PORT:6379}
      username: ${MEMORYOS_REDIS_USERNAME:}
      password: ${MEMORYOS_REDIS_PASSWORD:}
      connect-timeout: ${MEMORYOS_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${MEMORYOS_REDIS_COMMAND_TIMEOUT:5s}
      ssl:
        enabled: ${MEMORYOS_REDIS_SSL_ENABLED:false}
      lettuce:
        shutdown-timeout: 1s
        pool:
          enabled: true
          max-active: ${MEMORYOS_REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${MEMORYOS_REDIS_POOL_MAX_IDLE:8}
          min-idle: ${MEMORYOS_REDIS_POOL_MIN_IDLE:0}
          max-wait: ${MEMORYOS_REDIS_POOL_MAX_WAIT:2s}

db-scheduler:
  enabled: true
  table-name: scheduled_tasks
  scheduler-name: ${MEMORYOS_SCHEDULER_NAME:}
  threads: 2
  polling-interval: 5s
  heartbeat-interval: 30s
  missed-heartbeats-limit: 4
  immediate-execution-enabled: true
  delay-startup-until-context-ready: true
  polling-strategy: fetch
  priority-enabled: false
  shutdown-max-wait: 30s

server:
  port: ${MEMORYOS_WORKER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis,dbScheduler,objectStorage

memoryos:
  google-drive:
    credential-encryption-key: ${MEMORYOS_GOOGLE_DRIVE_CREDENTIAL_ENCRYPTION_KEY:}
    credential-key-version: ${MEMORYOS_GOOGLE_DRIVE_CREDENTIAL_KEY_VERSION:}
    token-uri: ${MEMORYOS_GOOGLE_DRIVE_TOKEN_URI:https://oauth2.googleapis.com/token}
    drive-api-base-url: ${MEMORYOS_GOOGLE_DRIVE_API_BASE_URL:https://www.googleapis.com/drive/v3}
    sheets-api-base-url: ${MEMORYOS_GOOGLE_SHEETS_API_BASE_URL:https://sheets.googleapis.com/v4}
    docs-api-base-url: ${MEMORYOS_GOOGLE_DOCS_API_BASE_URL:https://docs.googleapis.com/v1}
    connect-timeout: 3s
    request-timeout: 30s
    acquisition-timeout: 120s
    page-size: 100
    max-requests: 256
    max-tabs: 100
    max-cells: 200000
    max-binary-bytes: 10485760
    max-snapshot-bytes: 33554432
  worker:
    enabled: true
  redis:
    topology-interval: 30s
    relay-interval: 1s
    rediscovery-delay: 2m
    transport-backoff: 5s
    consumer-block: 2s
    reclaim-interval: 10s
    reclaim-idle: 2m
    max-stream-depth: 1000
    ingestion:
      stream: memoryos:execution:ingestion:operations:v1
      group: memoryos:execution:ingestion:workers:v1
      batch-size: ${MEMORYOS_WORKER_INGESTION_BATCH_SIZE:8}
    cleanup:
      stream: memoryos:execution:cleanup:operations:v1
      group: memoryos:execution:cleanup:workers:v1
      batch-size: ${MEMORYOS_WORKER_CLEANUP_BATCH_SIZE:8}
    source-sync:
      stream: memoryos:execution:source-sync:operations:v1
      group: memoryos:execution:source-sync:workers:v1
      batch-size: ${MEMORYOS_WORKER_SOURCE_SYNC_BATCH_SIZE:2}
    selection-validation:
      stream: memoryos:execution:selection-validation:operations:v1
      group: memoryos:execution:selection-validation:workers:v1
      batch-size: ${MEMORYOS_WORKER_SELECTION_VALIDATION_BATCH_SIZE:2}
    user-file:
      stream: memoryos:execution:user-file:operations:v1
      group: memoryos:execution:user-file:workers:v1
      batch-size: ${MEMORYOS_WORKER_USER_FILE_BATCH_SIZE:1}
    search:
      stream: memoryos:execution:search:operations:v1
      group: memoryos:execution:search:workers:v1
      batch-size: ${MEMORYOS_WORKER_SEARCH_BATCH_SIZE:2}
  object-storage:
    upload:
      lifetime: ${MEMORYOS_OBJECT_UPLOAD_LIFETIME:15m}
      verification-lease: ${MEMORYOS_OBJECT_UPLOAD_VERIFICATION_LEASE:30s}
      adoption-timeout: ${MEMORYOS_OBJECT_UPLOAD_ADOPTION_TIMEOUT:5m}
      cleanup-lease: ${MEMORYOS_OBJECT_UPLOAD_CLEANUP_LEASE:1m}
      cleanup-batch-size: ${MEMORYOS_OBJECT_UPLOAD_CLEANUP_BATCH_SIZE:16}
    s3:
      service-endpoint: ${MEMORYOS_OBJECT_STORAGE_SERVICE_ENDPOINT}
      upload-endpoint: ${MEMORYOS_OBJECT_STORAGE_UPLOAD_ENDPOINT}
      region: ${MEMORYOS_OBJECT_STORAGE_REGION:us-east-1}
      bucket: ${MEMORYOS_OBJECT_STORAGE_BUCKET:memoryos}
      access-key: ${MEMORYOS_OBJECT_STORAGE_ACCESS_KEY}
      secret-key: ${MEMORYOS_OBJECT_STORAGE_SECRET_KEY}
      path-style-access: ${MEMORYOS_OBJECT_STORAGE_PATH_STYLE_ACCESS:true}
      readiness-key: ${MEMORYOS_OBJECT_STORAGE_READINESS_KEY:system/readiness}
      authorization-lifetime: ${MEMORYOS_OBJECT_UPLOAD_AUTHORIZATION_LIFETIME:10m}
      connect-timeout: ${MEMORYOS_OBJECT_STORAGE_CONNECT_TIMEOUT:2s}
      read-timeout: ${MEMORYOS_OBJECT_STORAGE_READ_TIMEOUT:30s}
