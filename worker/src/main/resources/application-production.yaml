db-scheduler:
  scheduler-name: ${MEMORYOS_SCHEDULER_NAME}

spring:
  data:
    redis:
      host: ${MEMORYOS_REDIS_HOST}
      port: ${MEMORYOS_REDIS_PORT}
      username: ${MEMORYOS_REDIS_USERNAME}
      password: ${MEMORYOS_REDIS_PASSWORD}
      connect-timeout: ${MEMORYOS_REDIS_CONNECT_TIMEOUT}
      timeout: ${MEMORYOS_REDIS_COMMAND_TIMEOUT}
      ssl:
        enabled: ${MEMORYOS_REDIS_SSL_ENABLED}
        bundle: memoryos-redis
      lettuce:
        pool:
          max-active: ${MEMORYOS_REDIS_POOL_MAX_ACTIVE}
          max-idle: ${MEMORYOS_REDIS_POOL_MAX_IDLE}
          min-idle: ${MEMORYOS_REDIS_POOL_MIN_IDLE}
          max-wait: ${MEMORYOS_REDIS_POOL_MAX_WAIT}
  ssl:
    bundle:
      pem:
        memoryos-redis:
          truststore:
            # A private certificate authority protects Redis; without this the client trusts only the
            # system store. The launcher stages MEMORYOS_REDIS_TLS_CA_FILE and exports this value.
            certificate: ${MEMORYOS_REDIS_TLS_CA_CERTIFICATE}
